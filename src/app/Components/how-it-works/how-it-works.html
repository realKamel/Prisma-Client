<section
  id="how"
  class="relative z-10 py-24 px-6 md:px-14 bg-[var(--surface)] border-y border-[var(--border)] backdrop-blur-sm"
>
  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-20">
      <span class="text-sm font-light text-[var(--purple-lt)] block mb-4" dir="rtl"
        >خطوات بسيطة
      </span>
      <h2 class="text-3xl md:text-5xl font-black text-[var(--ink)] tracking-tight">
        ابدأ في
        <span
          class="bg-gradient-to-r from-[var(--purple)] to-[var(--lavender)] bg-clip-text text-transparent"
          >أقل من دقيقتين</span
        >
      </h2>
    </div>

    <div class="relative grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 lg:gap-8">
      <div
        class="hidden lg:block absolute top-9 right-[12.5%] left-[12.5%] h-0.5 bg-gradient-to-r from-transparent via-[rgba(96,81,155,0.4)] to-transparent pointer-events-none"
      ></div>

      @for (step of steps; track step) {
        <div class="text-center px-4 group">
          <div
            class="w-18 h-18 rounded-full bg-[var(--surface2)] border-2 border-[rgba(96,81,155,0.3)] flex items-center justify-center text-3xl mx-auto mb-6 relative transition-all duration-200 group-hover:scale-115 group-hover:-rotate-6 group-hover:border-[var(--purple)] group-hover:shadow-[0_0_32px_rgba(96,81,155,0.3)]"
          >
            <span
              class="absolute -top-1.5 -left-1.5 w-6 h-6 rounded-full bg-[var(--purple)] text-[var(--ink)] text-xs font-black flex items-center justify-center font-sans shadow-md"
              >{{ step.num }}</span
            >
            <span>
              <ng-icon [name]="step.emoji"></ng-icon>
            </span>
          </div>
          <h3 class="text-base font-bold text-[var(--ink)] mb-2">{{ step.title }}</h3>
          <p class="text-xs text-[var(--lavender)] leading-relaxed max-w-[200px] mx-auto">
            {{ step.desc }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
