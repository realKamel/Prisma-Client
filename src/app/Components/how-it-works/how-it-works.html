<section class="how-it-works-section">

  <!-- Label -->
  <div class="how-label">خطوات بسيطة</div>

  <!-- Heading -->
  <h2 class="how-heading">ابدأ في <span class="accent">أقل من دقيقتين</span></h2>

  <!-- Track -->
  <div class="how-track">

    <div class="how-track-line" aria-hidden="true"></div>

    <!-- Steps -->
    <div class="how-steps">

      <div *ngFor="let step of steps" class="group how-step">

        <!-- Number badge -->
        <div class="how-badge">{{ step.number }}</div>

        <!-- Icon circle -->
        <div class="how-icon group-hover:-translate-y-1 group-hover:scale-105 transition-transform duration-200">
          <span class="how-icon-emoji">{{ step.emoji }}</span>
        </div>

        <!-- Title -->
        <div class="how-step-title">{{ step.title }}</div>

        <!-- Description -->
        <div class="how-step-desc">{{ step.description }}</div>

      </div>

    </div>

  </div>
</section>
