<section style="padding: 96px 0; text-align: center; position: relative;">

  <!-- Label -->
  <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
              color: var(--purple-lt); margin-bottom: 16px;">
    خطوات بسيطة
  </div>

  <!-- Heading -->
  <h2 style="font-size: clamp(36px, 5vw, 56px); font-weight: 900; letter-spacing: -1px;
             line-height: 1.15; margin-bottom: 64px; color: var(--ink);">
    ابدأ في <span class="accent">أقل من دقيقتين</span>
  </h2>

  <!-- Track -->
  <div style="position: relative; max-width: 960px; margin: 0 auto; padding: 0 40px;">

    <!-- Connecting line -->
    <div style="position: absolute; top: 56px; right: 10%; left: 10%; height: 1px; opacity: 0.5; pointer-events: none;
                background: linear-gradient(90deg, transparent, var(--border) 15%, var(--purple-lt) 50%, var(--border) 85%, transparent);">
    </div>

    <!-- Steps — plain flex so RTL doesn't break grid centering -->
    <div style="display: flex; flex-direction: row; justify-content: center;
                align-items: flex-start; gap: 24px; direction: ltr; position: relative; z-index: 1;">

      <div *ngFor="let step of steps"
           class="group"
           style="display: flex; flex-direction: column; align-items: center;
                  flex: 1; max-width: 220px; direction: rtl;">

        <!-- Number badge -->
        <div style="width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
                    background: var(--purple); box-shadow: 0 0 12px var(--purple-glow);
                    display: flex; align-items: center; justify-content: center;
                    font-size: 12px; font-weight: 900; color: #fff; margin-bottom: 8px; z-index: 2;">
          {{ step.number }}
        </div>

        <!-- Icon circle -->
        <div class="group-hover:-translate-y-1 group-hover:scale-105 transition-transform duration-200"
             style="width: 88px; height: 88px; border-radius: 50%; flex-shrink: 0;
                    background: var(--surface2); border: 1px solid var(--border);
                    display: flex; align-items: center; justify-content: center;
                    box-shadow: 0 8px 28px rgba(0,0,0,0.18); margin-bottom: 24px; z-index: 2;">
          <span style="font-size: 32px; line-height: 1;">{{ step.emoji }}</span>
        </div>

        <!-- Title -->
        <div style="font-size: 18px; font-weight: 900; color: var(--ink); margin-bottom: 8px;">
          {{ step.title }}
        </div>

        <!-- Description -->
        <div style="font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 180px; text-align: center;">
          {{ step.description }}
        </div>

      </div>
    </div>

  </div>
</section>
