<button (click)="theme.toggle()"
    aria-label="تبديل الوضع"
    class="btn-theme flex items-center justify-center
        w-10 h-10 rounded-full
        border border-(--border)
        bg-transparent
        text-(--ink2)
        cursor-pointer
        transition-colors duration-200"
>

  <!-- Moon icon — dark mode -->
  <i class="bi bi-moon ico-moon text-xl"></i>

  <!-- Sun icon — light mode -->
  <i class="bi bi-sun ico-sun text-xl"></i>
</button>
