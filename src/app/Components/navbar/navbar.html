<!-- <header class="navbar" [class.scrolled]="isScrolled()"> -->
<header
  class="navbar fixed top-0 left-0 right-0 z-200 flex items-center justify-between h-16 px-4 md:px-8 lg:px-14 bg-(--nav-bg) border-b border-(--border) backdrop-blur-[20px]"
>
  <!-- Logo -->
  <app-nav-logo />

  <!-- Desktop Links -->
  <nav class="hidden md:flex flex-1 justify-center">
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </nav>

  <!-- Desktop Actions -->
  <div class="flex items-center gap-2">
    <app-theme-toggle />

    @if (isLoggedIn()) {
      <div class="hidden md:block">
        <app-profile-menu [name]?="userName()" [email]?="userEmail()" />
      </div>
    } @else {
      <div class="hidden md:block">
        <app-auth-buttons />
      </div>
    }

    <!-- Hamburger — mobile only -->
    <button
      class="hamburger md:hidden flex flex-col justify-center gap-1.25 w-10 h-10 p-2.5 rounded-[10px] border border-(--border) bg-transparent cursor-pointer"
      (click)="toggleSidebar()"
      aria-label="القائمة"
    >
      <ng-icon
        name="bootstrapList"
        class="text-2xl flex justify-center items-center"
        [class.open]="isSidebarOpen()">
      </ng-icon>
    </button>
  </div>
</header>

<!-- Overlay -->
@if (isSidebarOpen()) {
  <div
    class="sidebar-overlay fixed inset-0 z-60 bg-black/50 backdrop-blur-xs"
    (click)="closeSidebar()"
  ></div>
}

<!-- Sidebar -->
<aside
  class="sidebar fixed top-16 right-0 w-70 h-[calc(100dvh-64px)] z-70 flex flex-col gap-6 p-6 bg-(--surface) border-l border-(--border)"
  [class.open]="isSidebarOpen()"
>
  <div class="flex items-center justify-between">
    <app-nav-logo />
    <button
      (click)="closeSidebar()"
      aria-label="إغلاق"
      class="flex items-center justify-center w-9 h-9 rounded-full border border-(--border) bg-transparent text-(--ink2) cursor-pointer transition-colors duration-200 hover:bg-[rgba(96,81,155,0.14)] hover:text-(--ink)"
    >
      <ng-icon name="lucideX"></ng-icon>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto">
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </div>

  <div class="flex flex-col gap-2 pt-4 border-t border-(--border)">
    @if (isLoggedIn()) {
      <app-profile-menu [name]?="userName()" [email]?="userEmail()" [isSidebar]="true" />
    } @else {
      <app-auth-buttons />
    }
  </div>
</aside>
