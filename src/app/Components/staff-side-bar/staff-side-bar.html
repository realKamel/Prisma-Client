<div class="fixed inset-0 bg-[#0a0a14]/60 backdrop-blur-[2px] z-[190] md:hidden transition-opacity"
  [class.hidden]="!isMobileMenuOpen()" (click)="toggleMobileMenu.emit()"></div>

<aside
  class="fixed inset-y-0 inset-s-0 inset-e-auto w-[240px] h-screen bg-[var(--surface)] border-e border-[var(--border)] flex flex-col z-[200] transition-transform duration-260 ease-out overflow-hidden md:w-[64px] lg:w-[240px] md:translate-x-0"
  [class.translate-x-0]="isMobileMenuOpen()" [class.translate-x-full]="!isMobileMenuOpen()">
  <div class="flex flex-col h-full w-full">
    <div class="flex items-center gap-3 p-5 border-b border-[var(--border)] shrink-0 justify-center lg:justify-start">
      <div
        class="w-10 h-10 rounded-full bg-[var(--purple)] text-white text-base font-black flex items-center justify-center shrink-0 shadow-[0_4px_12px_var(--purple-glow)]">
        {{ teacherInitial() }}
      </div>
      <div class="overflow-hidden transition-opacity duration-200 md:hidden lg:block">
        <div class="text-base font-bold text-[var(--ink)] whitespace-nowrap overflow-hidden text-ellipsis">
          {{teacherName() }}
        </div>
        <div class="text-xs font-normal text-[var(--muted)] mt-1">{{ teacherSubject() }}</div>
      </div>
    </div>

    <nav class="p-3 flex flex-col gap-1 flex-1 overflow-y-auto overflow-x-hidden scrollbar-none">
      @for (item of navItems(); track item.id) {
         <a [routerLink]="item.route"
        routerLinkActive="bg-[var(--purple)] text-white shadow-[0_4px_16px_var(--purple-glow)]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 p-3 rounded-xl no-underline text-base font-semibold text-[var(--ink2)] transition-all duration-200 whitespace-nowrap group justify-center lg:justify-start hover:bg-[var(--purple)]/10 hover:text-[var(--ink)]">
        <span
          class="w-5 h-5 shrink-0 opacity-70 group-hover:opacity-100 transition-opacity flex items-center justify-center">
          <ng-icon [name]="item.icon" />
        </span>
        <span class="transition-opacity duration-200 md:hidden lg:inline-block">
          {{ item.label }}
        </span>
      </a>
      }
    </nav>

    <div class="mt-auto p-3 border-t border-[var(--border)] flex flex-col gap-1 shrink-0 bg-[var(--surface)]">
      <button (click)="themeService.toggle()"
        class="flex items-center gap-3 p-3 rounded-xl bg-transparent border-0 text-[var(--ink2)] text-base font-semibold cursor-pointer transition-all duration-200 w-full text-right justify-center lg:justify-start hover:bg-[var(--purple)]/10 hover:text-[var(--ink)]">
        @if (themeService.theme() === 'dark') {
        <svg class="w-5 h-5 opacity-70 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M7.757 6.343l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z" />
        </svg>
        <span class="md:hidden lg:inline">الوضع المضيء</span>
        } @else {
        <svg class="w-5 h-5 opacity-70 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
        <span class="md:hidden lg:inline">الوضع المظلم</span>
        }
      </button>

      <button (click)="auth.logout()"
        class="flex items-center gap-3 p-3 rounded-xl no-underline text-[var(--coral)] text-base font-semibold transition-all duration-200 whitespace-nowrap justify-center lg:justify-start hover:bg-[var(--coral)]/10 cursor-pointer">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="md:hidden lg:inline">تسجيل الخروج</span>
      </button>
    </div>
  </div>
</aside>
