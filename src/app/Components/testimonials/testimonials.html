<section class="relative z-10 py-24 px-6 md:px-14 bg-[#272836] border-t border-[rgba(96,81,155,0.13)]">
  <div class="max-w-6xl mx-auto">
    <div class="text-center mb-12">
      <span class="text-sm font-light text-[#a497cd] block mb-4" dir="rtl">بيقولوا إيه؟</span>
      <h2 class="text-3xl md:text-5xl font-black text-[#ffffff] tracking-tight">أهالي وطلاب <span class="bg-gradient-to-r from-[#60519b] to-[#bfc0d1] bg-clip-text text-transparent ml-3">بيحبونا</span> <i class="bi bi-heart"></i></h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (review of reviews; track review.name) {
        <div class="bg-[#31323E] border border-[rgba(96,81,155,0.18)] rounded-3xl p-8 transition-all duration-200 hover:-translate-y-1 hover:border-[rgba(96,81,155,0.35)]">
          <div class="text-[#f7c948] text-xs tracking-widest mb-4">{{ review.stars }}</div>
          <p class="text-sm text-[#bfc0d1] leading-relaxed mb-6">"{{ review.body }}"</p>
          
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-[#60519b] text-[#ffffff] font-black flex items-center justify-center text-sm shadow-md">
              {{ review.avatar }}
            </div>
            <div>
              <div class="text-xs font-bold text-[#ffffff]">{{ review.name }}</div>
              <div class="text-[11px] text-[#bfc0d1] mt-0.5">{{ review.role }}</div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
