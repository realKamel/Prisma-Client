<section class="testimonials-section relative text-center reveal">
  <div class="page">

    <!-- Label -->
    <div class="text-xs font-bold tracking-widest uppercase mb-3"
         style="color: var(--purple-lt)">
      بيقولوا إيه؟
    </div>

    <!-- Heading -->
    <h2 class="text-4xl font-black tracking-tight leading-tight mb-10">
      أهالي وطلاب <span class="accent">بيحبونا</span> ❤️
    </h2>

    <!-- Cards grid -->
    <div class="testimonials-grid grid grid-cols-3 gap-5 max-lg:grid-cols-2 max-md:grid-cols-1">

      <div *ngFor="let t of testimonials" class="group testimonials-card">

        <div class="absolute inset-0 rounded-[24px] opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-300"></div>

        <!-- Stars -->
        <div class="flex justify-end gap-0.5 stars">
          <span *ngFor="let s of [1,2,3,4,5]" class="text-base">★</span>
        </div>

        <!-- Quote -->
        <p class="text-sm leading-relaxed flex-1 testimonial-quote">
          {{ t.quote }}
        </p>

        <!-- Author -->
        <div class="flex items-center justify-end gap-3 pt-3 testimonials-author">
          <div class="text-right">
            <div class="text-sm font-black author-name">{{ t.name }}</div>
            <div class="text-xs mt-0.5 author-role">{{ t.role }}</div>
          </div>
          <div class="avatar-initial w-9 h-9 rounded-full flex items-center justify-center text-sm font-black flex-shrink-0">
            {{ t.initial }}
          </div>
        </div>

      </div>

    </div>
  </div>
</section>
