<section class="py-16 px-6 md:px-14 bg-[var(--bg)]" dir="rtl">
  <div class="max-w-6xl mx-auto">

    <div class="text-center mb-12">
      <span class="text-xs font-light text-[var(--purple-lt)] block mb-3">بيقولوا إيه؟</span>
      <h2 class="text-4xl md:text-5xl font-black text-[var(--ink)]">
        أهالي وطلاب
        <span class="text-[var(--purple-lt)] ml-2">بيحبونا</span>
        <i class="bi bi-heart"></i>
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      @for (review of reviews(); track review.name) {
        <div class="bg-[var(--surface2)] border border-[var(--border)] rounded-[28px] p-7 flex flex-col gap-4 hover:-translate-y-1 transition-transform duration-200">

          <div class="text-[var(--star)] text-xs tracking-widest text-right">{{review.stars}}</div>

          <p class="text-sm text-[var(--lavender)] leading-relaxed text-right flex-1">
            {{ review.body }}
          </p>

          <div class="flex items-center gap-3 flex-row">
            
            <div class="w-10 h-10 rounded-full bg-[var(--purple)] text-white font-black text-sm flex items-center justify-center shrink-0">
              {{ review.avatar }}
            </div>
            
            <div class="text-right">
              <div class="text-xs font-bold text-[var(--ink)]">{{ review.name }}</div>
              <div class="text-[11px] text-[var(--lavender)] mt-0.5">{{ review.role }}</div>
            </div>

          </div>

        </div>
      }
    </div>

  </div>
</section>
