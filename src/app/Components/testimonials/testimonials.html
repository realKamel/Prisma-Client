<section class="relative text-center reveal"
         style="border-top: 1px solid var(--border); padding: 80px 0;">
  <div class="page">

    <!-- Label -->
    <div class="text-xs font-bold tracking-widest uppercase mb-3"
         style="color: var(--purple-lt)">
      بيقولوا إيه؟
    </div>

    <!-- Heading -->
    <h2 class="text-4xl font-black tracking-tight leading-tight mb-10"
        style="color: var(--ink)">
      أهالي وطلاب <span class="accent">بيحبونا</span> ❤️
    </h2>

    <!-- Cards grid -->
    <div class="grid grid-cols-3 gap-5 max-lg:grid-cols-2 max-md:grid-cols-1">

      <div *ngFor="let t of testimonials"
           class="group relative rounded-[24px] p-6 text-right flex flex-col gap-4 transition-all duration-300 hover:-translate-y-1"
           style="background: var(--surface2); border: 1px solid var(--border);">

        <div class="absolute inset-0 rounded-[24px] opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity duration-300"
             style="box-shadow: 0 0 40px var(--purple-glow);"></div>

        <!-- Stars -->
        <div class="flex justify-end gap-0.5">
          <span *ngFor="let s of [1,2,3,4,5]" class="text-base" style="color: var(--star)">★</span>
        </div>

        <!-- Quote -->
        <p class="text-sm leading-relaxed flex-1" style="color: var(--ink2)">
          {{ t.quote }}
        </p>

        <!-- Author -->
        <div class="flex items-center justify-end gap-3 pt-3"
             style="border-top: 1px solid var(--border);">
          <div class="text-right">
            <div class="text-sm font-black" style="color: var(--ink)">{{ t.name }}</div>
            <div class="text-xs mt-0.5" style="color: var(--muted)">{{ t.role }}</div>
          </div>
          <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black flex-shrink-0"
               style="background: var(--purple); color: #fff; box-shadow: 0 0 14px var(--purple-glow);">
            {{ t.initial }}
          </div>
        </div>

      </div>

    </div>
  </div>
</section>
