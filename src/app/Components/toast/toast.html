@if (svc.toast(); as t) {
  <div class="fixed inset-x-0 top-8 z-300 flex justify-center px-4 pointer-events-none">
    <div
      class="inline-flex items-center gap-2.5 rounded-full px-6 py-3 text-sm font-bold shadow-lg pointer-events-auto"
      [class]="t.type === 'success' ? 'bg-(--mint) text-bg' : 'bg-(--coral) text-white'"
    >
      @if (t.type === 'success') {
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
      } @else {
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
      }
      {{ t.message }}
    </div>
  </div>
}
