<div class="max-w-[1200px] mx-auto px-4 py-8 " dir="rtl">
  <app-log-page-header />

  <app-kpi-strip [stats]="stats()" />

  <div class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-5">
    <app-log-toolbar (searchChange)="onSearchChange($event)" />

    <app-filter-chips
      [activeFilter]="activeFilter()"
      [counts]="chipCounts()"
      (filterChange)="onFilterChange($event)"
    />

    <app-log-table [events]="pagedEvents()" />

    <app-log-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [totalItems]="filteredEvents().length"
      [pageSize]="8"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
