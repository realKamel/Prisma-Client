@if (totalItems() > 0) {
  <div class="flex items-center justify-between gap-3 flex-wrap mt-5">
    <div class="text-sm font-semibold text-[var(--muted)]">
      عرض {{ rangeStart | arabicNumerals }}–{{ rangeEnd | arabicNumerals }} من
      {{ totalItems() | arabicNumerals }} حدث
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        aria-label="الصفحة السابقة"
        class="w-9 h-9 rounded-[10px] border border-[var(--border)] bg-[var(--surface2)] text-[var(--ink2)] flex items-center justify-center hover:border-[var(--border-focus)] hover:text-[var(--ink)] transition-colors disabled:opacity-40 disabled:cursor-default"
        [disabled]="currentPage() === 1"
        (click)="goTo(currentPage() - 1)"
      >
        <i class="bi bi-chevron-left text-sm"></i>
      </button>

      @for (page of pages; track page) {
        <button
          type="button"
          class="w-9 h-9 rounded-[10px] border text-sm font-bold flex items-center justify-center transition-colors"
          [class]="
            page === currentPage()
              ? 'border-[var(--purple)] bg-[rgba(var(--accent-rgb),0.14)] text-[var(--purple-lt)]'
              : 'border-[var(--border)] bg-[var(--surface2)] text-[var(--ink2)] hover:border-[var(--border-focus)] hover:text-[var(--ink)]'
          "
          (click)="goTo(page)"
        >
          {{ page | arabicNumerals }}
        </button>
      }

      <button
        type="button"
        aria-label="الصفحة التالية"
        class="w-9 h-9 rounded-[10px] border border-[var(--border)] bg-[var(--surface2)] text-[var(--ink2)] flex items-center justify-center hover:border-[var(--border-focus)] hover:text-[var(--ink)] transition-colors disabled:opacity-40 disabled:cursor-default"
        [disabled]="currentPage() === totalPages()"
        (click)="goTo(currentPage() + 1)"
      >
        <i class="bi bi-chevron-right text-sm"></i>
      </button>
    </div>
  </div>
}
