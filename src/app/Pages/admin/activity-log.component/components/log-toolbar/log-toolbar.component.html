<div class="flex items-center gap-3 flex-wrap mb-4">
  <div class="relative flex-1 min-w-[200px]">
    <i
      class="bi bi-search absolute top-1/2 -translate-y-1/2 right-4 text-[var(--muted)] pointer-events-none"
    ></i>
    <input
      type="text"
      placeholder="ابحث باسم المستخدم أو الحدث..."
      class="w-full h-11 bg-[var(--surface2)] border border-[var(--border)] rounded-xl pr-11 pl-4 text-sm text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--purple)] transition-colors"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>

  <button
    type="button"
    class="inline-flex items-center gap-2 px-4 h-11 rounded-full border border-[var(--border)] bg-[var(--surface2)] text-[var(--ink2)] text-sm font-bold whitespace-nowrap hover:border-[var(--border-focus)] transition-colors disabled:opacity-60"
    [disabled]="exportState === 'exporting'"
    (click)="onExportClick()"
  >
    @if (exportState === 'idle') {
      <i class="bi bi-download text-base"></i>
      تصدير
    } @else if (exportState === 'exporting') {
      جاري التصدير...
    } @else {
      <i class="bi bi-check-lg text-base"></i>
      تم التصدير
    }
  </button>
</div>
