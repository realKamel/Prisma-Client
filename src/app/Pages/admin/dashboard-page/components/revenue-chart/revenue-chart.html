<div
  class="rounded-[20px] border border-[var(--border)] bg-[var(--surface)] p-6 flex flex-col h-[440px]"
>
  <div class="mb-4 flex items-start justify-between gap-4">
    <div>
      <div class="text-base font-bold text-[var(--ink)]">الإيرادات — آخر ٧ أيام</div>
      <div class="text-xs text-[var(--muted)] mt-1">
        إجمالي الأسبوع: {{ weeklyTotal() | number }} جنيه (جميع المعلمين)
      </div>
    </div>
    <span
      class="inline-flex items-center gap-1.5 rounded-full bg-[rgba(78,203,141,0.14)] px-3 py-1 text-xs font-bold text-[var(--mint)]"
    >
      <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-[var(--mint)]"></span>
      مباشر
    </span>
  </div>

  @if (loading()) {
    <div class="flex-1 flex items-center justify-center">
      <span class="text-xs text-[var(--muted)] animate-pulse">جارٍ تحميل البيانات...</span>
    </div>
  } @else {
    <apx-chart
      class="flex-1"
      [series]="chartOptions().series"
      [chart]="chartOptions().chart"
      [xaxis]="chartOptions().xaxis"
      [yaxis]="chartOptions().yaxis"
      [dataLabels]="chartOptions().dataLabels"
      [grid]="chartOptions().grid"
      [fill]="chartOptions().fill"
      [stroke]="chartOptions().stroke"
      [tooltip]="chartOptions().tooltip"
      [plotOptions]="chartOptions().plotOptions"
      [states]="chartOptions().states"
      [colors]="chartOptions().colors"
    />
  }
</div>
