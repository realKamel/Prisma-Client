<a
  [href]="url()"
  class="group relative flex items-start gap-4 overflow-hidden rounded-[20px] border border-[var(--border)] bg-[var(--surface)] p-6 no-underline transition-all duration-200 hover:-translate-y-1 hover:border-[var(--border-focus)] hover:shadow-[0_8px_32px_rgba(0,0,0,0.14)]"
>
  <span
    class="pointer-events-none absolute -top-10 -end-10 h-[120px] w-[120px] rounded-full opacity-[0.06] transition-opacity duration-200 group-hover:opacity-[0.12]"
    [ngClass]="blobClass()"
  ></span>

  <div class="flex h-[52px] w-[52px] flex-shrink-0 items-center justify-center rounded-2xl" [ngClass]="iconBgClass()">
    <i class="bi text-xl" [ngClass]="[icon(), iconColorClass()]" aria-hidden="true"></i>
  </div>

  <div class="min-w-0 flex-1">
    <div class="mb-1 text-base font-bold text-[var(--ink)]">{{ title() }}</div>
    <div class="mb-3 text-xs leading-relaxed text-[var(--muted)]">{{ subtitle() }}</div>
    <div class="inline-flex items-center gap-1.5 text-xs font-bold" [ngClass]="statTextClass()">
      <i class="bi bi-clock-history" aria-hidden="true"></i>
      {{ stat() }}
    </div>
  </div>

  <div class="flex-shrink-0 self-center text-[var(--muted)] transition-all duration-200 group-hover:-translate-x-1 group-hover:text-[var(--ink)]">
    <i class="bi bi-arrow-left text-lg" aria-hidden="true"></i>
  </div>
</a>
