<div class="text-xs font-bold text-[var(--purple-lt)] tracking-[0.08em] mb-4">
  // الأقسام الرئيسية
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <a
    routerLink="/dashboard/myfinances"
    class="group relative flex items-start gap-4 overflow-hidden rounded-[20px] border border-[var(--border)] bg-[var(--surface)] p-6 no-underline transition-all duration-200 hover:-translate-y-1 hover:border-[var(--border-focus)] hover:shadow-[0_8px_32px_rgba(0,0,0,0.14)]"
  >
    <span
      class="pointer-events-none absolute -top-10 -end-10 h-[120px] w-[120px] rounded-full bg-[var(--star)] opacity-[0.06] transition-opacity duration-200 group-hover:opacity-[0.12]"
    ></span>

    <div
      class="flex h-[52px] w-[52px] flex-shrink-0 items-center justify-center rounded-2xl bg-[rgba(247,201,72,0.16)]"
    >
      <ng-icon
        name="bootstrapCashStack"
        class="text-xl text-[var(--star)] flex items-center"
        aria-hidden="true"
      ></ng-icon>
    </div>

    <div class="min-w-0 flex-1">
      <div class="mb-1 text-base font-bold text-[var(--ink)]">المالية والأرباح</div>
      <div class="mb-3 text-xs leading-relaxed text-[var(--muted)]">
        الإيرادات الإجمالية، صرف المستحقات، نزاعات الاسترداد
      </div>
    </div>

    <div
      class="flex-shrink-0 self-center text-[var(--muted)] transition-all duration-200 group-hover:-translate-x-1 group-hover:text-[var(--ink)]"
    >
      <ng-icon
        name="bootstrapArrowLeft"
        class="text-lg flex items-center"
        aria-hidden="true"
      ></ng-icon>
    </div>
  </a>

  <a
    routerLink="/dashboard/users"
    class="group relative flex items-start gap-4 overflow-hidden rounded-[20px] border border-[var(--border)] bg-[var(--surface)] p-6 no-underline transition-all duration-200 hover:-translate-y-1 hover:border-[var(--border-focus)] hover:shadow-[0_8px_32px_rgba(0,0,0,0.14)]"
  >
    <span
      class="pointer-events-none absolute -top-10 -end-10 h-[120px] w-[120px] rounded-full bg-[var(--purple-lt)] opacity-[0.06] transition-opacity duration-200 group-hover:opacity-[0.12]"
    ></span>

    <div
      class="flex h-[52px] w-[52px] flex-shrink-0 items-center justify-center rounded-2xl bg-[rgba(139,92,246,0.16)]"
    >
      <ng-icon
        name="bootstrapPeopleFill"
        class="text-xl text-[var(--purple-lt)] flex items-center"
        aria-hidden="true"
      ></ng-icon>
    </div>

    <div class="min-w-0 flex-1">
      <div class="mb-1 text-base font-bold text-[var(--ink)]">إدارة المستخدمين</div>
      <div class="mb-3 text-xs leading-relaxed text-[var(--muted)]">
        الحسابات، الصلاحيات، الأدوار والتفعيل
      </div>
    </div>

    <div
      class="flex-shrink-0 self-center text-[var(--muted)] transition-all duration-200 group-hover:-translate-x-1 group-hover:text-[var(--ink)]"
    >
      <ng-icon
        name="bootstrapArrowLeft"
        class="text-lg flex items-center"
        aria-hidden="true"
      ></ng-icon>
    </div>
  </a>
</div>
