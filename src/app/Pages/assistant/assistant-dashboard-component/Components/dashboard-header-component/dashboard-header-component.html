<div class="flex items-end justify-between gap-4 mb-8">

  <!-- Right: titles -->
  <div>
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full mb-3
                bg-[rgba(var(--accent-rgb),.14)] border border-[rgba(var(--accent-rgb),.28)]">
      <span class="w-2 h-2 rounded-full bg-[var(--mint)] animate-pulse"></span>
      <span class="text-[11px] font-bold text-[var(--purple-lt)]">بوابة المساعد</span>
    </div>

    <p class="text-[11px] font-bold tracking-widest text-[var(--muted)] uppercase m-0 mb-1">
      // لوحة التحكم
    </p>
    <h1 class="text-[36px] font-black text-[var(--ink)] leading-none m-0 mb-2">
      أهلاً،&nbsp;
      <span style="background: linear-gradient(135deg, var(--purple-lt), #a08ee0, var(--lavender));
                   -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                   background-clip: text;">{{ teacherName }}</span>
    </h1>
    <p class="text-[14px] text-[var(--muted)] m-0">
      نظرة عامة على نشاطك ومهامك كمساعدة لـ {{ supervisorName }}
    </p>
  </div>

  <!-- Left: action buttons — aligned to bottom of the title block -->
  <div class="flex items-center gap-3 flex-shrink-0">
    <a
      href="/22-assistant-grant"
      class="flex items-center gap-2 h-[42px] px-5 rounded-full text-[13px] font-bold
             text-white no-underline whitespace-nowrap
             transition-all duration-150 hover:opacity-90 hover:-translate-y-px"
      style="background: var(--purple); box-shadow: 0 4px 16px var(--purple-glow); font-family: var(--font);"
    >
      <i class="bi bi-send-fill text-[13px]"></i>
      منح درس
    </a>

    <a
      href="/25-assistant-student-form"
      class="flex items-center gap-2 h-[42px] px-5 rounded-full text-[13px] font-bold
             text-[var(--ink2)] no-underline whitespace-nowrap
             transition-all duration-150 hover:text-[var(--ink)] hover:bg-[rgba(var(--accent-rgb),.1)]"
      style="border: 1.5px solid var(--border); background: var(--surface); font-family: var(--font);"
    >
      <i class="bi bi-person-plus-fill text-[13px]"></i>
      إضافة طالب
    </a>
  </div>

</div>
