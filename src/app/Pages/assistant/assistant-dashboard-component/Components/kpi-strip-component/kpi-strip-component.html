<div class="kpi-strip grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
  <div
    *ngFor="let kpi of kpis"
    class="relative rounded-[20px] overflow-hidden p-5 flex flex-col gap-3
           bg-[var(--surface)] border border-[var(--border)]
           transition-transform duration-200 hover:-translate-y-0.5"
  >
    <!-- Colored top border bar -->
    <div
      class="absolute top-0 inset-x-0 h-[3px] rounded-t-[20px]"
      [style]="variantClasses(kpi.variant).bar"
    ></div>

    <!-- Label -->
    <div class="text-[12px] font-semibold text-[var(--muted)] pt-1">
      {{ kpi.label }}
    </div>

    <!-- Value row: big number + unit -->
    <div class="flex items-baseline gap-2">
      <span
        #counter
        class="text-[40px] font-black leading-none"
        [style]="variantClasses(kpi.variant).valueStyle"
      >٠</span>
      <span class="text-[14px] font-bold text-[var(--muted)]">{{ kpi.unit }}</span>
    </div>

    <!-- Delta -->
    <div
      class="flex items-center gap-1 text-[12px] font-bold"
      [style]="variantClasses(kpi.variant).deltaStyle"
    >
      <i class="bi text-[11px]"
         [ngClass]="kpi.trend === 'up' ? 'bi-arrow-up-right' : 'bi-arrow-down-left'"></i>
      {{ kpi.delta }}
    </div>
  </div>
</div>
