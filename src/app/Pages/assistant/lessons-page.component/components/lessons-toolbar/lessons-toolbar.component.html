<div class="flex flex-col gap-3 sm:flex-row sm:items-center">
  <div class="relative flex-1">
    <i class="bi bi-search absolute right-4 top-1/2 -translate-y-1/2 text-[var(--muted)]"></i>
    <input
      type="text"
      autocomplete="off"
      placeholder="ابحث عن درس..."
      aria-label="ابحث عن درس"
      [value]="query()"
      (input)="onInput($any($event.target).value)"
      class="w-full rounded-lg border border-[var(--border)] bg-[var(--surface)] py-3 pr-11 pl-4 text-sm text-[var(--ink)] placeholder:text-[var(--muted)] outline-none transition-colors focus:border-[var(--purple)] focus:shadow-[0_0_0_4px_rgba(var(--accent-rgb),.14)]" />
  </div>

  <div class="flex gap-3">
   <a routerLink="/dashboard/mylessons/upload-materials"
     class="flex items-center gap-2 h-[42px] px-4 rounded-[24px] text-[13px] font-bold
            text-[var(--ink2)] no-underline whitespace-nowrap
            transition-all duration-150 hover:text-[var(--ink)]"
     style="background:rgba(255,255,255,.06); border:1.5px solid var(--border); font-family:var(--font);">
    <i class="bi bi-cloud-upload text-[15px]"></i>
    رفع مواد
  </a>
     <a routerLink="/dashboard/mylessons/add"
     class="flex items-center gap-2 h-[42px] px-4 rounded-[24px] text-[13px] font-bold
            text-white no-underline whitespace-nowrap
            transition-all duration-150 hover:opacity-90 hover:-translate-y-px"
     style="background:var(--purple); box-shadow:0 4px 16px var(--purple-glow); font-family:var(--font);">
    <i class="bi bi-plus-lg text-[15px]"></i>
    إضافة درس جديد
  </a>
  </div>
</div>
