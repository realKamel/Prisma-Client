<!-- Loading state -->
@if (loading()) {
  <div class="min-h-screen flex items-center justify-center bg-[var(--bg)]">
    <div class="flex flex-col items-center gap-4 text-[var(--muted)]">
      <ng-icon
        name="bootstrapArrowRepeat"
        class="text-4xl animate-spin text-[var(--purple-lt)] flex items-center"
        aria-hidden="true"
      ></ng-icon>
      <span class="text-sm font-semibold">جارٍ تحميل السجل…</span>
    </div>
  </div>
}

<!-- Error state -->
@if (error() && !loading()) {
  <div class="min-h-screen flex items-center justify-center bg-[var(--bg)]">
    <div class="flex flex-col items-center gap-4 text-center p-8">
      <ng-icon
        name="bootstrapExclamationCircle"
        class="text-4xl text-[var(--coral)] flex items-center"
        aria-hidden="true"
      ></ng-icon>
      <p class="text-sm font-semibold text-[var(--muted)]">
        تعذّر تحميل البيانات. تحقق من الاتصال وأعد المحاولة.
      </p>
      <button
        (click)="loadData()"
        class="px-4 py-2 rounded-xl bg-[var(--purple)] text-white text-sm font-bold hover:opacity-90 transition-opacity"
      >
        إعادة المحاولة
      </button>
    </div>
  </div>
}

<!-- Main page -->
@if (!loading() && !error()) {
  <div dir="rtl" class="min-h-screen bg-[var(--bg)] text-[var(--ink)] font-[var(--font)]">
    <div class="max-w-6xl mx-auto px-4 py-8">
      <!-- Page Header -->
      <app-page-header />

      <!-- KPI Strip -->
      <app-kpi-strip [meta]="meta()" />

      <!-- Log Card -->
      <div class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-6 shadow-sm">
        <!-- Card head -->
        <div class="flex items-center justify-between mb-5">
          <span class="text-base font-black text-[var(--ink)]">سجل الإجراءات</span>
          <span
            class="text-xs font-bold px-3 py-1.5 rounded-full bg-[rgba(var(--accent-rgb),0.12)] text-[var(--purple-lt)]"
          >
            {{ filteredLogs().length }} إجراء
          </span>
        </div>

        <!-- Filter Chips -->
        <app-filter-chips
          [logs]="allLogs()"
          [activeFilter]="activeFilter()"
          (filterChange)="onFilterChange($event)"
        />

        <!-- Table or Empty state -->
        @if (pagedLogs().length > 0) {
          <app-log-table [logs]="pagedLogs()" />
        } @else {
          <app-empty-state />
        }

        <!-- Pagination -->
        <app-pagination
          [total]="filteredLogs().length"
          [perPage]="perPage()"
          [currentPage]="currentPage()"
          (pageChange)="onPageChange($event)"
        />
      </div>

      <!-- Back link -->
      <div class="mt-6">
        <a
          routerLink="/dashboard/assistant"
          class="inline-flex items-center gap-2 text-sm font-semibold text-[var(--muted)] hover:text-[var(--ink2)] transition-colors no-underline"
        >
          <ng-icon
            name="bootstrapChevronRight"
            class="text-sm flex items-center"
            aria-hidden="true"
          ></ng-icon>
          العودة للوحة التحكم
        </a>
      </div>
    </div>
  </div>
}
