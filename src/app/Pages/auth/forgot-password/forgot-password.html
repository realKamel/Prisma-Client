<main class="min-h-screen flex items-center justify-center px-6 py-24">
  <div
    class="relative z-10 w-full max-w-[480px] border rounded-[var(--radius-card)] p-10 animate-[cardIn_600ms_var(--ease-out)_both]"
    style="background:var(--surface); border-color:var(--border); box-shadow:0 32px 80px rgba(0,0,0,0.27), 0 0 0 1px rgba(var(--accent-rgb),0.08)">

    <!-- Top accent line -->
    <div
      class="absolute top-0 left-0 right-0 h-[2px] rounded-t-[var(--radius-card)] opacity-70"
      style="background:linear-gradient(90deg,transparent,var(--purple),var(--purple-lt),transparent)">
    </div>

    <!-- Success overlay -->
    <div
      class="absolute inset-0 rounded-[var(--radius-card)] flex flex-col items-center justify-center gap-5 z-10 transition-opacity duration-300 p-8"
      [class.opacity-0]="!showSuccess"
      [class.opacity-100]="showSuccess"
      [class.pointer-events-none]="!showSuccess"
      [class.pointer-events-auto]="showSuccess"
      style="background:var(--surface)">

      <!-- Success Icon (Green Check Circle) -->
      <div
        class="rounded-full flex items-center justify-center animate-[popIn_500ms_200ms_var(--ease-spring)_both] flex-shrink-0"
        style="width:88px; height:88px; background:rgba(78,203,141,0.15); border:1.5px solid rgba(78,203,141,0.35);">
        <svg width="44" height="44" fill="none" viewBox="0 0 24 24" stroke="#4ECB8D" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <div class="text-2xl font-black text-center tracking-tight" style="color:var(--ink)">
        تم تغيير كلمة المرور!
      </div>

      <p class="text-xs text-center" style="color:var(--muted)">
        دلوقتي تقدر تسجل دخولك بالكلمة الجديدة
      </p>

      <button class="fp-btn" style="max-width:280px" (click)="goToLogin()">
        سجّل دخولك دلوقتي
      </button>
    </div>

    <!-- Steps -->
    <app-step-contact
      *ngIf="currentStep === 1"
      (submitted)="onContactSubmitted($event)">
    </app-step-contact>

    <app-step-otp
      *ngIf="currentStep === 2"
      [contactValue]="contactValue"
      (verified)="onOtpVerified()"
      (back)="onBackToContact()">
    </app-step-otp>

    <app-step-new-password
      *ngIf="currentStep === 3"
      (saved)="onPasswordSaved()">
    </app-step-new-password>

  </div>
</main>
