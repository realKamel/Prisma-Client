<div class="animate-[fadeSlideUp_440ms_var(--ease-out)_both]">

  <!-- Logo -->
  <div class="flex items-center justify-center gap-3 mb-7">
    <div
      class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl font-black text-white"
      style="background:var(--purple); box-shadow:0 0 24px var(--purple-glow)">
      أ
    </div>
    <span class="text-2xl font-black" style="color:var(--ink)">منصة أ</span>
  </div>

  <h2 class="text-2xl font-black text-center tracking-tight mb-1.5" style="color:var(--ink)">
    كلمة مرور جديدة
  </h2>
  <p class="text-xs text-center leading-relaxed mb-8 flex items-center justify-center gap-1.5" style="color:var(--muted)">
    <span>اختار كلمة مرور قوية ومش هتنساها</span>
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
    </svg>
  </p>

  <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()" novalidate>

    <!-- New password -->
    <div class="flex flex-col gap-2">
      <label
        class="text-xs font-bold flex items-center gap-2"
        for="new-password"
        style="color:var(--ink2)">
        <span>كلمة المرور الجديدة</span>
        <span style="color:var(--coral)">*</span>
      </label>

      <div class="relative">
        <span class="absolute top-1/2 right-3.5 -translate-y-1/2 text-[var(--muted)] pointer-events-none">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </span>
        <input
          id="new-password"
          class="w-full h-[50px] border-2 rounded-[14px] px-11 text-base font-semibold outline-none transition-all duration-200"
          [style.background]="'var(--surface2)'"
          [style.color]="'var(--ink)'"
          [style.font-family]="'var(--font)'"
          [style.border-color]="newError
            ? 'var(--coral)'
            : !newError && newPassword.length >= 8
              ? 'var(--mint)'
              : 'var(--border)'"
          [style.box-shadow]="newError
            ? '0 0 0 4px rgba(240,106,106,0.09)'
            : !newError && newPassword.length >= 8
              ? '0 0 0 4px rgba(78,203,141,0.09)'
              : 'none'"
          [type]="showNew ? 'text' : 'password'"
          placeholder="على الأقل 8 حروف"
          [(ngModel)]="newPassword"
          name="newPassword"
          (input)="onNewPasswordInput()"
          (blur)="onNewPasswordBlur()"
          autocomplete="new-password">
        
        <button
          class="absolute top-1/2 left-3.5 -translate-y-1/2 bg-transparent border-none p-0 cursor-pointer transition-colors duration-150 text-[var(--muted)] hover:text-[var(--ink)]"
          type="button"
          (click)="showNew = !showNew"
          aria-label="إظهار كلمة المرور">
          <svg class="w-4 h-4" *ngIf="!showNew" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <svg class="w-4 h-4" *ngIf="showNew" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <!-- Strength meter -->
      <div *ngIf="strength" class="mt-2">
        <div
          class="h-1 rounded-full overflow-hidden mb-1.5"
          style="background:rgba(var(--accent-rgb),0.1)">
          <div
            class="h-full rounded-full transition-all duration-300"
            [style.width]="strengthWidth()"
            [style.background]="strengthColor()">
          </div>
        </div>
        <span
          class="text-xs transition-colors duration-300"
          [style.font-family]="'var(--mono)'"
          [style.color]="strengthColor()">
          {{ strengthLabel }}
        </span>
      </div>

      <!-- Error -->
      <span
        class="text-xs flex items-center gap-1 overflow-hidden transition-all duration-200"
        [style.font-family]="'var(--mono)'"
        [style.color]="'var(--coral)'"
        [style.max-height]="newError ? '40px' : '0'"
        [style.opacity]="newError ? '1' : '0'">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
        {{ newError }}
      </span>
    </div>

    <!-- Confirm password -->
    <div class="flex flex-col gap-2">
      <label
        class="text-xs font-bold flex items-center gap-2"
        for="confirm-password"
        style="color:var(--ink2)">
        <span>تأكيد كلمة المرور</span>
        <span style="color:var(--coral)">*</span>
      </label>

      <div class="relative">
        <span class="absolute top-1/2 right-3.5 -translate-y-1/2 text-[var(--muted)] pointer-events-none">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </span>
        <input
          id="confirm-password"
          class="w-full h-[50px] border-2 rounded-[14px] px-11 text-base font-semibold outline-none transition-all duration-200"
          [style.background]="'var(--surface2)'"
          [style.color]="'var(--ink)'"
          [style.font-family]="'var(--font)'"
          [style.border-color]="confirmError
            ? 'var(--coral)'
            : !confirmError && confirmPassword === newPassword && confirmPassword.length > 0
              ? 'var(--mint)'
              : 'var(--border)'"
          [style.box-shadow]="confirmError
            ? '0 0 0 4px rgba(240,106,106,0.09)'
            : !confirmError && confirmPassword === newPassword && confirmPassword.length > 0
              ? '0 0 0 4px rgba(78,203,141,0.09)'
              : 'none'"
          [type]="showConfirm ? 'text' : 'password'"
          placeholder="نفس كلمة المرور"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          (blur)="onConfirmBlur()"
          autocomplete="new-password">
        
        <button
          class="absolute top-1/2 left-3.5 -translate-y-1/2 bg-transparent border-none p-0 cursor-pointer transition-colors duration-150 text-[var(--muted)] hover:text-[var(--ink)]"
          type="button"
          (click)="showConfirm = !showConfirm"
          aria-label="إظهار كلمة المرور">
          <svg class="w-4 h-4" *ngIf="!showConfirm" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <svg class="w-4 h-4" *ngIf="showConfirm" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <!-- Error -->
      <span
        class="text-xs flex items-center gap-1 overflow-hidden transition-all duration-200"
        [style.font-family]="'var(--mono)'"
        [style.color]="'var(--coral)'"
        [style.max-height]="confirmError ? '40px' : '0'"
        [style.opacity]="confirmError ? '1' : '0'">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
        {{ confirmError }}
      </span>
    </div>

    <button class="fp-btn" type="submit" [disabled]="loading">
      <span [style.opacity]="loading ? '0' : '1'">حفظ كلمة المرور</span>
      <span
        *ngIf="loading"
        class="absolute inset-0 flex items-center justify-center"
        aria-hidden="true">
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </span>
    </button>

  </form>
</div>
