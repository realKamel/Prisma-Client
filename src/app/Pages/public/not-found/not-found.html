<main class="min-h-screen flex items-center justify-center px-5 py-20 md:px-10 z-10 relative text-[var(--ink)] antialiased">
  <canvas id="stars-canvas" class="absolute inset-0 pointer-events-none z-0" aria-hidden="true"></canvas>
  <div class="blob blob-1 absolute pointer-events-none opacity-20"></div>
  <div class="blob blob-2 absolute pointer-events-none opacity-20"></div>

  <div class="flex flex-col items-center text-center max-w-[560px] w-full z-10">

    <div class="relative mb-10 w-full flex justify-center items-center h-[240px]">
      
      <div class="absolute w-[160px] h-[160px] rounded-full border border-dashed border-[rgba(var(--accent-rgb),0.2)] animate-spin-cw pointer-events-none">
        <div class="absolute w-2 h-2 rounded-full top-[-4px] left-1/2 -ml-1 bg-[var(--purple-lt)] shadow-[0_0_8px_var(--purple-lt)]"></div>
      </div>
      
      <div class="absolute w-[220px] h-[220px] rounded-full border border-dashed border-[rgba(var(--accent-rgb),0.2)] animate-spin-ccw pointer-events-none">
        <div class="absolute w-2 h-2 rounded-full top-[-4px] left-1/2 -ml-1 bg-[var(--mint)] shadow-[0_0_8px_var(--mint)]"></div>
      </div>

      <div class="text-[clamp(100px,20vw,160px)] font-[900] leading-none tracking-[-6px] bg-gradient-to-br from-[var(--purple-lt)] to-[var(--mint)] bg-clip-text text-transparent select-none animate-float-num" aria-hidden="true">
        ٤٠٤
      </div>

      <div class="absolute top-1/2 left-1/2 w-20 h-20 rounded-[22px] bg-[#080612]/85 border border-[rgba(var(--accent-rgb),0.3)] flex items-center justify-center shadow-[0_0_40px_rgba(var(--accent-rgb),0.2)] animate-float-icon">
        <i class="bi bi-patch-question-fill text-4xl"></i>
      </div>
    </div>

    <div class="text-xs font-bold text-[var(--muted)] tracking-[.08em] uppercase mb-2.5">خطأ ٤٠٤</div>
    <h1 class="text-[clamp(22px,5vw,32px)] font-[900] text-[var(--ink)] tracking-[-.4px] mb-3">عذرًا، هذه الصفحة غير موجودة!</h1>
    <p class="text-sm md:text-[15px] text-[var(--muted)] max-w-[400px] mb-9 leading-relaxed">
      يبدو أن الرابط الذي وصلت منه خاطئ أو أن هذه الصفحة انتقلت لمكان آخر.
      لا تقلق — مكتبة دروسنا في انتظارك!
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center w-full max-w-[280px] sm:max-w-none mb-12">
      <a [routerLink]="['/']" class="inline-flex items-center justify-center gap-2 h-[50px] px-7 rounded-[14px] bg-[var(--purple)] text-white text-[15px] font-bold no-underline cursor-pointer transition-all duration-200 hover:opacity-90 hover:-translate-y-0.5 shadow-[0_4px_20px_var(--purple-glow)] w-full sm:w-auto">
        <i class="bi bi-house-door"></i>
        العودة للرئيسية
      </a>
      <a [routerLink]="['/lessons']" class="inline-flex items-center justify-center gap-2 h-[50px] px-6 rounded-[14px] border border-[var(--border)] bg-transparent text-[var(--muted)] text-[15px] font-bold no-underline cursor-pointer transition-colors duration-200 hover:text-[var(--ink)] hover:border-[var(--ink2)] w-full sm:w-auto">
        <i class="bi bi-mortarboard"></i>
        تصفح الدروس
      </a>
    </div>

    <div class="text-xs font-bold text-[var(--muted)] uppercase tracking-[.07em] mb-3.5">أو انتقل مباشرةً إلى</div>
    <div class="flex flex-wrap gap-2.5 justify-center">
      <a [routerLink]="['/dashboard']" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[var(--surface2)] border border-[var(--border)] text-[var(--ink2)] text-[13px] font-semibold no-underline transition-all duration-200 hover:border-[var(--purple-lt)] hover:bg-[rgba(var(--accent-rgb),0.12)] hover:text-[var(--purple-lt)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm8 0a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5z"/>
        </svg>
        لوحتي
      </a>
      <a [routerLink]="['/history']" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[var(--surface2)] border border-[var(--border)] text-[var(--ink2)] text-[13px] font-semibold no-underline transition-all duration-200 hover:border-[var(--purple-lt)] hover:bg-[rgba(var(--accent-rgb),0.12)] hover:text-[var(--purple-lt)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.742c-.934-.768-2.336-.754-3.574-.555-1.143.183-2.183.625-2.926.934zm7.553.743a5.5 5.5 0 0 1 3.134-.752c1.233.124 2.503.523 3.388.893v9.923c-.743-.309-1.783-.75-2.926-.934-1.24-.199-2.64-.213-3.574.555zm.447-.744L9 2.757-.553.743Z"/>
        </svg>
        دروسي
      </a>
      <a [routerLink]="['/']" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-[var(--surface2)] border border-[var(--border)] text-[var(--ink2)] text-[13px] font-semibold no-underline transition-all duration-200 hover:border-[var(--purple-lt)] hover:bg-[rgba(var(--accent-rgb),0.12)] hover:text-[var(--purple-lt)]">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.424-1.248 1.14-1.643 2.056H7.5zM6.573 4.133c.337.954.78 1.691 1.282 2.146V4.133zM7.5 7.278c-.524-.455-1.011-1.222-1.353-2.222H4.114c.242.868.618 1.642 1.096 2.222zm-.544 1.444A13 13 0 0 1 5.21 6.5H2.2c-.164.555-.249 1.142-.25 1.742zm-4.735 1h2.97a13 13 0 0 1 .544 2.222H1.916a7 7 0 0 1-.695-2.222zm2.97-3H1.916a7 7 0 0 1 .695-2.222h2.97c-.241.868-.426 1.642-.544 2.222M6.573 11.867c.337-.954.78-1.691 1.282-2.146v2.146zm1.427 2.19c.67-.424 1.248-1.14 1.643-2.056H8.5zm0-3.134c.524.455 1.011 1.222 1.353 2.222h2.033a7 7 0 0 0-1.096-2.222zm1.353-1H13.79a7 7 0 0 0 .01-1.484h-3c.121.57.232 1.24.29 1.484M10.21 6.5h3a7 7 0 0 0-.009-1.484h-3a13 13 0 0 1-.29 1.484M13.79 8.742c.164-.555.249-1.142.25-1.742h-2.97a13 13 0 0 1-.544 2.222zm-4.735 3c-.241-.868-.426-1.642-.544-2.222h2.97c.242.868.425 1.642.544 2.222M9.427 11.867c-.337-.954-.78-1.691-1.282-2.146v2.146zM8.5 2.133v2.001h1.643c-.395-.916-.973-1.632-1.643-2.056m-.5-1.143a7 7 0 0 0-1.009v2.047H7.5V1H8zm1-.009a7 7 0 0 1 1 .009v2.047h-.5V1H9zm-.5 14.009a7 7 0 0 1-1-.009v-2.047H7.5v2.056H8zm1 .009a7 7 0 0 0 1-.009v-2.047h-.5v2.056H9z"/>
        </svg>
        الصفحة الرئيسية
      </a>
    </div>

  </div>
</main>
