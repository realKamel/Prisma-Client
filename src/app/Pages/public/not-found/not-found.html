<main
  class="min-h-screen flex items-center justify-center px-5 py-20 md:px-10 z-10 relative text-(--ink) antialiased"
>
  <canvas
    id="stars-canvas"
    class="absolute inset-0 pointer-events-none z-0"
    aria-hidden="true"
  ></canvas>
  <div class="blob blob-1 absolute pointer-events-none opacity-20"></div>
  <div class="blob blob-2 absolute pointer-events-none opacity-20"></div>

  <div class="flex flex-col items-center text-center max-w-140 w-full z-10">
    <div class="relative mb-10 w-full flex justify-center items-center h-60">
      <div
        class="absolute w-40 h-40 rounded-full border border-dashed border-[rgba(var(--accent-rgb),0.2)] animate-spin-cw pointer-events-none"
      >
        <div
          class="absolute w-2 h-2 rounded-full -top-1 left-1/2 -ml-1 bg-(--purple-lt) shadow-[0_0_8px_var(--purple-lt)]"
        ></div>
      </div>

      <div
        class="absolute w-55 h-55 rounded-full border border-dashed border-[rgba(var(--accent-rgb),0.2)] animate-spin-ccw pointer-events-none"
      >
        <div
          class="absolute w-2 h-2 rounded-full -top-1 left-1/2 -ml-1 bg-(--mint) shadow-[0_0_8px_var(--mint)]"
        ></div>
      </div>

      <div
        class="text-[clamp(100px,20vw,160px)] font-black leading-none tracking-[-6px] bg-linear-to-br from-(--purple-lt) to-(--mint) bg-clip-text text-transparent select-none animate-float-num"
        aria-hidden="true"
      >
        ٤٠٤
      </div>

      <div
        class="absolute top-1/2 left-1/2 w-20 h-20 rounded-[22px] bg-[#080612]/85 border border-[rgba(var(--accent-rgb),0.3)] flex items-center justify-center shadow-[0_0_40px_rgba(var(--accent-rgb),0.2)] animate-float-icon"
      >
        <i class="bi bi-patch-question-fill text-4xl text-white"></i>
      </div>
    </div>

    <div class="text-xs font-bold text-(--muted) tracking-[.08em] uppercase mb-2.5">خطأ ٤٠٤</div>
    <h1 class="text-[clamp(22px,5vw,32px)] font-black text-(--ink) tracking-[-.4px] mb-3">
      عذرًا، هذه الصفحة غير موجودة!
    </h1>
    <p class="text-sm md:text-[15px] text-(--muted) max-w-100 mb-9 leading-relaxed">
      يبدو أن الرابط الذي وصلت منه خاطئ أو أن هذه الصفحة انتقلت لمكان آخر. لا تقلق — مكتبة دروسنا في
      انتظارك!
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center w-full max-w-70 sm:max-w-none mb-12">
      <a
        [routerLink]="['/']"
        class="inline-flex items-center justify-center gap-2 h-12.5 px-7 rounded-[14px] bg-(--purple) text-white text-[15px] font-bold no-underline cursor-pointer transition-all duration-200 hover:opacity-90 hover:-translate-y-0.5 shadow-[0_4px_20px_var(--purple-glow)] w-full sm:w-auto"
      >
        <i class="bi bi-house-door"></i>
        العودة للرئيسية
      </a>
    </div>

    @if (auth.isLoggedIn()) {
      <div class="text-xs font-bold text-(--muted) uppercase tracking-[.07em] mb-3.5">
        أو انتقل مباشرةً إلى
      </div>
      <div class="flex flex-wrap gap-2.5 justify-center">
        <a
          [routerLink]="['/dashboard']"
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-(--surface2) border border-(--border) text-(--ink2) text-[13px] font-semibold no-underline transition-all duration-200 hover:border-(--purple-lt) hover:bg-[rgba(var(--accent-rgb),0.12)] hover:text-(--purple-lt)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5zm8 0a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5z"
            />
          </svg>
          لوحتي
        </a>
        <a
          [routerLink]="['/history']"
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-(--surface2) border border-(--border) text-(--ink2) text-[13px] font-semibold no-underline transition-all duration-200 hover:border-(--purple-lt) hover:bg-[rgba(var(--accent-rgb),0.12)] hover:text-(--purple-lt)"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            fill="currentColor"
            viewBox="0 0 16 16"
          >
            <path
              d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.063 3.112.752v9.742c-.934-.768-2.336-.754-3.574-.555-1.143.183-2.183.625-2.926.934zm7.553.743a5.5 5.5 0 0 1 3.134-.752c1.233.124 2.503.523 3.388.893v9.923c-.743-.309-1.783-.75-2.926-.934-1.24-.199-2.64-.213-3.574.555zm.447-.744L9 2.757-.553.743Z"
            />
          </svg>
          دروسي
        </a>
        <a
          [routerLink]="['/lessons']"
          class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-(--surface2) border border-(--border) text-(--ink2) text-[13px] font-semibold no-underline transition-all duration-200 hover:border-(--purple-lt) hover:bg-[rgba(var(--accent-rgb),0.12)] hover:text-(--purple-lt)"
        >
          <i class="bi bi-mortarboard"></i>
          تصفح الدروس
        </a>
      </div>
    }
  </div>
</main>
