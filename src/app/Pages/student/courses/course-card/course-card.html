<!-- Removed (click) from the article. It is now purely visual with hover effects -->
<article
    class="group relative flex flex-col overflow-hidden bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] shadow-[0_12px_28px_rgba(0,0,0,0.15)] transition-all duration-300 hover:-translate-y-1.5 hover:shadow-[0_26px_56px_rgba(0,0,0,0.29),0_0_0_1px_var(--border-focus)] cursor-none"
    [ngClass]="{
    'opacity-80 hover:-translate-y-0.5': course.status === 'locked',
    'opacity-60 grayscale hover:-translate-y-0.5': course.status === 'expired'
  }">

    <!-- Poster -->
    <div class="relative h-[130px] flex items-end p-4 overflow-hidden bg-gradient-to-br from-[#1f4a3a] to-[#4ecb8d]">
        <div class="absolute inset-0 pointer-events-none"
            style="background: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.16) 0%, transparent 45%), radial-gradient(circle at 75% 75%, rgba(255,255,255,0.06) 0%, transparent 50%);">
        </div>
        <span class="absolute top-2 left-3 text-5xl leading-none opacity-20 font-black text-white"
            [innerHTML]="course.iconSvg"></span>
        <span
            class="relative z-10 inline-flex items-center gap-2 text-xs font-bold tracking-wider font-[var(--mono)] text-white bg-black/30 border border-white/20 px-2 py-1 rounded-full w-fit backdrop-blur-md">
            {{ course.subject }}
        </span>

        <!-- Locked Overlay -->
        <div class="absolute inset-0 z-[3] bg-[rgba(10,10,20,0.56)] flex items-center justify-center backdrop-blur-[1px]"
            *ngIf="course.status === 'locked'">
            <svg class="w-8 h-8 text-white/90 drop-shadow-[0_2px_8px_rgba(0,0,0,0.5)]" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
        </div>
    </div>

    <!-- Status Pill -->
    <span
        class="absolute top-3 right-3 z-[4] inline-flex items-center gap-1 text-xs font-bold tracking-wide font-[var(--mono)] px-3 py-1 rounded-full backdrop-blur-md before:content-[''] before:w-1.5 before:h-1.5 before:rounded-full before:shrink-0"
        [ngClass]="{
      'bg-[rgba(var(--accent-rgb),0.22)] text-[var(--purple-lt)] border border-[rgba(var(--accent-rgb),0.40)] before:bg-[var(--purple-lt)]': course.status === 'avail',
      'bg-[rgba(78,203,141,0.16)] text-[var(--mint)] border border-[rgba(78,203,141,0.35)] before:bg-[var(--mint)]': course.status === 'purchased',
      'bg-[rgba(145,144,168,0.16)] text-[var(--muted)] border border-[rgba(145,144,168,0.28)] before:bg-[var(--muted)]': course.status === 'locked',
      'bg-[rgba(240,106,106,0.18)] text-[var(--coral)] border border-[rgba(240,106,106,0.35)] before:bg-[var(--coral)]': course.status === 'expired'
    }">
        {{ statusLabel }}
    </span>

    <!-- Card Body -->
    <div class="p-5 flex flex-col gap-3 flex-1">
        <div class="flex items-center gap-2 text-xs text-[var(--muted)] font-[var(--mono)]">
            <span
                class="w-6 h-6 rounded-full bg-[rgba(var(--accent-rgb),0.22)] text-[var(--purple-lt)] flex items-center justify-center text-xs font-black shrink-0">
                {{ course.teacherInitial }}
            </span>
            {{ course.teacherName }}
        </div>

        <h3 class="text-base font-black tracking-tight leading-snug text-[var(--ink)] line-clamp-2 min-h-[44px]">
            {{ course.title }}
        </h3>

        <!-- Fixed Conditional Area -->
        <div class="min-h-[32px] flex items-center">
            <div class="flex items-baseline gap-1" *ngIf="course.price">
                <span class="text-base font-black text-[var(--star)] tracking-tight leading-none">{{ course.price
                    }}</span>
                <span class="text-xs font-bold text-[var(--muted)] font-[var(--mono)]">{{ course.currency }}</span>
            </div>

            <div class="flex items-center gap-2 w-full text-xs font-semibold text-[var(--muted)] font-[var(--mono)] leading-snug py-2 px-3 bg-[rgba(145,144,168,0.10)] border border-[rgba(145,144,168,0.18)] rounded-[10px]"
                *ngIf="course.prerequisiteLabel">
                <span class="shrink-0 opacity-65">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path
                            d="M4.26781 18.8447C4.49269 20.515 5.87613 21.8235 7.55966 21.9009C8.97627 21.966 10.4153 22 12 22C13.5847 22 15.0237 21.966 16.4403 21.9009C18.1239 21.8235 19.5073 20.515 19.7322 18.8447C19.879 17.7547 20 16.6376 20 15.5C20 14.3624 19.879 13.2453 19.7322 12.1553C19.5073 10.485 18.1239 9.17649 16.4403 9.09909C15.0237 9.03397 13.5847 9 12 9C10.4153 9 8.97627 9.03397 7.55966 9.09909C5.87613 9.17649 4.49269 10.485 4.26781 12.1553C4.12104 13.2453 4 14.3624 4 15.5C4 16.6376 4.12104 17.7547 4.26781 18.8447Z" />
                        <path d="M7.5 9V6.5C7.5 4.01472 9.51472 2 12 2C14.4853 2 16.5 4.01472 16.5 6.5V9"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M11.9961 15.5H12.0051" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                {{ course.prerequisiteLabel }}
            </div>

            <div class="text-xs font-semibold text-[var(--coral)] font-[var(--mono)] opacity-90"
                *ngIf="course.expiredDate">
                {{ course.expiredDate }}
            </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between pt-3 border-t border-[var(--border)] mt-auto">
            <span class="text-xs text-[var(--muted)] font-[var(--mono)] flex items-center gap-1">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 8V12L14 14" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                {{ durationDisplay }}
            </span>

            <!-- ✨ ONLY THIS BUTTON IS CLICKABLE AND NAVIGATES ✨ -->
            <a *ngIf="ctaLabel" [routerLink]="['/course', course.id]"
                class="text-[var(--purple-lt)] text-xs font-bold flex items-center gap-2 transition-colors duration-200 hover:text-[var(--lavender)] group/cta">
                {{ ctaLabel }}
                <svg *ngIf="course.status !== 'expired'"
                    class="w-4 h-4 transition-transform duration-200 group-hover/cta:-translate-x-1" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
            </a>
        </div>
    </div>
</article>
