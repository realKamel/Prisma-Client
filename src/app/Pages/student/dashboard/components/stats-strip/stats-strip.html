<!-- dashboard/components/stats-strip/stats-strip.component.html -->
<!--
  Input interface:
    stats: StatsDto  { purchasedLessons, completedLessons, studyHours, topQuizScore }

  Count-up is handled by CountUpDirective (see stats-strip.component.ts).
  Each tile has a staggered reveal delay matching the original (0 / 80 / 160 / 240ms).
-->

<section class="mb-14">

  <div class="flex items-end justify-between gap-4 mb-5 ">
    <h2 class="text-2xl font-black tracking-tight">
      رقم في <span class="text-[var(--purple-lt)]">السطر</span>
    </h2>
  </div>

  <div class="grid grid-cols-4 gap-4 max-[880px]:grid-cols-2 max-[640px]:grid-cols-2">

    <!-- Purchased lessons — t-purple -->
    <div class="stat-tile bg-[var(--surface)] border border-[var(--border)]
                rounded-[20px] p-6 flex flex-col gap-2 relative overflow-hidden
                transition-transform duration-[320ms] [transition-timing-function:var(--ease-spring)]
                hover:-translate-y-1"
         style="--d: 0ms">
      <!-- glow blob top-right -->
      <span class="absolute top-0 right-0 w-[60px] h-[60px] rounded-full
                   bg-[var(--purple-lt)] blur-[40px] opacity-40 pointer-events-none"></span>
      <div class="w-11 h-11 rounded-xl bg-[rgba(var(--accent-rgb),0.16)]
                  flex items-center justify-center mb-1 text-[var(--purple-lt)]">
        <i class="bi bi-journal-bookmark-fill text-xl"></i>
      </div>
      <div class="text-[32px] font-black text-[var(--ink)] leading-none tracking-tight"
           appCountUp [target]="stats.purchasedLessons">0</div>
      <div class="text-xs text-[var(--muted)] tracking-[0.04em]">// دروس مشتراة</div>
    </div>

    <!-- Completed lessons — t-mint -->
    <div class="stat-tile bg-[var(--surface)] border border-[var(--border)]
                rounded-[20px] p-6 flex flex-col gap-2 relative overflow-hidden
                transition-transform duration-[320ms] [transition-timing-function:var(--ease-spring)]
                hover:-translate-y-1"
         style="--d: 80ms">
      <span class="absolute top-0 right-0 w-[60px] h-[60px] rounded-full
                   bg-[var(--mint)] blur-[40px] opacity-40 pointer-events-none"></span>
      <div class="w-11 h-11 rounded-xl bg-[rgba(78,203,141,0.16)]
                  flex items-center justify-center mb-1 text-[var(--mint)]">
        <i class="bi bi-check-circle-fill text-xl"></i>
      </div>
      <div class="text-[32px] font-black text-[var(--ink)] leading-none tracking-tight"
           appCountUp [target]="stats.completedLessons">0</div>
      <div class="text-xs text-[var(--muted)] tracking-[0.04em]">// دروس مكتملة</div>
    </div>

    <!-- Study hours — t-star -->
    <div class="stat-tile bg-[var(--surface)] border border-[var(--border)]
                rounded-[20px] p-6 flex flex-col gap-2 relative overflow-hidden
                transition-transform duration-[320ms] [transition-timing-function:var(--ease-spring)]
                hover:-translate-y-1"
         style="--d: 160ms">
      <span class="absolute top-0 right-0 w-[60px] h-[60px] rounded-full
                   bg-[var(--star)] blur-[40px] opacity-40 pointer-events-none"></span>
      <div class="w-11 h-11 rounded-xl bg-[rgba(247,201,72,0.16)]
                  flex items-center justify-center mb-1 text-[var(--star)]">
        <i class="bi bi-clock-fill text-xl"></i>
      </div>
      <div class="text-[32px] font-black text-[var(--ink)] leading-none tracking-tight">
        <span class="text-base text-[var(--muted)] ml-1">ساعة</span>
        <span appCountUp [target]="stats.studyHours">0</span>
      </div>
      <div class="text-xs text-[var(--muted)] tracking-[0.04em]">// ساعات مذاكرة</div>
    </div>

    <!-- Top quiz score — t-coral -->
    <div class="stat-tile bg-[var(--surface)] border border-[var(--border)]
                rounded-[20px] p-6 flex flex-col gap-2 relative overflow-hidden
                transition-transform duration-[320ms] [transition-timing-function:var(--ease-spring)]
                hover:-translate-y-1"
         style="--d: 240ms">
      <span class="absolute top-0 right-0 w-[60px] h-[60px] rounded-full
                   bg-[var(--coral)] blur-[40px] opacity-40 pointer-events-none"></span>
      <div class="w-11 h-11 rounded-xl bg-[rgba(240,106,106,0.16)]
                  flex items-center justify-center mb-1 text-[var(--coral)]">
        <i class="bi bi-trophy-fill text-xl"></i>
      </div>
      <div class="text-[32px] font-black text-[var(--ink)] leading-none tracking-tight">
        <span class="text-base text-[var(--muted)] ml-1">٪</span>
        <span appCountUp [target]="stats.topQuizScore">0</span>
      </div>
      <div class="text-xs text-[var(--muted)] tracking-[0.04em]">// أعلى نتيجة كويز</div>
    </div>

  </div>
</section>
