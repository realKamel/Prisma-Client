@if (lessonService.currentLesson; as lesson) {
  <div
    class="flex items-center gap-4 bg-[var(--surface2)] border border-[var(--border)] rounded-[var(--radius-card)] p-5 mb-8 relative"
  >
    <div
      class="w-13 h-13 rounded-2xl bg-gradient-to-br from-[#1f4a3a] to-[var(--mint)] flex items-center justify-center text-2xl shrink-0"
    >
      <i class="bi bi-lightning-charge text-white"></i>
    </div>
    <div class="flex-1 min-w-0">
      <div class="font-black text-[var(--ink)] mb-1 truncate">{{ lesson.title }}</div>
      <div class="flex items-center gap-2 text-xs font-semibold text-[var(--muted)]">
        <span
          class="w-5 h-5 rounded-full bg-[var(--purple)] flex items-center justify-center text-white shrink-0"
          >{{ lesson.teacher[0] }}</span
        >
        {{ lesson.teacher }} · {{ lesson.duration }} · {{ lesson.chaptersCount }} فصول
      </div>
    </div>
    <div class="flex flex-row items-baseline">
      <span class="text-2xl font-black text-[var(--star)] ml-1">{{ lesson.price }}</span>
      <span class="text-xs font-bold text-[var(--muted)]">جنيه</span>
    </div>
  </div>
} @else {
  <div
    class="flex items-center gap-4 bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] p-5 mb-8 animate-pulse"
  >
    <div class="w-13 h-13 rounded-2xl bg-[var(--border)] shrink-0"></div>
    <div class="flex-1 space-y-2">
      <div class="h-4 bg-[var(--border)] rounded w-3/4"></div>
      <div class="h-3 bg-[var(--border)] rounded w-1/2"></div>
    </div>
    <div class="h-6 bg-[var(--border)] rounded w-12"></div>
  </div>
}
