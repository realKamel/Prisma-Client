<main class="min-h-screen p-6" dir="rtl">
  <div class="max-w-[520px] mx-auto text-center py-10">
    <!-- Success -->
    @if (state() === 'success') {
      <div>
        <div
          class="w-24 h-24 rounded-full bg-[rgba(78,203,141,0.12)] border-[12px] border-[rgba(78,203,141,0.06)] flex items-center justify-center mx-auto mb-7 animate-bounce"
        >
          <i class="bi bi-check-lg text-4xl text-[var(--mint)]"></i>
        </div>
        <h1 class="text-3xl font-black text-[var(--ink)] mb-2.5">تم الدفع بنجاح!</h1>
        <p class="text-base text-[var(--muted)] max-w-[380px] mx-auto mb-8">
          الدرس اتفتحلك — ابدأ على طول وذاكر بقى
        </p>
        <div
          class="bg-[var(--surface)] p-6 rounded-[20px] border border-[var(--border)] text-right shadow-sm mb-7 space-y-3"
        >
          <div class="flex justify-between items-center text-sm">
            <span class="text-[var(--muted)] font-semibold">رقم العملية</span>
            <span class="text-[var(--ink)] font-bold font-mono">{{ transactionId() }}</span>
          </div>
        </div>
        <button
          (click)="goToLesson()"
          class="w-full flex items-center justify-center gap-2 p-4 rounded-full bg-gradient-to-r from-[var(--mint)] to-[#3ab878] text-[#0b2a20] font-bold text-base shadow-md transition-all hover:scale-[1.03] mb-4"
        >
          <span>ابدأ الدرس</span>
          <i class="bi bi-play-fill text-lg"></i>
        </button>
        <a
          routerLink="/home"
          class="text-sm text-[var(--muted)] hover:text-[var(--purple-lt)] font-semibold block mt-4"
        >
          رجّع للرئيسية
        </a>
      </div>
    }

    <!-- Failed -->
    @if (state() === 'failed') {
      <div>
        <div
          class="w-24 h-24 rounded-full bg-[rgba(240,106,106,0.10)] border-[12px] border-[rgba(240,106,106,0.05)] flex items-center justify-center mx-auto mb-7"
        >
          <i class="bi bi-x-lg text-3xl text-[var(--coral)]"></i>
        </div>
        <h1 class="text-3xl font-black text-[var(--ink)] mb-2.5">فشلت عملية الدفع</h1>
        <p class="text-base text-[var(--muted)] max-w-[380px] mx-auto mb-8">
          حصل مشكلة في الدفع. تأكد من بياناتك وجرب تاني
        </p>
        <a
          routerLink="/lessons"
          class="w-full flex items-center justify-center gap-2 p-4 rounded-full bg-[var(--coral)] text-white font-bold text-base shadow-md transition-all hover:scale-[1.03] mb-4"
        >
          <i class="bi bi-arrow-clockwise text-lg"></i>
          <span>جرب تاني</span>
        </a>
        <a
          routerLink="/home"
          class="text-sm text-[var(--muted)] hover:text-[var(--purple-lt)] font-semibold block mt-4"
        >
          رجّع للرئيسية
        </a>
      </div>
    }
  </div>
</main>
