<section
  class="bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] p-6 md:p-8 shadow-sm relative"
>
  <h2 class="text-lg font-black text-[var(--ink)] mb-5">ماذا ستتعلم</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (outcome of outcomes(); track outcome) {
      <div class="flex items-start gap-3 text-sm text-[var(--ink2)]">
        <i class="bi bi-check-circle-fill text-[var(--mint)] text-base shrink-0 mt-0.5"></i>
        <span class="leading-relaxed">{{ outcome }}</span>
      </div>
    }
  </div>
</section>
