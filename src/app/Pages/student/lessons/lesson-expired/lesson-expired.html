 <div class="max-w-[1100px] mx-auto px-14 pt-[100px] pb-20 max-sm:px-5 max-sm:pt-[88px] relative">
 
      <!-- Breadcrumb -->
      <app-breadcrumb [items]="breadcrumbs" />
 
    <!-- Loading skeleton -->
<div *ngIf="loading"
     class="grid gap-8 items-start grid-cols-[1fr_360px] max-[900px]:grid-cols-1">

  <!-- Left: lesson card skeleton -->
  <div class="bg-[var(--surface)] border border-[var(--border)] rounded-[24px] overflow-hidden animate-pulse">
    <!-- Thumbnail placeholder -->
    <div class="h-[280px] bg-[var(--surface2)]"></div>
    <!-- Meta placeholder -->
    <div class="px-7 py-6 flex flex-col gap-3">
      <div class="h-4 w-24 rounded-full bg-[var(--surface2)]"></div>
      <div class="h-6 w-3/4 rounded-full bg-[var(--surface2)]"></div>
      <div class="h-4 w-full rounded-full bg-[var(--surface2)]"></div>
      <div class="h-4 w-2/3 rounded-full bg-[var(--surface2)]"></div>
      <div class="flex gap-4 pt-4 border-t border-[var(--border)]">
        <div class="h-4 w-20 rounded-full bg-[var(--surface2)]"></div>
        <div class="h-4 w-20 rounded-full bg-[var(--surface2)]"></div>
        <div class="h-4 w-20 rounded-full bg-[var(--surface2)]"></div>
      </div>
      <div class="h-2 w-full rounded-full bg-[var(--surface2)] mt-2"></div>
    </div>
  </div>

  <!-- Right: sidebar skeleton -->
  <div class="flex flex-col gap-4 animate-pulse">
    <!-- Renewal card -->
    <div class="bg-[var(--surface)] border border-[var(--border)] rounded-[20px] p-7 flex flex-col gap-3">
      <div class="h-3 w-24 rounded-full bg-[var(--surface2)]"></div>
      <div class="h-6 w-48 rounded-full bg-[var(--surface2)]"></div>
      <div class="h-4 w-full rounded-full bg-[var(--surface2)]"></div>
      <div class="h-10 w-36 rounded-full bg-[var(--surface2)] mt-2"></div>
      <div class="flex flex-col gap-2 mt-3">
        <div class="h-3 w-full rounded-full bg-[var(--surface2)]"></div>
        <div class="h-3 w-full rounded-full bg-[var(--surface2)]"></div>
        <div class="h-3 w-3/4 rounded-full bg-[var(--surface2)]"></div>
        <div class="h-3 w-full rounded-full bg-[var(--surface2)]"></div>
      </div>
      <div class="h-12 w-full rounded-[14px] bg-[var(--surface2)] mt-4"></div>
    </div>
    <!-- Alt options card -->
    <div class="bg-[var(--surface2)] border border-[var(--border)] rounded-[16px] p-5 flex flex-col gap-3">
      <div class="h-4 w-20 rounded-full bg-[var(--surface)]"></div>
      <div class="h-12 w-full rounded-[12px] bg-[var(--surface)]"></div>
      <div class="h-12 w-full rounded-[12px] bg-[var(--surface)]"></div>
      <div class="h-12 w-full rounded-[12px] bg-[var(--surface)]"></div>
    </div>
  </div>

</div>
 
      <!-- Error state -->
      <div *ngIf="error && !loading"
           class="text-center py-24 text-[var(--muted)]">
        <i class="bi bi-exclamation-circle text-[48px] block mb-4 text-[var(--coral)]"></i>
        <p class="text-[16px]">{{ error }}</p>
      </div>
 
      <!-- Main grid -->
      <div *ngIf="!loading && !error"
           class="grid gap-8 items-start
                  grid-cols-[1fr_360px]
                  max-[900px]:grid-cols-1">
 
        <!-- Left: expired lesson card -->
        <app-expired-lesson-card [lesson]="lessonData" />
 
        <!-- Right: sidebar -->
        <div class="flex flex-col gap-4">
          <app-renewal-card
            [plan]="renewalPlan"
            (renewClicked)="handleRenew($event)" />
 
          <app-alt-options-card [options]="altOptions" />
        </div>
 
      </div>
    </div>
