<main class="min-h-screen p-6 md:p-10 bg-[var(--bg)] text-[var(--ink)]" dir="rtl">

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading" class="max-w-7xl mx-auto">
        <div class="animate-pulse mb-10">
            <div class="h-4 bg-[var(--border)] rounded w-32 mb-4"></div>
            <div class="h-10 bg-[var(--border)] rounded w-1/2 mb-2"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div *ngFor="let i of [1,2,3]"
                class="animate-pulse bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] overflow-hidden">
                <div class="h-32 bg-[var(--border)]"></div>
                <div class="p-5 space-y-3">
                    <div class="h-4 bg-[var(--border)] rounded w-1/3"></div>
                    <div class="h-6 bg-[var(--border)] rounded w-2/3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Actual Content -->
    <div *ngIf="!isLoading" class="max-w-7xl mx-auto">
        <header class="mb-10">
            <nav class="flex items-center gap-2 text-xs text-[var(--muted)] mb-4 font-[var(--mono)]">
                <a routerLink="/dashboard" class="hover:text-[var(--purple-lt)] transition">الرئيسية</a>
                <span>›</span>
                <span class="text-[var(--ink2)]">مكتبة الدروس</span>
            </nav>

            <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-black tracking-tight leading-tight mb-2">
                        مكتبة دروس <span class="text-[var(--purple-lt)]">الفيزياء</span>
                    </h1>
                    <p class="text-xs text-[var(--muted)] font-[var(--mono)] leading-relaxed">
                        {{ counts.avail }} متاحة · {{ counts.purchased }} مشتراة · {{ counts.locked }} مقفولة · {{
                        counts.expired }} منتهية
                    </p>
                </div>
                <span
                    class="inline-flex items-center text-xs font-bold text-[var(--purple-lt)] bg-[rgba(var(--accent-rgb),0.12)] border border-[var(--border)] px-5 py-2 rounded-full self-center font-[var(--mono)]">
                    {{ counts.all }} درس
                </span>
            </div>
        </header>

        <section class="mb-14">
            <div class="flex flex-wrap gap-2 mb-6 pb-4 border-b border-[var(--border)]">
                <button *ngFor="let f of filters" (click)="setFilter(f.key)" class="chip"
                    [class.active]="activeFilter === f.key">
                    {{ f.label }} <span class="chip-count">{{ counts[f.key] }}</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" *ngIf="filteredLessons.length > 0">
                <app-lesson-card *ngFor="let lesson of filteredLessons" [lesson]="lesson" />
            </div>

            <div *ngIf="filteredLessons.length === 0" class="text-center py-16 px-5">
                <div class="text-4xl mb-4 text-[var(--muted)]">
                    <svg class="w-10 h-10 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <line x1="21" y1="21" x2="16.65" y2="16.65" />
                    </svg>
                </div>
                <div class="text-base font-bold text-[var(--ink2)] mb-2">مفيش دروس في هذا التصنيف</div>
            </div>
        </section>
    </div>
</main>
