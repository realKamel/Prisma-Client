<div
  class="mb-6 flex flex-wrap items-center gap-2 border-b border-[var(--border)] pb-6"
  role="group"
  aria-label="تصفية المدفوعات"
>
  @for (chip of chips; track chip.key) {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-full border px-4 py-2 text-sm font-bold transition-colors duration-150"
      [class.bg-[var(--purple)]]="activeFilter() === chip.key"
      [class.text-white]="activeFilter() === chip.key"
      [class.border-[var(--purple)]]="activeFilter() === chip.key"
      [class.bg-[var(--surface)]]="activeFilter() !== chip.key"
      [class.text-[var(--muted)]]="activeFilter() !== chip.key"
      [class.border-[var(--border)]]="activeFilter() !== chip.key"
      (click)="filterChange.emit(chip.key)"
    >
      {{ chip.label }}
      <span class="text-xs opacity-80">{{ counts()[chip.key] | arNum }}</span>
    </button>
  }
</div>
