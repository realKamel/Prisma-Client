<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/55 backdrop-blur-sm p-6"
  role="dialog"
  aria-modal="true"
  aria-labelledby="confirm-modal-title"
  (click)="onOverlayClick($event)"
  (keydown.escape)="cancel.emit()"
  tabindex="-1"
>
  <div
    class="relative mx-auto w-full max-w-sm rounded-3xl border p-10 text-center flex flex-col items-center gap-4 shadow-2xl"
    style="background: var(--surface); border-color: var(--border)"
  >
    <!-- Icon -->
    <div
      class="flex items-center justify-center rounded-2xl border-2"
      style="
        width: 72px;
        height: 72px;
        background: rgba(var(--accent-rgb), 0.12);
        border-color: rgba(var(--accent-rgb), 0.24);
        color: var(--purple-lt);
      "
    >
      <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M5 14L9 18L19 7"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <!-- Title -->
    <h2 id="confirm-modal-title" class="text-xl font-black" style="color: var(--ink)">
      {{ title }}
    </h2>

    <!-- Body -->
    <p class="text-sm leading-relaxed max-w-xs" style="color: var(--muted)">
      {{ message }}
    </p>

    <!-- Buttons -->
    <div class="flex gap-3 w-full mt-2">
      <button
        type="button"
        class="flex-1 rounded-full px-6 py-3 text-sm font-bold border transition-all hover:opacity-80 active:scale-95"
        style="border-color: var(--border); color: var(--muted); background: transparent"
        (click)="cancel.emit()"
      >
        إلغاء
      </button>
      <button
        type="button"
        class="flex-1 rounded-full px-6 py-3 text-sm font-bold text-white transition-all hover:opacity-85 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2"
        style="background: var(--purple); box-shadow: 0 4px 16px var(--purple-glow)"
        (click)="confirm.emit()"
      >
        تسليم الاختبار
      </button>
    </div>
  </div>
</div>
