<div
  class="flex items-center gap-4 rounded-2xl border p-5 transition-all duration-200 hover:-translate-y-0.5"
  [class.opacity-60]="quiz.status === 'missed'"
  [style.border-color]="quiz.status === 'pending' ? 'rgba(247,201,72,0.30)' : 'var(--border)'"
  style="background: var(--surface); box-shadow: 0 4px 16px rgba(0,0,0,0.08);">

  <!-- Poster -->
  <div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl overflow-hidden"
    [class.grayscale]="quiz.status === 'missed'" [style.background]="posterGradient">
    <!-- bolt -->
    <svg *ngIf="quiz.iconType === 'bolt'" class="w-7 h-7" style="color:rgba(255,255,255,0.75)" viewBox="0 0 24 24"
      fill="none" aria-hidden="true">
      <path
        d="M11.8013 6.48949L13.2869 5.00392C14.9596 3.3312 17.1495 2.63737 19.4671 2.52399C20.3686 2.47989 20.8193 2.45784 21.1807 2.81928C21.5422 3.18071 21.5201 3.63143 21.476 4.53289C21.3626 6.8505 20.6688 9.04042 18.9961 10.7131L17.5105 12.1987C16.2871 13.4221 15.9393 13.77 16.1961 15.097C16.4496 16.1107 16.6949 17.0923 15.9578 17.8294C15.0637 18.7235 14.2481 18.7235 13.354 17.8294L6.17058 10.646C5.27649 9.75188 5.27646 8.9363 6.17058 8.04219C6.90767 7.30509 7.88929 7.55044 8.90297 7.80389C10.23 8.06073 10.5779 7.71289 11.8013 6.48949Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M2.5 21.5L7.5 16.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <!-- atom -->
    <svg *ngIf="quiz.iconType === 'atom'" class="w-7 h-7" style="color:rgba(255,255,255,0.75)" viewBox="0 0 24 24"
      fill="none" aria-hidden="true">
      <path d="M12 12C12 12 8 9 8 6C8 3.79086 9.79086 2 12 2C14.2091 2 16 3.79086 16 6C16 9 12 12 12 12Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M12 12C12 12 16 15 16 18C16 20.2091 14.2091 22 12 22C9.79086 22 8 20.2091 8 18C8 15 12 12 12 12Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M12 12C12 12 9 8 6 8C3.79086 8 2 9.79086 2 12C2 14.2091 3.79086 16 6 16C9 16 12 12 12 12Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M12 12C12 12 15 16 18 16C20.2091 16 22 14.2091 22 12C22 9.79086 20.2091 8 18 8C15 8 12 12 12 12Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
    </svg>
    <!-- magnet -->
    <svg *ngIf="quiz.iconType === 'magnet'" class="w-7 h-7" style="color:rgba(255,255,255,0.75)" viewBox="0 0 24 24"
      fill="none" aria-hidden="true">
      <path
        d="M13 2H11C7.22876 2 5.34315 2 4.17157 3.17157C3 4.34315 3 6.22876 3 10V14C3 17.7712 3 19.6569 4.17157 20.8284C5.34315 22 7.22876 22 11 22H13C16.7712 22 18.6569 22 19.8284 20.8284C21 19.6569 21 17.7712 21 14V10C21 6.22876 21 4.34315 19.8284 3.17157C18.6569 2 16.7712 2 13 2Z"
        stroke="currentColor" stroke-width="1.5" />
      <path
        d="M8 10C8 8.34315 9.34315 7 11 7H13C14.6569 7 16 8.34315 16 10V10C16 11.6569 14.6569 13 13 13H11C9.34315 13 8 11.6569 8 10V10Z"
        stroke="currentColor" stroke-width="1.5" />
      <path d="M11 13V17M13 13V17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <!-- thermo -->
    <svg *ngIf="quiz.iconType === 'thermo'" class="w-7 h-7" style="color:rgba(255,255,255,0.75)" viewBox="0 0 24 24"
      fill="none" aria-hidden="true">
      <path d="M12 2C12 2 8 6 8 11V16C8 18.2091 9.79086 20 12 20C14.2091 20 16 18.2091 16 16V11C16 6 12 2 12 2Z"
        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M12 20C14.2091 20 16 18.2091 16 16C16 14 14 13 12 13C10 13 8 14 8 16C8 18.2091 9.79086 20 12 20Z"
        stroke="currentColor" stroke-width="1.5" />
      <path d="M10 8H9M10 11H9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <!-- eye -->
    <svg *ngIf="quiz.iconType === 'eye'" class="w-7 h-7" style="color:rgba(255,255,255,0.75)" viewBox="0 0 24 24"
      fill="none" aria-hidden="true">
      <path d="M2 12C2 12 5 5 12 5C19 5 22 12 22 12C22 12 19 19 12 19C5 19 2 12 2 12Z" stroke="currentColor"
        stroke-width="1.5" stroke-linejoin="round" />
      <path
        d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"
        stroke="currentColor" stroke-width="1.5" />
    </svg>
    <!-- trophy -->
    <svg *ngIf="quiz.iconType === 'trophy'" class="w-7 h-7" style="color:rgba(255,255,255,0.75)" viewBox="0 0 24 24"
      fill="none" aria-hidden="true">
      <path
        d="M12 17C10.3264 17 8.86971 18.265 8.11766 20.1312C7.75846 21.0225 8.27389 22 8.95877 22H15.0412C15.7261 22 16.2415 21.0225 15.8823 20.1312C15.1303 18.265 13.6736 17 12 17Z"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      <path d="M18.5 5H19.7C20.9 5 21.5 5 21.8 5.38C22.1 5.75 22 6.32 21.7 7.45L21.3 9.15C20.8 11.7 18.6 13.6 16 14"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M5.5 5H4.3C3.1 5 2.5 5 2.2 5.38C1.9 5.75 2 6.32 2.3 7.45L2.7 9.15C3.2 11.7 5.4 13.6 8 14"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <path
        d="M12 17C15 17 17.6 12.3 18.3 6C18.5 4.2 18.6 3.4 18.1 2.7C17.5 2 16.6 2 14.8 2H9.2C7.4 2 6.5 2 5.9 2.7C5.4 3.4 5.5 4.2 5.7 6C6.4 12.3 9 17 12 17Z"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </svg>
  </div>

  <!-- Body -->
  <div class="flex-1 min-w-0">
    <div class="text-base font-black truncate mb-1" style="color: var(--ink);">
      {{ quiz.title }}
    </div>
    <div class="flex items-center gap-2 flex-wrap text-xs" style="color: var(--muted);">
      <svg class="w-3 h-3 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M18 2V4M6 2V4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" />
        <path
          d="M2.5 12.2432C2.5 7.88594 2.5 5.70728 3.75212 4.35364C5.00424 3 7.01949 3 11.05 3H12.95C16.9805 3 18.9958 3 20.2479 4.35364C21.5 5.70728 21.5 7.88594 21.5 12.2432V12.7568C21.5 17.1141 21.5 19.2927 20.2479 20.6464C18.9958 22 16.9805 22 12.95 22H11.05C7.01949 22 5.00424 22 3.75212 20.6464C2.5 19.2927 2.5 17.1141 2.5 12.7568V12.2432Z"
          stroke="currentColor" stroke-width="1.5" />
        <path d="M6 8H18M6 12H18M6 16H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      {{ quiz.date }}
      <ng-container *ngIf="quiz.status === 'pending' && quiz.submittedDate">
        &nbsp;·&nbsp; سُلِّم {{ quiz.submittedDate }}
      </ng-container>
      <ng-container *ngIf="quiz.status === 'new' && quiz.questionCount">
        &nbsp;·&nbsp; {{ quiz.questionCount }} أسئلة · {{ quiz.durationMinutes }} دقيقة
      </ng-container>
    </div>
  </div>

  <!-- Right section -->
  <div class="flex flex-col items-end gap-2 shrink-0">

    <!-- Status pill -->
    <span *ngIf="quiz.status === 'new'" class="inline-flex items-center rounded-full px-3 py-1 text-xs font-bold"
      style="background:rgba(var(--accent-rgb),0.14); color:var(--purple-lt);">
      جديد
    </span>
    <span *ngIf="quiz.status === 'pending'" class="inline-flex items-center rounded-full px-3 py-1 text-xs font-bold"
      style="background:rgba(247,201,72,0.16); color:var(--star);">
      تحت التصحيح
    </span>
    <span *ngIf="quiz.status === 'done'" class="inline-flex items-center rounded-full px-3 py-1 text-xs font-bold"
      style="background:rgba(78,203,141,0.14); color:var(--mint);">
      مكتمل
    </span>
    <span *ngIf="quiz.status === 'missed'" class="inline-flex items-center rounded-full px-3 py-1 text-xs font-bold"
      style="background:rgba(240,106,106,0.12); color:var(--coral);">
      فائت
    </span>

    <!-- Score badge — done only -->
    <span *ngIf="quiz.status === 'done' && quiz.score !== undefined"
      class="inline-flex items-center gap-0.5 rounded-xl px-3 py-1 text-sm font-black" [style]="scoreStyle">
      {{ quiz.score }}
      <span class="text-xs font-semibold opacity-60">/{{ quiz.maxScore ?? 100 }}</span>
    </span>

    <!-- CTA buttons -->
    <a *ngIf="quiz.status === 'new'" [routerLink]="['/student/quizzes', quiz.id]"
      class="inline-flex items-center rounded-full px-4 py-2 text-xs font-bold text-white transition-all hover:opacity-85 active:scale-95"
      style="background: var(--purple);">
      ابدأ الاختبار
    </a>

    <button *ngIf="quiz.status === 'pending'" type="button"
      class="inline-flex items-center rounded-full px-4 py-2 text-xs font-bold transition-all hover:opacity-85 active:scale-95 border"
      style="background:rgba(247,201,72,0.12); color:var(--star); border-color:rgba(247,201,72,0.28);"
      (click)="showPendingModal.emit()">
      عرض الحالة
    </button>

    <a *ngIf="quiz.status === 'done'" [routerLink]="['/student/quizzes', quiz.id]" [queryParams]="{result: true}"
      class="inline-flex items-center rounded-full px-4 py-2 text-xs font-bold transition-all hover:opacity-85 active:scale-95 border"
      style="background:rgba(var(--accent-rgb),0.1); color:var(--purple-lt); border-color:rgba(var(--accent-rgb),0.20);">
      عرض النتيجة
    </a>

  </div>
</div>
