<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

  @if (loading && !cards.length) {
    @for (i of [0, 1, 2, 3]; track i) {
      <div class="bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] p-5 h-[132px] animate-pulse"></div>
    }
  } @else {
    @for (card of cards; track card.label) {
      <div
        class="bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] p-5 flex flex-col gap-3 hover:-translate-y-1 transition-transform hover:shadow-[0_6px_28px_var(--accent-glow)]"
        [ngClass]="card.accentBorderClass">

        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-semibold text-[var(--muted)]">{{ card.label }}</span>
          <i class="bi {{ card.icon }} text-base" [ngClass]="card.iconColorClass"></i>
        </div>

        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-extrabold tabular-nums"[ngClass]="card.textcolorclass" [appCountUp]="card.value"
          ></span>
          <span class="text-sm text-[var(--muted)]">جنيه</span>
        </div>

        <div class="text-xs flex items-center gap-1" [ngClass]="card.subToneClass">
          @if (card.subTone === 'up') {
            <i class="bi bi-arrow-up"></i>
          }
          <span>{{ card.sub }}</span>
        </div>
      </div>
    }
  }

</div>
