<section [formGroup]="form" class="rounded-[var(--radius-card)] border border-[var(--border)] bg-[var(--surface)] p-6 sm:p-8">

  <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-[var(--ink)]">
    <i class="bi bi-file-earmark-text text-xl text-[var(--purple-lt)]"></i>
    الواجب
  </h3>

  <div class="flex items-center justify-between gap-4">
    <div>
      <div class="font-bold text-[var(--ink)]">تفعيل الواجب لهذا الدرس</div>
      <div class="mt-1 text-sm text-[var(--muted)]">الطلاب هيقدروا يرفعوا ملفات كإجابة للواجب</div>
    </div>
    <button
      type="button"
      role="switch"
      [attr.aria-checked]="form.get('assignmentEnabled')?.value"
      (click)="toggle.emit()"
      [ngClass]="form.get('assignmentEnabled')?.value ? 'bg-[var(--mint)]' : 'bg-[var(--surface2)]'"
      class="relative h-7 w-12 shrink-0 rounded-full border border-[var(--border)] transition-colors"
    >
      <span
        [ngClass]="form.get('assignmentEnabled')?.value ? '-translate-x-5' : 'translate-x-0'"
        class="absolute right-1 top-1 h-5 w-5 rounded-full bg-white transition-transform"
      ></span>
    </button>
  </div>

  <div *ngIf="form.get('assignmentEnabled')?.value" class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-2">

    <div class="sm:col-span-2">
      <label class="mb-2 block text-sm font-semibold text-[var(--ink2)]">وصف الواجب</label>
      <textarea
        formControlName="assignmentDescription"
        rows="3"
        placeholder="وصف تفصيلي للواجب المطلوب..."
        class="w-full resize-none rounded-xl border border-[var(--border)] bg-[var(--surface2)] px-4 py-3 text-[var(--ink)] placeholder:text-[var(--muted)] focus:border-[var(--border-focus)] focus:outline-none"
      ></textarea>
    </div>

    <div>
      <label class="mb-2 block text-sm font-semibold text-[var(--ink2)]">آخر موعد للتسليم</label>
      <input
        type="date"
        formControlName="assignmentDueDate"
        class="dir-ltr h-12 w-full rounded-xl border border-[var(--border)] bg-[var(--surface2)] px-4 text-[var(--ink)] focus:border-[var(--border-focus)] focus:outline-none"
      />
    </div>

    <div>
      <label class="mb-2 block text-sm font-semibold text-[var(--ink2)]">أنواع الملفات المقبولة</label>
      <select
        formControlName="assignmentFileTypes"
        class="h-12 w-full rounded-xl border border-[var(--border)] bg-[var(--surface2)] px-4 text-[var(--ink)] focus:border-[var(--border-focus)] focus:outline-none"
      >
        <option value="pdf-word-images">PDF, Word, صور</option>
        <option value="pdf-only">PDF فقط</option>
        <option value="any">أي نوع</option>
      </select>
    </div>

  </div>
</section>
