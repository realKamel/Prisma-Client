@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center"
    style="background: rgba(8, 6, 18, 0.72); backdrop-filter: blur(6px)"
    (click)="cancelled.emit()"
  >
    <div
      class="relative bg-[var(--surface)] rounded-[20px] p-8 w-full max-w-[420px] mx-4 flex flex-col gap-5"
      style="
        border: 1px solid rgba(var(--accent-rgb), 0.28);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      "
      (click)="$event.stopPropagation()"
    >
      <!-- Icon -->
      <div
        class="w-14 h-14 rounded-[16px] flex items-center justify-center mx-auto"
        style="background: rgba(240, 106, 106, 0.18); border: 1px solid rgba(240, 106, 106, 0.32)"
      >
        <i class="bi bi-trash3-fill text-[28px] text-[var(--coral)]"></i>
      </div>
      <!-- Title & body -->
      <div class="text-center">
        <h2 class="text-[20px] font-black text-[var(--ink)] mb-2 mt-0">تأكيد الحذف</h2>
        <p class="text-[14px] text-[var(--muted)] leading-relaxed m-0">
          هل أنت متأكد إنك عايز تحذف درس
          <strong class="text-[var(--ink)]">"{{ lessonName() }}"</strong>؟ العملية دي مش هترجع.
        </p>
      </div>
      <!-- Actions -->
      <div class="flex gap-3 mt-1">
        <button
          (click)="cancelled.emit()"
          class="flex-1 h-[46px] rounded-[24px] text-[14px] font-bold text-[var(--ink2)] bg-[var(--surface)] transition-all duration-150 hover:bg-[var(--surface2)] cursor-pointer"
        >
          إلغاء
        </button>
        <button
          (click)="confirmed.emit()"
          class="flex-1 h-[46px] rounded-[24px] text-[14px] font-bold text-white transition-all duration-150 hover:opacity-90 cursor-pointer border-none"
          style="
            background: var(--coral);
            box-shadow: 0 4px 16px rgba(240, 106, 106, 0.28);
            font-family: var(--font);
          "
        >
          <i class="bi bi-trash3 me-1"></i>
          حذف الدرس
        </button>
      </div>
    </div>
  </div>
}
