<!-- Delete confirmation modal -->
<app-delete-modal
  [open]="modal.open"
  [lessonName]="modal.lessonName"
  (confirmed)="onDeleteConfirm()"
  (cancelled)="closeModal()" />

<div class="max-w-[1200px] mx-auto px-14 pt-[100px] pb-20 max-sm:px-5 max-sm:pt-[88px] relative">

  <!-- Page header -->
  <div class="mb-8">
    <p class="text-[12px] font-bold tracking-widest uppercase text-[var(--muted)] mb-1 mt-0">
      // إدارة المحتوى
    </p>
    <h1 class="text-[36px] font-black text-[var(--ink)] leading-none mb-2 mt-0">دروسي</h1>
    <p class="text-[14px] text-[var(--muted)] m-0">
      إدارة جميع دروس الفيزياء · {{ toAr(totalCount) }} دروس
    </p>
  </div>

  <!-- Toolbar -->
  <app-lessons-toolbar
    (searchChange)="onSearch($event)"
    (statusChange)="onStatusChange($event)" />

  <!-- Table -->
  <app-lessons-table
    [lessons]="filteredLessons"
    (toggleStatus)="onToggle($event)"
    (deleteLesson)="onDeleteRequest($event)" />

</div>
