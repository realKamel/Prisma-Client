<div class="bg-[var(--surface2)] border border-[var(--border)] rounded-2xl p-6">
    <p class="text-xs font-bold tracking-widest text-[var(--muted)] uppercase mb-1">اللون الرئيسي</p>
    <p class="text-sm text-[var(--muted)] mb-6 leading-relaxed">التغيير بيتطبق على واجهة المنصة كلها بعد الحفظ</p>

    <!-- Swatches -->
    <div class="flex flex-wrap gap-4 mb-8" role="radiogroup" aria-label="اختيار لون اللكنت">
        @for (sw of swatches; track sw.key) {
        <button (click)="select(sw.key)" [attr.aria-checked]="selected === sw.key" role="radio"
            class="flex-1 min-w-[140px] max-w-[220px] flex flex-col items-center gap-4 p-7 rounded-2xl border-2 cursor-pointer
               transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--border-focus)]" [style.borderColor]="selected === sw.key ? sw.hex : 'var(--border)'"
            [style.background]="selected === sw.key ? 'rgba(' + sw.rgb + ',0.08)' : 'var(--surface2)'"
            [style.transform]="selected === sw.key ? 'translateY(-2px)' : ''">

            <!-- Circle -->
            <div class="w-[72px] h-[72px] rounded-full flex items-center justify-center flex-shrink-0"
                [style.background]="sw.hex">
                @if (selected === sw.key) {
                <svg class="text-white w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                }
            </div>

            <span class="text-base font-bold text-[var(--ink)]">{{ sw.nameAr }}</span>
            @if (sw.isDefault) {
            <span class="text-xs font-bold px-3 py-0.5 rounded-full
                       bg-[rgba(var(--accent-rgb),0.14)] text-[var(--purple-lt)]">الافتراضي</span>
            }
        </button>
        }
    </div>

    <!-- Save row -->
    <div class="flex items-center gap-3 pt-5 border-t border-[var(--border)] flex-wrap">
        <button (click)="save()" [disabled]="saving" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl
             bg-[var(--purple)] hover:opacity-90 text-white text-sm font-bold
             transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed
             focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--purple)]">
            @if (saving) {
            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" aria-hidden="true">
                <path d="M12 2a10 10 0 0 1 10 10" />
            </svg>
            }
            <span>حفظ اللون</span>
        </button>

        @if (saved) {
        <span class="inline-flex items-center gap-1.5 text-sm font-bold text-[var(--mint)]">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            تم الحفظ
        </span>
        }
    </div>
</div>
