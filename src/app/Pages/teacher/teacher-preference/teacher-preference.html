<div dir="rtl" class="min-h-screen bg-[var(--bg)] text-[var(--ink)] font-[var(--font)] p-6 md:p-10">

  <!-- Page header -->
  <div class="flex items-start justify-between gap-4 mb-8 flex-wrap">
    <div>
      <p class="text-xs font-bold tracking-widest text-[var(--purple-lt)] uppercase mb-1">// الإعدادات</p>
      <h1 class="text-3xl font-black text-[var(--ink)] mb-1">التخصيص</h1>
      <p class="text-sm text-[var(--muted)]">اضبط مظهر المنصة وإعداداتها حسب أسلوبك</p>
    </div>
    <a href="13-teacher-dashboard.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-[var(--border)]
              text-sm font-bold text-[var(--muted)] hover:text-[var(--ink)] hover:border-[var(--border-focus)]
              transition-all duration-150 no-underline">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="8" height="9" rx="2" />
        <rect x="13" y="3" width="8" height="5" rx="2" />
        <rect x="13" y="12" width="8" height="9" rx="2" />
        <rect x="3" y="16" width="8" height="5" rx="2" />
      </svg>
      لوحة التحكم
    </a>
  </div>

  <!-- Tab bar -->
  <div class="flex gap-1 border-b border-[var(--border)] mb-6" role="tablist">
    @for (tab of tabs; track tab.key) {
    <button (click)="setTab(tab.key)" [attr.aria-selected]="activeTab === tab.key" role="tab" class="px-5 py-3 text-sm font-bold whitespace-nowrap border-b-2 -mb-px
               transition-all duration-150 focus:outline-none cursor-pointer
               focus-visible:ring-2 focus-visible:ring-[var(--purple)]"
      [style.color]="activeTab === tab.key ? 'var(--purple-lt)' : 'var(--muted)'"
      [style.borderBottomColor]="activeTab === tab.key ? 'var(--purple)' : 'transparent'">
      {{ tab.label }}
    </button>
    }
  </div>

  <!-- TAB: THEME -->
  @if (activeTab === 'theme') {
  <div role="tabpanel">
    <app-color-picker />
  </div>
  }

  <!-- TAB: SETTINGS -->
  @if (activeTab === 'settings') {
  <div role="tabpanel" class="flex flex-col gap-6">
    <app-announcement />
    <app-section-toggles />
  </div>
  }

</div>
