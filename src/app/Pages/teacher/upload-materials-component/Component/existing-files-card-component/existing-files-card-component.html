<section class="rounded-[var(--radius-card)] border border-[var(--border)] bg-[var(--surface)] p-6 sm:p-8">

  <div class="mb-4 flex items-center justify-between">
    <h3 class="text-base font-bold text-[var(--ink)]">الملفات المرفوعة</h3>
    <span class="rounded-full bg-[color-mix(in_srgb,var(--purple)_12%,transparent)] px-3 py-1 text-xs font-bold text-[var(--purple-lt)]">
      {{ toAr(allFiles.length) }} {{ allFiles.length === 1 ? 'ملف' : 'ملفات' }}
    </span>
  </div>

  <div class="mb-3 flex flex-wrap gap-2">
    <button
      *ngFor="let chip of filterChips"
      type="button"
      (click)="filterChange.emit(chip.value)"
      [ngClass]="activeFilter === chip.value
        ? 'border-[var(--purple)] bg-[var(--purple)] text-white'
        : 'border-[var(--border)] text-[var(--muted)]'"
      class="rounded-full border px-4 py-1.5 text-xs font-bold transition-colors"
    >
      {{ chip.label }}
    </button>
  </div>

  <div class="flex flex-col gap-1">
    <div *ngIf="!filteredFiles.length" class="p-6 text-center text-sm text-[var(--muted)]">
      لا يوجد ملفات من هذا النوع
    </div>

    <div
      *ngFor="let file of filteredFiles"
      class="flex items-center gap-3 rounded-xl p-3 transition-colors hover:bg-[color-mix(in_srgb,var(--ink)_4%,transparent)]"
    >
      <div [ngClass]="fileTypeIconClasses(file.type)" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg text-[10px] font-black">
        {{ fileTypeLabel(file.type) }}
      </div>
      <div class="min-w-0 flex-1">
        <div class="truncate text-sm font-bold text-[var(--ink)]">{{ file.name }}</div>
        <div class="text-xs text-[var(--muted)]">{{ file.size }} — رُفع {{ file.date }}</div>
      </div>
      <button
        type="button"
        (click)="delete.emit(file.id)"
        aria-label="حذف الملف"
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[var(--muted)] transition-colors hover:bg-[color-mix(in_srgb,var(--coral)_14%,transparent)] hover:text-[var(--coral)]"
      >
        <i class="bi bi-trash3"></i>
      </button>
    </div>
  </div>

</section>
