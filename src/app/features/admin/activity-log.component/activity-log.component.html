<div class="max-w-7xl mx-auto p-4 pt-20 md:p-6 lg:p-8">
  <app-log-page-header />
  <app-kpi-strip [stats]="stats()" />
  <div class="rounded-2xl border border-border bg-surface p-5">
    <app-log-toolbar (searchChange)="onSearchChange($event)" />
    <app-filter-chips
      [activeFilter]="activeFilter()"
      [counts]="chipCounts()"
      (filterChange)="onFilterChange($event)"
    />
    <app-log-table
      [events]="filteredEvents()"
      [hasMore]="hasMore()"
      [loadingMore]="loadingMore()"
      (loadMore)="onLoadMore()"
    />
  </div>
</div>
