<div
  class="max-w-7xl mx-auto p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <app-log-page-header />
  <app-kpi-strip [stats]="stats()" />
  <div
    class="rounded-2xl border border-border bg-surface p-5"
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.15 }"
  >
    <app-log-toolbar (searchChange)="onSearchChange($event)" />
    <app-filter-chips
      [activeFilter]="activeFilter()"
      [counts]="chipCounts()"
      (filterChange)="onFilterChange($event)"
    />
    <app-log-table
      [events]="filteredEvents()"
      [hasMore]="hasMore()"
      [loadingMore]="loadingMore()"
      (loadMore)="onLoadMore()"
    />
  </div>
</div>
