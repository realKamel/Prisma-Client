<div
  class="mb-5 flex flex-wrap items-center gap-2"
  role="group"
  aria-label="تصفية الأحداث"
>
  @for (chip of chips; track chip.id) {
    <button
      type="button"
      ngmMotion
      [whileTap]="{ scale: 0.96, transition: { type: 'spring', stiffness: 520, damping: 30 } }"
      class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border px-4 py-2 text-sm font-bold transition-[color,background-color,border-color,filter] duration-200 hover:brightness-110"
      [class.border-primary]="chip.id === activeFilter()"
      [class.text-primary-light]="chip.id === activeFilter()"
      [class.bg-[rgba(var(--color-primary-rgb),0.12)]]="chip.id === activeFilter()"
      [class.border-border]="chip.id !== activeFilter()"
      [class.bg-surface-subtle]="chip.id !== activeFilter()"
      [class.text-muted]="chip.id !== activeFilter()"
      [class.hover:border-border-focus]="chip.id !== activeFilter()"
      [class.hover:text-ink-subtle]="chip.id !== activeFilter()"
      (click)="select(chip.id)"
    >
      {{ chip.label }}

      <span
        class="min-w-6 rounded-full px-2 py-0.5 text-center text-xs font-extrabold"
        [class]="
          chip.id === activeFilter()
            ? 'bg-primary text-white'
            : 'text-primary-light bg-[rgba(var(--color-primary-rgb),0.15)]'
        "
      >
        {{ getCount(chip.id) | number }}
      </span>
    </button>
  }
</div>
