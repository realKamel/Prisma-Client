<div class="flex items-center gap-2 flex-wrap mb-5" role="group" aria-label="تصفية الأحداث">
  @for (chip of chips; track chip.id) {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full border text-sm font-bold transition-colors"
      [class]="
        chip.id === activeFilter()
          ? 'border-primary bg-[rgba(var(--color-primary-rgb),0.12)] text-primary-light'
          : 'border-border bg-surface-subtle text-muted hover:border-border-focus hover:text-ink-subtle'
      "
      (click)="select(chip.id)"
    >
      {{ chip.label }}
      <span
        class="text-xs font-extrabold rounded-full px-2 py-0.5 min-w-6 text-center"
        [class]="
          chip.id === activeFilter()
            ? 'bg-primary text-white'
            : 'bg-[rgba(var(--color-primary-rgb),0.15)] text-primary-light'
        "
      >
        {{ counts()[chip.id] | number }}
      </span>
    </button>
  }
</div>
