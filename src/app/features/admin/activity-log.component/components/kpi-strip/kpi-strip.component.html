<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
  @for (tile of tiles(); track tile.label; let i = $index) {
    <div
      class="rounded-card border border-border bg-surface p-5 cursor-default transition-shadow hover:shadow-[0_6px_28px_var(--accent-glow)]"
      ngmMotion
      [initial]="{ opacity: 0, y: 14 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: i * 0.05 }"
    >
      <div class="text-xs font-bold text-muted mb-2">{{ tile.label }}</div>
      <div class="text-3xl font-extrabold" [class]="tile.valueColorClass">
        <span [appCountUp]="tile.value"></span>
      </div>
      <div class="text-xs text-muted mt-1">{{ tile.sub }}</div>
    </div>
  }
</div>
