@if (totalItems() > 0) {
  <div class="flex items-center justify-between gap-3 flex-wrap mt-5">
    <div class="text-sm font-semibold text-muted">
      عرض {{ rangeStart | number }}-{{ rangeEnd | number }} من {{ totalItems() | number }} حدث
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        aria-label="الصفحة السابقة"
        class="w-9 h-9 rounded-10 border border-border bg-surface-subtle text-ink-subtle flex items-center justify-center hover:border-border-focus hover:text-ink transition-colors disabled:opacity-40 disabled:cursor-default"
        [disabled]="currentPage() === 1"
        (click)="goTo(currentPage() - 1)"
      >
        <ng-icon name="bootstrapChevronLeft" class="text-sm"></ng-icon>
      </button>

      @for (page of pages; track page) {
        <button
          type="button"
          class="w-9 h-9 rounded-10 border text-sm font-bold flex items-center justify-center transition-colors"
          [class]="
            page === currentPage()
              ? 'border-primary bg-[rgba(var(--color-primary-rgb),0.14)] text-primary-light'
              : 'border-border bg-surface-subtle text-ink-subtle hover:border-border-focus hover:text-ink'
          "
          (click)="goTo(page)"
        >
          {{ page | number }}
        </button>
      }

      <button
        type="button"
        aria-label="الصفحة التالية"
        class="w-9 h-9 rounded-10 border border-border bg-surface-subtle text-ink-subtle flex items-center justify-center hover:border-border-focus hover:text-ink transition-colors disabled:opacity-40 disabled:cursor-default"
        [disabled]="currentPage() === totalPages()"
        (click)="goTo(currentPage() + 1)"
      >
        <ng-icon name="bootstrapChevronRight" class="text-sm"></ng-icon>
      </button>
    </div>
  </div>
}
