<div class="flex items-center gap-3 flex-wrap mb-4">
  <div class="relative flex-1 max-w-7xl">
    <ng-icon
      name="bootstrapSearch"
      class="absolute top-1/2 -translate-y-1/2 right-4 text-muted pointer-events-none"
    >
    </ng-icon>
    <input
      type="text"
      placeholder="ابحث باسم المستخدم أو الحدث..."
      class="w-full h-11 bg-[var(--surface2)] border border-[var(--border)] rounded-xl pr-11 pl-4 text-sm text-ink placeholder:text-muted focus:outline-none focus:border-primary transition-colors"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>
</div>
