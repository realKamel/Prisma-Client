<div class="border-border flex items-start gap-3 border-b py-3 last:border-b-0">
  <div
    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"
    [class]="iconBgClass()"
  >
    <ng-icon
      class="text-sm"
      [class]="[iconColorClass()]"
      [name]="icon()"
      aria-hidden="true"
    ></ng-icon>
  </div>
  <div class="min-w-0 flex-1">
    <div class="text-ink line-clamp-2 text-sm leading-snug font-bold">
      {{ activity().message }}
    </div>
    <div class="text-muted mt-0.5 truncate text-xs">{{ activity().subtitle }}</div>
  </div>
  <span class="text-muted mt-0.5 shrink-0 text-xs">{{ activity().time }}</span>
</div>
