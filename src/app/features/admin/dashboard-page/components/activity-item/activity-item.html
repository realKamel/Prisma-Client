<div class="flex items-start gap-3 py-3 border-b border-[var(--border)] last:border-b-0">
  <div
    class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-xl"
    [class]="iconBgClass()"
  >
    <ng-icon
      class="text-sm"
      [class]="[iconColorClass()]"
      [name]="icon()"
      aria-hidden="true"
    ></ng-icon>
  </div>
  <div class="min-w-0 flex-1">
    <div class="line-clamp-2 leading-snug text-sm font-bold text-ink">
      {{ activity().message }}
    </div>
    <div class="truncate text-xs text-muted mt-0.5">{{ activity().subtitle }}</div>
  </div>
  <span class="flex-shrink-0 text-xs text-muted mt-0.5">{{ activity().time }}</span>
</div>
