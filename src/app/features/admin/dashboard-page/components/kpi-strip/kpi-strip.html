<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
  @for (kpi of kpis(); track kpi.id; let i = $index) {
    <app-kpi-tile
      [kpi]="kpi"
      ngmMotion
      [initial]="{ opacity: 0, y: 16 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: i * 0.06 }"
    />
  }
</div>
