<div
  class="rounded-card border-border bg-surface flex cursor-default flex-col gap-2 border p-5 transition-shadow hover:shadow-[0_8px_30px_rgba(0,0,0,0.12)]"
  ngmMotion
  [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
>
  <div class="text-muted text-xs font-bold">{{ labelKey() | translate }}</div>

  <div class="flex items-baseline gap-1.5">
    @if (animated()) {
      <span
        class="text-ink text-3xl font-black tracking-[-1px]"
        countUp
        [countUpTarget]="kpi().value"
      >
        0
      </span>
    } @else {
      <span class="text-ink text-3xl font-black tracking-[-1px]">{{ kpi().value | number }}</span>
    }
    @if (unitKey()) {
      <span class="text-muted text-xs font-bold">{{ unitKey() | translate }}</span>
    }
  </div>

  <div
    class="text-xs font-bold"
    [class]="deltaClass()"
  >
    {{ kpi().deltaLabel }}
  </div>
</div>
