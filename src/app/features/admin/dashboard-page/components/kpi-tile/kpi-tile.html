<div
  class="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-5 flex flex-col gap-2"
  [class]="borderGlowClass()"
>
  <div class="text-xs font-bold text-muted">{{ label() }}</div>

  <div class="flex items-baseline gap-1.5">
    @if (animated()) {
      <span
        class="text-[28px] font-black tracking-[-1px] text-ink"
        countUp
        [countUpTarget]="kpi().value"
      >
        ٠
      </span>
    } @else {
      <span class="text-[28px] font-black tracking-[-1px] text-ink">{{
        kpi().value | number
      }}</span>
    }
    @if (unit()) {
      <span class="text-xs font-bold text-muted">{{ unit() }}</span>
    }
  </div>

  <div class="text-xs font-bold" [class]="deltaClass()">{{ kpi().deltaLabel }}</div>
</div>
