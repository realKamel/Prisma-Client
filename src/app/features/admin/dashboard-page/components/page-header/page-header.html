<div
  class="mb-6"
  ngmMotion
  [initial]="{ opacity: 0, y: -10 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-[-1px] leading-tight mb-2 text-ink">
        {{ 'ADMIN_DASHBOARD.PAGE_HEADER.TITLE' | translate }}
      </h1>
      <p class="text-sm text-muted">
        {{ 'ADMIN_DASHBOARD.PAGE_HEADER.SUBTITLE_PREFIX' | translate }}
        {{ pageDateLabel() | date: 'fullDate' }}
      </p>
    </div>
  </div>
</div>
