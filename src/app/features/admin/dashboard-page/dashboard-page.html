<main
  class="mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <app-page-header [pageDateLabel]="pageDateLabel()" />
  <app-kpi-strip [kpis]="kpis()" />
  <div class="mb-6 grid grid-cols-1 items-stretch gap-6 lg:grid-cols-[1fr_340px]">
    <app-revenue-chart
      [data]="revenueWeek()"
      [weeklyTotal]="weeklyTotal()"
    />
    <app-activity-feed [activity]="activity()" />
  </div>
  <!-- <app-section-nav-grid [cards]="sectionCards()" /> -->
</main>
