<main class="max-w-[1180px] mx-auto px-6 py-8">

  <app-kpi-strip [kpis]="kpis()" />

  <div class="grid grid-cols-1 lg:grid-cols-[1fr_340px] gap-6 mb-6 items-stretch">
    <app-revenue-chart [data]="revenueWeek()" [weeklyTotal]="weeklyTotal()" />

  <app-section-nav-grid [cards]="sectionCards()" />
</main>
