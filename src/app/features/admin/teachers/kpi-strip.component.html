<div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
  @for (tile of tiles(); track tile.label; let i = $index) {
    <div
      class="rounded-card border-border bg-surface flex cursor-default flex-col gap-1 border p-5 transition-shadow hover:shadow-[0_8px_30px_rgba(0,0,0,0.12)]"
      ngmMotion
      [initial]="{ opacity: 0, y: 14 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: i * 0.05 }"
    >
      <div class="text-muted text-xs font-bold">{{ tile.label }}</div>
      <div class="flex items-baseline gap-1">
        <span
          ngmMotion
          [animate]="{ scale: [1, 1.1, 1] }"
          [transition]="{ duration: 0.2 }"
          [appCountUp]="tile.value"
          [mode]="tile.unit ? 'currency' : 'number'"
          class="text-ink text-3xl font-black"
        ></span>
      </div>
      <div
        class="text-xs font-bold"
        [class]="tile.deltaUp ? 'text-mint' : 'text-coral'"
      >
        {{ tile.delta }}
      </div>
    </div>
  }
</div>
