<div class="grid grid-cols-2 gap-4 lg:grid-cols-4">
  @for (tile of tiles(); track tile.label) {
    <div class="flex flex-col gap-1 rounded-card border border-border bg-surface p-5">
      <div class="text-xs font-bold text-muted">{{ tile.label }}</div>
      <div class="flex items-baseline gap-1">
        <span class="text-3xl font-black text-ink">{{ tile.value | number }}</span>
        @if (tile.unit) {
          <span class="text-xs font-bold text-muted">{{ tile.unit }}</span>
        }
      </div>
      <div class="text-xs font-bold" [class]="tile.deltaUp ? 'text-mint' : 'text-coral'">
        {{ tile.delta }}
      </div>
    </div>
  }
</div>
