<div
  *ngIf="open"
  (click)="close()"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'sus-title'"
  class="fixed inset-0 z-50 flex items-center justify-center bg-[color-mix(in_srgb,black_55%,transparent)] p-4"
>
  <div
    (click)="$event.stopPropagation()"
    class="w-full max-w-sm rounded-[var(--radius-card)] border border-[var(--border)] bg-[var(--surface)] p-6 sm:p-8"
  >

    <h2 id="sus-title" class="mb-2 text-lg font-extrabold text-[var(--ink)]">{{ title }}</h2>
    <p class="mb-4 text-sm text-[var(--muted)]">{{ subtitle }}</p>

    <textarea
      [(ngModel)]="reason"
      rows="3"
      placeholder="سبب الإيقاف (اختياري)…"
      class="w-full resize-y rounded-xl border border-[var(--border)] bg-[var(--surface2)] px-4 py-3 text-sm text-[var(--ink)] placeholder:text-[var(--muted)] focus:border-[var(--border-focus)] focus:outline-none"
    ></textarea>

    <div class="mt-5 flex justify-end gap-3">
      <button
        type="button"
        (click)="close()"
        class="rounded-full border border-[var(--border)] px-6 py-2.5 text-sm font-bold text-[var(--ink2)] transition-colors hover:border-[var(--border-focus)] hover:text-[var(--ink)]"
      >إلغاء</button>
      <button
        type="button"
        (click)="confirm()"
        class="rounded-full px-6 py-2.5 text-sm font-bold text-white transition-opacity hover:opacity-90"
        style="background:var(--coral);"
      >{{ confirmLabel }}</button>
    </div>

  </div>
</div>
