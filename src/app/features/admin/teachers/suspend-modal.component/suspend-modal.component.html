@if (open()) {
  <div
    (click)="close()"
    (keydown.escape)="close()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'sus-title'"
    class="fixed inset-0 z-50 flex items-center justify-center bg-[color-mix(in_srgb,black_55%,transparent)] p-4"
  >
    <div
      (click)="$event.stopPropagation()"
      class="w-full max-w-sm rounded-card border border-border bg-surface p-6 sm:p-8"
    >
      <h2 id="sus-title" class="mb-2 text-lg font-extrabold text-ink">{{ title() }}</h2>
      <p class="mb-4 text-sm text-muted">{{ subtitle() }}</p>

      <textarea
        [(ngModel)]="reason"
        rows="3"
        placeholder="سبب الإيقاف (اختياري)…"
        class="w-full resize-y rounded-xl border border-border bg-surface-subtle px-4 py-3 text-sm text-ink placeholder:text-muted focus:border-border-focus focus:outline-none"
      ></textarea>

      <div class="mt-5 flex justify-end gap-3">
        <button
          type="button"
          (click)="close()"
          (keydown.escape)="close()"
          class="rounded-full border border-border px-6 py-2.5 text-sm font-bold text-ink-subtle transition-colors hover:border-border-focus hover:text-ink"
        >
          إلغاء
        </button>
        <button
          type="button"
          (click)="confirm()"
          class="rounded-full px-6 py-2.5 text-sm font-bold text-white transition-opacity hover:opacity-90"
          style="background: var(--color-coral)"
        >
          {{ confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
