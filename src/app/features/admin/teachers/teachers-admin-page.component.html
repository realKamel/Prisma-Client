<app-admin-toast [toast]="toast()"></app-admin-toast>

<app-suspend-modal
  [open]="!!suspendTarget()"
  [teacher]="suspendTarget()"
  (closed)="suspendTarget.set(null)"
  (confirmed)="onSuspendConfirmed($event)"
></app-suspend-modal>

<div
  class="mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <!-- Page header -->
  <div
    class="mb-8 flex flex-wrap items-start justify-between gap-4"
    ngmMotion
    [initial]="{ opacity: 0, y: -8 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
  >
    <div>
      <h1 class="text-2xl font-extrabold text-ink sm:text-3xl">إدارة المعلمين</h1>
      <p class="mt-2 text-sm text-muted">مراجعة المعلمين وتفعيل أو إيقاف الحسابات</p>
    </div>
  </div>

  <!-- KPI strip -->
  <div class="mb-6">
    <app-kpi-strip [tiles]="kpiTiles()"></app-kpi-strip>
  </div>

  <!-- Toolbar -->
  <div class="mb-4">
    <app-teachers-toolbar
      [filters]="filters()"
      (filtersChange)="onFiltersChange($event)"
    ></app-teachers-toolbar>
  </div>

  <!-- Table -->
  <app-teachers-table
    [teachers]="filteredTeachers()"
    (openSuspend)="openSuspend($event)"
    (activate)="activateTeacher($event)"
  ></app-teachers-table>
</div>
