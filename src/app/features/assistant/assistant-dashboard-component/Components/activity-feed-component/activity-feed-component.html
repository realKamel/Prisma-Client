<div class="bg-surface border-border rounded-20 border p-6">
  <!-- Header -->
  <div class="mb-5 flex items-start justify-between">
    <div>
      <h2 class="text-ink m-0 text-base font-black">آخر الأنشطة</h2>
      <p class="text-muted mt-0.5 mb-0 text-[12px]">إجراءاتك الأخيرة على المنصة</p>
    </div>
    <a
      routerLink="/dashboard/myactivity-log"
      class="text-primary-light rounded-full px-3 py-1.5 text-[12px] font-bold no-underline transition-colors duration-150 hover:bg-[rgba(var(--color-primary-rgb),.12)]"
      >عرض الكل</a
    >
  </div>

  <!-- Activity list -->
  <div class="divide-border flex flex-col divide-y">
    @for (item of activities(); track item) {
      <div class="flex items-start gap-3 py-3.5 first:pt-0 last:pb-0">
        <!-- Icon -->
        <div
          class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"
          [class]="iconBg(item.type)"
        >
          <ng-icon
            class="text-[15px]"
            [name]="item.icon"
            [class]="[iconColor(item.type)]"
          ></ng-icon>
        </div>
        <!-- Body -->
        <div class="min-w-0 flex-1">
          <p class="text-ink m-0 text-[13px] leading-snug font-semibold">
            {{ item.message }}
          </p>
          <p class="text-muted mt-0.5 mb-0 text-[11px]">{{ item.sub }}</p>
        </div>
        <!-- Time -->
        <span class="text-muted mt-0.5 shrink-0 text-[11px]">{{ item.time }}</span>
      </div>
    }
  </div>
</div>
