<div class="kpi-strip mb-8 grid grid-cols-2 gap-4 lg:grid-cols-4">
  @for (kpi of kpis(); track kpi) {
    <div
      class="rounded-card bg-surface border-border relative flex flex-col gap-3 overflow-hidden border p-5 transition-transform duration-200 hover:-translate-y-0.5"
    >
      <!-- Colored top border bar -->
      <div
        class="rounded-t-20 absolute inset-x-0 top-0 h-0.75"
        /* [style]="variantClasses(kpi.variant).bar" */
      ></div>
      <!-- Label -->
      <div class="text-muted pt-1 text-xs font-semibold">
        {{ kpi.label }}
      </div>
      <!-- Value row: big number + unit -->
      <div class="flex items-baseline gap-2">
        <span
          #counter
          class="text-[40px] leading-none font-black"
          /* [style]="variantClasses(kpi.variant).valueStyle" */
          >٠</span
        >
        <span class="text-muted text-sm font-bold">{{ kpi.unit }}</span>
      </div>
      <!-- Delta -->
      <div
        class="flex items-center gap-1 text-xs font-bold"
        /* [style]="variantClasses(kpi.variant).deltaStyle" */
      >
        <ng-icon
          [name]="kpi.trend === 'up' ? 'bootstrapArrowUpRight' : 'bootstrapArrowDownLeft'"
          class="text-xs"
        >
        </ng-icon>
        {{ kpi.delta }}
      </div>
    </div>
  }
</div>
