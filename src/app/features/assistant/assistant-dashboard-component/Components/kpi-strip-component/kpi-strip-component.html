<div class="kpi-strip grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
  @for (kpi of kpis(); track kpi) {
    <div
      class="relative rounded-[20px] overflow-hidden p-5 flex flex-col gap-3 bg-[var(--surface)] border border-[var(--border)] transition-transform duration-200 hover:-translate-y-0.5"
    >
      <!-- Colored top border bar -->
      <div
        class="absolute top-0 inset-x-0 h-[3px] rounded-t-[20px]"
        [style]="variantClasses(kpi.variant).bar"
      ></div>
      <!-- Label -->
      <div class="text-[12px] font-semibold text-muted pt-1">
        {{ kpi.label }}
      </div>
      <!-- Value row: big number + unit -->
      <div class="flex items-baseline gap-2">
        <span
          #counter
          class="text-[40px] font-black leading-none"
          [style]="variantClasses(kpi.variant).valueStyle"
          >٠</span
        >
        <span class="text-[14px] font-bold text-muted">{{ kpi.unit }}</span>
      </div>
      <!-- Delta -->
      <div
        class="flex items-center gap-1 text-[12px] font-bold"
        [style]="variantClasses(kpi.variant).deltaStyle"
      >
        <ng-icon
          [name]="kpi.trend === 'up' ? 'bootstrapArrowUpRight' : 'bootstrapArrowDownLeft'"
          class="text-[11px]"
        >
        </ng-icon>
        {{ kpi.delta }}
      </div>
    </div>
  }
</div>
