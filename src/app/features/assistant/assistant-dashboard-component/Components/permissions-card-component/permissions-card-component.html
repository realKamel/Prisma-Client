<div class="bg-surface border-border rounded-20 border p-6">
  <!-- Header -->
  <div class="mb-4">
    <h2 class="text-ink m-0 text-base font-black">صلاحياتي</h2>
    <p class="text-muted mt-0.5 mb-0 text-[12px]">ايه اللي تقدر تعمله على المنصة</p>
  </div>

  <!-- Permission rows -->
  <div class="divide-border flex flex-col divide-y">
    @for (perm of permissions(); track perm) {
      <div class="flex items-center justify-between gap-3 py-3 first:pt-0 last:pb-0">
        <div class="min-w-0 flex-1">
          <p class="text-ink m-0 text-sm font-bold">{{ perm.label }}</p>
          <p class="text-muted mt-0.5 mb-0 text-[11px]">{{ perm.sub }}</p>
        </div>
        <span
          class="flex shrink-0 items-center gap-1.5 rounded-full px-3 py-1 text-[11px] font-bold"
          [class]="badgeClasses(perm.status)"
        >
          <ng-icon
            class="text-[10px]"
            [name]="badgeIcon(perm.status)"
          ></ng-icon>
          {{ badgeLabel(perm.status) }}
        </span>
      </div>
    }
  </div>
</div>
