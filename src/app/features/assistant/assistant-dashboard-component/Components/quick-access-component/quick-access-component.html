<div class="bg-surface border border-border rounded-20 p-6">
  <!-- Header -->
  <h2 class="text-base font-black text-ink mb-4 mt-0">وصول سريع</h2>

  <!-- Links -->
  <div class="flex flex-col gap-1">
    @for (item of items(); track item) {
      <a
        [href]="item.route"
        class="flex items-center gap-3 px-3 py-2.5 rounded-xl no-underline text-ink-subtle font-semibold text-sm transition-all duration-150 hover:bg-[rgba(var(--color-primary-rgb),.08)] hover:text-ink"
      >
        <!-- Icon bubble -->
        <div
          class="w-9 h-9 rounded-10 flex items-center justify-center flex-shrink-0"
          [style]="iconBgStyle(item)"
        >
          <ng-icon class="text-[15px]" [name]="item.icon" [style]="iconColorStyle(item)"></ng-icon>
        </div>
        <span>{{ item.label }}</span>
      </a>
    }
  </div>
</div>
