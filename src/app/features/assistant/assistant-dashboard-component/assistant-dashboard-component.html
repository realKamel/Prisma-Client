<!-- Loading state -->
@if (loading()) {
  <div class="flex min-h-dvh items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <div
        class="border-primary-light h-10 w-10 animate-spin rounded-full border-2 border-t-transparent"
      ></div>
      <p class="text-muted text-sm">جاري التحميل…</p>
    </div>
  </div>
}

<!-- Error state -->
@else if (error()) {
  <div class="flex min-h-dvh items-center justify-center">
    <div class="text-center">
      <ng-icon
        name="bootstrapWifiOff"
        class="text-coral mb-3 block text-[40px]"
      ></ng-icon>
      <p class="text-ink text-base font-bold">تعذّر تحميل البيانات</p>
      <p class="text-muted text-sm">تحقق من الاتصال أو حاول مرة أخرى</p>
    </div>
  </div>
}

<!-- Dashboard content -->
@else if (data(); as dashboardData) {
  <div
    class="mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8"
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
  >
    <!-- Page header -->
    <div
      ngmMotion
      [initial]="{ opacity: 0, y: -10 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.05 }"
    >
      <app-dashboard-header
        [teacherName]="dashboardData.teacher?.name"
        [supervisorName]="dashboardData.teacher?.supervisorName"
      />
    </div>
    <!-- KPI strip -->
    <div
      ngmMotion
      [initial]="{ opacity: 0, y: 16 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.1 }"
    >
      <app-kpi-strip [kpis]="dashboardData.kpis ?? []" />
    </div>
    <!-- 2-column grid: activity | permissions + quick access -->
    <div
      class="grid grid-cols-1 items-start gap-6 lg:grid-cols-[1fr_320px]"
      ngmMotion
      [initial]="{ opacity: 0, y: 20 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.16 }"
    >
      <!-- LEFT: Activity feed -->
      <app-activity-feed
        [activities]="dashboardData.activities ?? []"
        ngmMotion
        [initial]="{ opacity: 0, x: -12 }"
        [animate]="{ opacity: 1, x: 0 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 28, delay: 0.22 }"
      />
      <!-- RIGHT: stacked cards -->
      <div
        class="flex flex-col gap-6"
        ngmMotion
        [initial]="{ opacity: 0, x: 12 }"
        [animate]="{ opacity: 1, x: 0 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 28, delay: 0.28 }"
      >
        <app-permissions-card [permissions]="dashboardData.permissions ?? []" />
        <!-- <app-quick-access    [items]="data.quickAccess" /> -->
      </div>
    </div>
  </div>
}
