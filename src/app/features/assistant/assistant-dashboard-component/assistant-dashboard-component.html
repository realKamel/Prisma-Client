<!-- Loading state -->
@if (loading()) {
  <div class="flex items-center justify-center min-h-screen">
    <div class="flex flex-col items-center gap-3">
      <div
        class="w-10 h-10 rounded-full border-2 border-primary-light border-t-transparent animate-spin"
      ></div>
      <p class="text-[13px] text-muted">جاري التحميل…</p>
    </div>
  </div>
}

<!-- Error state -->
@if (error() && !loading()) {
  <div class="flex items-center justify-center min-h-screen">
    <div class="text-center">
      <ng-icon name="bootstrapWifiOff" class="text-[40px] text-coral block mb-3"></ng-icon>
      <p class="text-[15px] font-bold text-ink">تعذّر تحميل البيانات</p>
      <p class="text-[13px] text-muted">تحقق من الاتصال أو حاول مرة أخرى</p>
    </div>
  </div>
}

<!-- Dashboard content -->
@if (data() && !loading()) {
  <div class="max-w-7xl mx-auto p-4 pt-20 md:p-6 lg:p-8">
    <!-- Page header -->
    <app-dashboard-header
      [teacherName]="data()?.teacher?.name"
      [supervisorName]="data()?.teacher?.supervisorName"
    />
    <!-- KPI strip -->
    <app-kpi-strip [kpis]="data()?.kpis ?? []" />
    <!-- 2-column grid: activity | permissions + quick access -->
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-6 items-start">
      <!-- LEFT: Activity feed -->
      <app-activity-feed [activities]="data()?.activities ?? []" />
      <!-- RIGHT: stacked cards -->
      <div class="flex flex-col gap-6">
        <app-permissions-card [permissions]="data()?.permissions ?? []" />
        <!-- <app-quick-access    [items]="data.quickAccess" /> -->
      </div>
    </div>
  </div>
}
