<!-- Loading state -->
@if (loading()) {
  <div class="flex items-center justify-center min-h-screen">
    <div class="flex flex-col items-center gap-3">
      <div
        class="w-10 h-10 rounded-full border-2 border-primary-light border-t-transparent animate-spin"
      ></div>
      <p class="text-[13px] text-muted">جاري التحميل…</p>
    </div>
  </div>
}

<!-- Error state -->
@else if (error()) {
  <div class="flex items-center justify-center min-h-screen">
    <div class="text-center">
      <ng-icon name="bootstrapWifiOff" class="text-[40px] text-coral block mb-3"></ng-icon>
      <p class="text-[15px] font-bold text-ink">تعذّر تحميل البيانات</p>
      <p class="text-[13px] text-muted">تحقق من الاتصال أو حاول مرة أخرى</p>
    </div>
  </div>
}

<!-- Dashboard content -->
@else if (data(); as dashboardData) {
  <div
    class="max-w-7xl mx-auto p-4 pt-20 md:p-6 lg:p-8"
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
  >
    <!-- Page header -->
    <div
      ngmMotion
      [initial]="{ opacity: 0, y: -10 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.05 }"
    >
      <app-dashboard-header
        [teacherName]="dashboardData.teacher?.name"
        [supervisorName]="dashboardData.teacher?.supervisorName"
      />
    </div>
    <!-- KPI strip -->
    <div
      ngmMotion
      [initial]="{ opacity: 0, y: 16 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.1 }"
    >
      <app-kpi-strip [kpis]="dashboardData.kpis ?? []" />
    </div>
    <!-- 2-column grid: activity | permissions + quick access -->
    <div
      class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-6 items-start"
      ngmMotion
      [initial]="{ opacity: 0, y: 20 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.16 }"
    >
      <!-- LEFT: Activity feed -->
      <app-activity-feed
        [activities]="dashboardData.activities ?? []"
        ngmMotion
        [initial]="{ opacity: 0, x: -12 }"
        [animate]="{ opacity: 1, x: 0 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 28, delay: 0.22 }"
      />
      <!-- RIGHT: stacked cards -->
      <div
        class="flex flex-col gap-6"
        ngmMotion
        [initial]="{ opacity: 0, x: 12 }"
        [animate]="{ opacity: 1, x: 0 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 28, delay: 0.28 }"
      >
        <app-permissions-card [permissions]="dashboardData.permissions ?? []" />
        <!-- <app-quick-access    [items]="data.quickAccess" /> -->
      </div>
    </div>
  </div>
}
