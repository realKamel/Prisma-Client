@if (lesson()) {
  <div
    class="fixed inset-0 z-1000 flex items-center justify-center bg-black/40 backdrop-blur-[2px]"
    role="dialog"
    aria-modal="true"
    aria-label="تأكيد حذف الدرس"
    (click)="cancel.emit()"
  >
    <div
      (click)="$event.stopPropagation()"
      class="w-[90%] max-w-105 rounded-xl bg-surface p-8"
    >
      <div class="mb-3 flex items-center gap-2">
        <ng-icon name="bootstrapExclamationTriangle" class="text-lg text-coral"></ng-icon>
        <h3 class="text-lg font-bold text-ink">حذف الدرس</h3>
      </div>

      <p class="mb-1 text-sm leading-relaxed text-muted">
        هل أنت متأكد من حذف درس
        <strong class="font-bold text-ink">{{ lesson()?.title }}</strong
        >؟
      </p>
      <p class="mb-6 text-xs text-muted">هذا الإجراء لا يمكن التراجع عنه.</p>

      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="cancel.emit()"
          class="rounded-md bg-surface-subtle px-5 py-2.5 text-sm font-bold text-ink transition-colors hover:bg-black/[0.08]"
        >
          إلغاء
        </button>
        <button
          type="button"
          (click)="confirm.emit()"
          class="rounded-md bg-coral px-5 py-2.5 text-sm font-bold text-white transition-colors hover:bg-[rgba(240,106,106,0.9)] flex items-center justify-center"
        >
          <ng-icon name="bootstrapTrash" class="ms-1"></ng-icon>
          حذف الدرس
        </button>
      </div>
    </div>
  </div>
}
