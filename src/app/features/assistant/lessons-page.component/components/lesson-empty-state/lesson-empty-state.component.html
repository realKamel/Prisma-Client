<div class="flex flex-col items-center gap-4 px-6 py-12 text-center">
  <ng-icon name="bootstrapInbox" class="text-5xl text-muted"></ng-icon>

  @if (hasQuery()) {
    <div class="flex flex-col gap-1">
      <p class="text-base font-bold text-ink">لا يوجد دروس مطابقة</p>
      <p class="text-xs text-muted">جرّب كلمة بحث مختلفة</p>
    </div>
  } @else {
    <div class="flex flex-col gap-1">
      <p class="text-base font-bold text-ink">مافيش دروس</p>
      <p class="text-xs text-muted">ابدأ بإضافة درس جديد</p>
    </div>
    <button
      type="button"
      (click)="addLesson.emit()"
      class="mt-2 rounded-lg bg-primary px-5 py-2.5 text-sm font-bold text-white transition-colors hover:bg-primary-light"
    >
      <ng-icon name="bootstrapPlusLg" class="ms-1"></ng-icon>
      إضافة درس جديد
    </button>
  }
</div>
