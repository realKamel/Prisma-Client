<div class="mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8">
  <app-lessons-header
    [total]="totalCount()"
    [activeCount]="activeCount()"
    [draftedCount]="draftedCount()"
    [hiddenCount]="hiddenCount()"
  />

  <div class="mt-8 mb-4">
    <app-lessons-toolbar
      (search)="onSearch($event)"
      (addLesson)="onAddLesson()"
      (uploadMaterials)="onUploadMaterials()"
    />
  </div>

  <app-lessons-table
    [lessons]="filteredLessons()"
    [hasQuery]="searchQuery().length > 0"
    (edit)="onEdit($event)"
    (toggleStatus)="onToggleStatus($event)"
    (requestDelete)="onRequestDelete($event)"
    (addLesson)="onAddLesson()"
  />

  <div class="sr-only" aria-live="polite">يُعرض {{ filteredLessons().length }} درس</div>
</div>

<app-delete-lesson-modal
  [lesson]="deleteTarget()"
  (cancel)="onCancelDelete()"
  (confirm)="onConfirmDelete()"
/>

<app-lesson-toast [message]="toast().message" [visible]="toast().visible" />
