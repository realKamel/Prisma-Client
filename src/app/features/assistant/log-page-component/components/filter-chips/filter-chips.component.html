<div class="flex items-center gap-2 flex-wrap mb-5" role="group" aria-label="تصفية الإجراءات">
  @for (chip of chips(); track chip.key) {
    <button
      (click)="select(chip.key)"
      [class]="
        'chip inline-flex items-center gap-2 px-4 py-2 rounded-full border text-sm font-bold cursor-pointer transition-all duration-200 ' +
        (activeFilter() === chip.key
          ? 'border-primary bg-[rgba(var(--color-primary-rgb),0.12)] text-primary-light'
          : 'border-border bg-surface-subtle text-muted hover:border-border-focus hover:text-ink-subtle')
      "
    >
      <ng-icon [name]="chip.icon"></ng-icon>
      {{ chip.label }}
      <span
        [class]="
          'text-xs font-black rounded-full px-2 py-0.5 min-w-6 text-center transition-all duration-200 ' +
          (activeFilter() === chip.key
            ? 'bg-primary text-white'
            : 'bg-[rgba(var(--color-primary-rgb),0.15)] text-primary-light')
        "
      >
        {{ chip.count }}
      </span>
    </button>
  }
</div>
