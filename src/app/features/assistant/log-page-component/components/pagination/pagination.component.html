@if (totalPages > 0) {
  <div class="flex items-center justify-between flex-wrap gap-3 mt-5">
    <span class="text-sm text-muted font-semibold">
      عرض {{ rangeFrom }}-{{ rangeTo }} من {{ total() }}
    </span>
    <nav class="flex items-center gap-2" role="navigation" aria-label="تنقل بين الصفحات">
      <!-- Prev -->
      <button
        (click)="prev()"
        [disabled]="currentPage() === 1"
        class="w-9 h-9 rounded-xl border flex items-center justify-center text-sm font-bold transition-all duration-200 border-border bg-surface-subtle text-ink-subtle hover:border-border-focus hover:text-ink disabled:opacity-40 disabled:cursor-not-allowed"
        aria-label="الصفحة السابقة"
      >
        <ng-icon name="bootstrapChevronRight" class="text-sm"></ng-icon>
      </button>
      <!-- Page numbers -->
      @for (p of pages; track p) {
        <button
          (click)="goTo(p)"
          [attr.aria-current]="p === currentPage() ? 'page' : null"
          class="w-9 h-9 rounded-xl border flex items-center justify-center text-sm font-bold transition-all duration-200"
          [class]="
            p === currentPage()
              ? 'border-primary bg-[rgba(var(--color-primary-rgb),0.14)] text-primary-light'
              : 'border-border bg-surface-subtle text-ink-subtle hover:border-border-focus hover:text-ink'
          "
        >
          {{ p }}
        </button>
      }
      <!-- Next -->
      <button
        (click)="next()"
        [disabled]="currentPage() === totalPages"
        class="w-9 h-9 rounded-xl border flex items-center justify-center text-sm font-bold transition-all duration-200 border-border bg-surface-subtle text-ink-subtle hover:border-border-focus hover:text-ink disabled:opacity-40 disabled:cursor-not-allowed"
        aria-label="الصفحة التالية"
      >
        <ng-icon name="bootstrapChevronLeft" class="text-sm"></ng-icon>
      </button>
    </nav>
  </div>
}
