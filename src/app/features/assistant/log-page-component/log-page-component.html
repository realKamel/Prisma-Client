<main
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
  class="text-ink font-font"
>
  <div class="mx-auto max-w-7xl px-4 py-8">
    <!-- Loading state -->
    @if (loading()) {
      <div
        ngmMotion
        [initial]="{ opacity: 0, scale: 0.96 }"
        [animate]="{ opacity: 1, scale: 1 }"
        /* [exit]="{ opacity: 0, scale: 0.96 }" */
        [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
        class="flex items-center justify-center py-24"
      >
        <div class="text-muted flex flex-col items-center gap-4">
          <ng-icon
            name="bootstrapArrowRepeat"
            class="text-primary-light flex animate-spin items-center text-4xl"
            aria-hidden="true"
          ></ng-icon>
          <span class="text-sm font-semibold">جارٍ تحميل السجل…</span>
        </div>
      </div>
    }

    <!-- Error state -->
    @else if (error()) {
      <div
        ngmMotion
        [initial]="{ opacity: 0, y: 12 }"
        [animate]="{ opacity: 1, y: 0 }"
        [exit]="{ opacity: 0, y: -12 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
        class="flex items-center justify-center py-24"
      >
        <div class="flex flex-col items-center gap-4 p-8 text-center">
          <ng-icon
            name="bootstrapExclamationCircle"
            class="text-coral flex items-center text-4xl"
            aria-hidden="true"
          ></ng-icon>
          <p class="text-muted text-sm font-semibold">
            تعذّر تحميل البيانات. تحقق من الاتصال وأعد المحاولة.
          </p>
          <button
            (click)="loadData()"
            class="bg-primary rounded-xl px-4 py-2 text-sm font-bold text-white transition-opacity hover:opacity-90"
          >
            إعادة المحاولة
          </button>
        </div>
      </div>
    }

    <!-- Main page -->
    @else {
      <div class="flex flex-col gap-6">
        <!-- Page Header -->
        <app-page-header
          ngmMotion
          [initial]="{ opacity: 0, x: 18 }"
          [animate]="{ opacity: 1, x: 0 }"
          [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: 0.05 }"
        />

        <!-- KPI Strip -->
        <app-kpi-strip
          ngmMotion
          [initial]="{ opacity: 0, y: 14 }"
          [animate]="{ opacity: 1, y: 0 }"
          [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: 0.12 }"
          [meta]="meta()"
        />

        <!-- Log Card -->
        <div
          ngmMotion
          [initial]="{ opacity: 0, y: 18 }"
          [animate]="{ opacity: 1, y: 0 }"
          [whileHover]="{ y: -2 }"
          [transition]="{ type: 'spring', stiffness: 280, damping: 24, delay: 0.2 }"
          class="border-border bg-surface rounded-2xl border p-6"
        >
          <!-- Card head -->
          <div class="mb-5 flex items-center justify-between">
            <span class="text-ink text-base font-black">سجل الإجراءات</span>
            <span
              class="bg-primary/10 text-primary-light rounded-full px-3 py-1.5 text-xs font-bold"
            >
              {{ filteredLogs().length }} إجراء
            </span>
          </div>

          <!-- Filter Chips -->
          <app-filter-chips
            [logs]="allLogs()"
            [(activeFilter)]="activeFilter"
          />

          <!-- Table or Empty state -->
          @if (pagedLogs().length > 0) {
            <app-log-table [logs]="pagedLogs()" />
          } @else {
            <app-empty-state />
          }

          <!-- Pagination -->
          <app-pagination
            [total]="filteredLogs().length"
            [perPage]="perPage()"
            [currentPage]="currentPage()"
            (pageChange)="onPageChange($event)"
          />
        </div>
      </div>
    }
  </div>
</main>
