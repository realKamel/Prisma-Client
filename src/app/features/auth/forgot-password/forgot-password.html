<main class="flex min-h-screen items-center justify-center px-6 py-24">
  <div
    class="rounded-card relative z-10 w-full max-w-120 animate-[cardIn_600ms_var(--ease-out-custom)_both] border p-10"
    style="
      background: var(--color-surface);
      border-color: var(--color-border);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.27),
        0 0 0 1px rgba(var(--color-primary-rgb), 0.08);
    "
  >
    <!-- Top accent line -->
    <!-- <div
      class="absolute top-0 start-0 end-0 h-0.5 rounded-t-card opacity-70"
      style="
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-primary),
          var(--color-primary-light),
          transparent
        );
      "
    ></div> -->

    <!-- Success overlay -->
    <div
      class="bg-surface rounded-card absolute inset-0 z-10 flex flex-col items-center justify-center gap-5 p-8 transition-opacity duration-300"
      [class.opacity-0]="!showSuccess()"
      [class.opacity-100]="showSuccess()"
      [class.pointer-events-none]="!showSuccess()"
      [class.pointer-events-auto]="showSuccess()"
    >
      <!-- Success Icon (Green Check Circle) -->
      <div
        class="flex shrink-0 animate-[popIn_500ms_200ms_var(--ease-spring)_both] items-center justify-center rounded-full"
        style="
          width: 88px;
          height: 88px;
          background: rgba(78, 203, 141, 0.15);
          border: 1.5px solid rgba(78, 203, 141, 0.35);
        "
      >
        <svg
          width="44"
          height="44"
          fill="none"
          viewBox="0 0 24 24"
          stroke="#4ECB8D"
          stroke-width="1.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      </div>

      <div
        class="text-center text-2xl font-black tracking-tight"
        style="color: var(--color-ink)"
      >
        تم تغيير كلمة المرور!
      </div>

      <p class="text-muted text-center text-xs">دلوقتي تقدر تسجل دخولك بالكلمة الجديدة</p>

      <button
        class="fp-btn"
        style="max-width: 280px"
        (click)="goToLogin()"
      >
        سجّل دخولك دلوقتي
      </button>
    </div>

    <!-- Steps -->
    @if (currentStep() === 1) {
      <app-step-contact (submitted)="onContactSubmitted($event)" />
    }

    @if (currentStep() === 2) {
      <app-step-otp
        [contactValue]="contactValue()"
        (verified)="onOtpVerified()"
        (back)="onBackToContact()"
      />
    }

    @if (currentStep() === 3) {
      <app-step-new-password (saved)="onPasswordSaved()" />
    }
  </div>
</main>
