<section class="bg-main text-ink mx-auto w-full max-w-7xl px-0 py-0 sm:px-4 sm:py-5 md:px-8">
  <div
    class="border-border bg-surface sm:rounded-card flex h-[calc(100dvh-8.5rem)] min-h-112 flex-col overflow-hidden border-0 sm:h-[calc(100dvh-4.5rem)] sm:border sm:shadow-[0_18px_48px_rgba(0,0,0,0.18)] md:flex-row"
  >
    <!-- Conversation rail -->
    <aside
      [class]="isThreadOpen() ? 'hidden md:flex md:flex-col' : 'flex flex-1 flex-col'"
      class="border-border min-h-0 w-full md:w-84 md:shrink-0 md:border-e lg:w-92"
      [attr.aria-label]="'CHAT.TITLE' | translate"
    >
      <app-conversation-list
        class="min-h-0 flex-1"
        [conversations]="conversations()"
        [activeId]="activeConversationId()"
        [isLoading]="isLoadingConversations()"
        [hasLoaded]="hasLoadedConversations()"
        [totalUnread]="totalUnread()"
        (selectConversation)="selectConversation($event)"
        (composeConversation)="openNewChat()"
      />
    </aside>

    <!-- Thread -->
    <div
      class="min-h-0 flex-1"
      [class]="isThreadOpen() ? 'flex' : 'hidden md:flex'"
    >
      <app-chat-thread
        class="min-h-0 flex-1"
        [conversation]="activeConversation()"
        [items]="threadItems()"
        [isLoading]="isLoadingMessages()"
        [hasOlder]="hasOlderMessages()"
        [isLoadingOlder]="isLoadingOlder()"
        [typingNames]="typingNames()"
        [connectionState]="connectionState()"
        (back)="closeThread()"
        (loadOlder)="loadOlderMessages()"
        (messageSent)="sendMessage($event)"
        (typingChange)="onTyping($event)"
        (retryMessage)="retryMessage($event)"
        (reconnect)="reconnect()"
      />
    </div>
  </div>
</section>

@if (isNewChatOpen()) {
  <app-new-chat-dialog
    (dismiss)="closeNewChat()"
    (contactSelected)="startConversation($event)"
  />
}
