<section
  class="relative z-10 overflow-hidden px-6 py-32 text-center md:px-14"
  ngmMotion
  [initial]="{ opacity: 0 }"
  [whileInView]="{ opacity: 1 }"
  [viewport]="viewport"
  [transition]="entranceTransition"
>
  <!-- Glow effect using Primary Purple -->
  <div
    class="pointer-events-none absolute start-1/2 bottom-0 z-0 h-125 w-175 -translate-x-1/2 bg-[radial-gradient(ellipse,rgba(var(--color-primary-rgb),0.12)_0%,transparent_68%)]"
  ></div>

  <div class="pointer-events-none absolute inset-0 z-0 flex items-center justify-center">
    <div
      class="border-border absolute h-60 w-60 animate-[ping_4s_infinite] rounded-full border"
    ></div>
    <div
      class="border-border absolute h-104 w-104 animate-[ping_4.8s_infinite] rounded-full border"
    ></div>
    <div class="border-border absolute h-156 w-156 rounded-full border opacity-40"></div>
  </div>

  <div
    class="relative z-10 mx-auto max-w-2xl"
    ngmMotion
    [initial]="entranceInitial"
    [whileInView]="entranceVisible"
    [viewport]="viewport"
    [transition]="entranceTransition"
  >
    <h2 class="mb-6 text-4xl leading-tight font-black tracking-tight md:text-6xl">
      <!-- Gradient using Main Text -> Primary Light -> Primary -->
      <span
        class="from-ink via-primary-light to-primary bg-linear-to-b bg-clip-text text-transparent"
        >ابنك يستاهل<br />أكثر من كده <ng-icon icon="lucideRocket"></ng-icon
      ></span>
    </h2>

    <!-- <p class="text-sm md:text-base text-lavender mb-10 max-w-md mx-auto leading-relaxed">
      سجّل الآن وابدأ أول درس مجاناً — بدون أي التزام.
    </p> -->

    <div
      class="mx-auto flex max-w-sm flex-col items-stretch justify-center gap-4 sm:max-w-none sm:flex-row sm:items-center"
    >
      <!-- Primary Button (Purple) -->
      <a
        class="bg-primary rounded-full px-8 py-3.5 font-bold text-white shadow-[0_6px_28px_rgba(var(--color-primary-rgb),0.3)] transition-transform duration-150 hover:scale-105 active:scale-95"
        routerLink="/register"
        ngmMotion
        [whileHover]="{ scale: 1.05 }"
        [whileTap]="{ scale: 0.96 }"
        [transition]="entranceTransition"
      >
        سجّل ابنك مجاناً
      </a>

      <!-- Secondary Button (Outline) -->
      <button
        routerLink="/contact-us"
        class="text-ink hover:border-primary rounded-full border border-[rgba(var(--color-primary-rgb),0.3)] bg-transparent px-8 py-3.5 font-semibold transition-all hover:bg-[rgba(var(--color-primary-rgb),0.1)]"
        ngmMotion
        [whileHover]="{ scale: 1.03 }"
        [whileTap]="{ scale: 0.96 }"
        [transition]="entranceTransition"
      >
        عندك سؤال؟ كلّمنا
      </button>
    </div>
  </div>
</section>
