@if (hero(); as h) {
  <section
    class="relative z-10 flex min-h-[78dvh] flex-col items-center justify-center overflow-x-clip px-5 pt-10 pb-14 sm:px-8 sm:pt-14 md:pt-16"
  >
    <!-- Ambient glow. It straddles the bottom edge (overflow-x-clip only) so it fades into the next section instead of being cut. -->
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-x-0 -bottom-36 -z-10 h-[22rem] bg-[radial-gradient(ellipse_60%_50%_at_50%_50%,rgba(var(--color-primary-rgb),0.16),transparent_70%)]"
    ></div>

    <!-- Shooting stars: rare, under a second each, off when motion is reduced -->
    <span
      class="hero-shoot text-ink"
      style="--x: 80%; --y: 7%; --d: 11s; --dl: 2s"
      aria-hidden="true"
    ></span>
    <span
      class="hero-shoot text-ink"
      style="--x: 96%; --y: 34%; --d: 17s; --dl: 8s"
      aria-hidden="true"
    ></span>
    <span
      class="hero-shoot text-ink"
      style="--x: 58%; --y: 3%; --d: 14s; --dl: 11s"
      aria-hidden="true"
    ></span>

    <!-- Three zones: headline (start side), galaxy (center, equal side columns so it stays centered on the page; the layers overflow the narrow zone on purpose), subtitle + CTA (end side). Stacks in the same order below lg.
         The galaxy is bigger than its zone and sits in two absolutely positioned layers, so it adds no height:
         back layer (z-0) with the rings, front layer with the planets (z-[5]); both sit under the text columns (z-10). -->
    <div
      #stage
      class="relative mx-auto grid w-full max-w-[1240px] items-center gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,340px)_minmax(0,1fr)] lg:gap-6 xl:grid-cols-[minmax(0,1fr)_minmax(0,400px)_minmax(0,1fr)]"
    >
      <div class="relative z-10 text-center lg:text-start">
        <!-- Scrim: a soft shadow in the page background color, so planets, rings and glow fade out under the words -->
        <div
          aria-hidden="true"
          class="hero-scrim pointer-events-none absolute -inset-x-10 -inset-y-12 -z-10"
        ></div>
        <h1
          class="text-ink text-[clamp(40px,9.6vw,58px)] leading-[1.3] font-black lg:text-[clamp(42px,4.4vw,66px)]"
          ngmMotion
          [initial]="blurInitial"
          [animate]="blurAnimate"
          [transition]="headlineTransition"
        >
          <!-- Two lines: the brand word alone on line 1 (bigger size from the h1), the rest on line 2 at the original, smaller size. Neither line wraps. -->
          <span class="block whitespace-nowrap text-(--accent-text)">{{ headline().brand }}</span>
          <span
            class="block text-[clamp(36px,8.8vw,54px)] whitespace-nowrap lg:text-[clamp(38px,4vw,58px)]"
            >{{ headline().rest }}</span
          >
        </h1>
      </div>

      <!-- Galaxy zone: only reserves height; the layers inside overflow it on purpose -->
      <div class="relative h-[300px] sm:h-[380px] lg:h-[400px] xl:h-[440px]">
        <div
          aria-hidden="true"
          class="pointer-events-none absolute top-1/2 left-1/2 z-0 aspect-[1100/700] w-[220vw] -translate-1/2 sm:w-[880px] lg:w-[1000px] xl:w-[1100px]"
          ngmMotion
          [initial]="blurInitial"
          [animate]="blurAnimate"
          [transition]="orbitTransition"
        >
          <div
            class="absolute inset-[8%] rounded-full bg-[radial-gradient(circle,rgba(var(--color-primary-rgb),0.2),transparent_68%)]"
          ></div>
          <div
            class="absolute top-1/2 left-1/2 h-[44%] w-[46%] -translate-1/2 bg-[radial-gradient(closest-side,color-mix(in_srgb,var(--star)_16%,transparent),transparent)]"
          ></div>

          <svg
            viewBox="0 0 1100 700"
            class="absolute inset-0 size-full overflow-visible"
          >
            <!-- Tilted rings, drawn in the ink color: darker lines on the light theme, brighter ones on the dark theme. rx/ry are set by hero.ts (they shrink on narrow screens); the tilt must match TILT there. -->
            <g
              transform="translate(550 350) rotate(-14)"
              class="text-ink fill-none stroke-current"
            >
              <ellipse
                data-ring
                rx="520"
                ry="190"
                class="opacity-[.4] [stroke-dasharray:3_9]"
              />
              <ellipse
                data-ring
                rx="360"
                ry="130"
                class="opacity-[.3]"
              />
            </g>

            <!-- The brand name as a constellation: وصلة, traced from the letterforms. Draws itself once, in reading order. -->
            <g
              transform="translate(550 350) rotate(-14)"
              class="text-(--star)"
            >
              @for (l of constellation.lines; track l.d) {
                <path
                  class="const-line fill-none stroke-current opacity-70"
                  stroke-width="1.8"
                  pathLength="1"
                  [attr.d]="l.d"
                  [style.--i]="l.i"
                />
              }
              @for (s of constellation.stars; track $index) {
                <circle
                  class="const-star fill-current"
                  [attr.cx]="s.x"
                  [attr.cy]="s.y"
                  [attr.r]="s.r"
                  [style.--i]="s.i"
                />
              }
            </g>
          </svg>
        </div>

        <!-- Planets: quiet glowing dots. Hover, focus or tap one to open its card. This layer sits below the text columns
             (z-[5] against their z-10), so planets travel under the headline and buttons; hero.ts lifts it only for keyboard focus. -->
        <div
          data-front
          role="group"
          [attr.aria-label]="stageLabel"
          class="text-ink pointer-events-none absolute top-1/2 left-1/2 z-[5] aspect-[1100/700] w-[220vw] -translate-1/2 sm:w-[880px] lg:w-[1000px] xl:w-[1100px]"
          ngmMotion
          [initial]="blurInitial"
          [animate]="blurAnimate"
          [transition]="orbitTransition"
        >
          @for (p of planets; track p.kind) {
            <div
              data-planet
              class="orbit-planet absolute top-0 left-0 will-change-transform"
            >
              <button
                data-dot
                type="button"
                [attr.aria-label]="p.label"
                class="orbit-dot border-ink/25 bg-surface text-ink pointer-events-auto absolute top-0 left-0 grid size-9 -translate-1/2 cursor-pointer place-items-center rounded-full border"
              >
                <ng-icon
                  [name]="p.icon"
                  class="text-sm"
                ></ng-icon>
              </button>

              <div
                aria-hidden="true"
                class="orbit-card bg-surface/80 border-border text-start"
              >
                <div class="flex items-center gap-2">
                  <span
                    class="grid size-6 shrink-0 place-items-center rounded-md bg-(--accent)/15 text-xs text-(--accent)"
                  >
                    <ng-icon [name]="p.icon"></ng-icon>
                  </span>
                  <b class="text-ink text-xs font-bold">{{ p.label }}</b>
                </div>

                @switch (p.kind) {
                  @case ('lecture') {
                    <div class="bg-ink/15 rounded-pill mt-3 h-1">
                      <i class="oc-fill rounded-pill block h-full w-[62%] bg-(--accent)"></i>
                    </div>
                  }
                  @case ('quiz') {
                    <div class="mt-3 grid gap-1.5">
                      <div class="flex items-center gap-2">
                        <span class="border-ink/30 size-3.5 rounded-full border"></span>
                        <i class="bg-ink/10 h-1.5 w-2/3 rounded-sm"></i>
                      </div>
                      <div class="flex items-center gap-2">
                        <span
                          class="bg-mint/15 text-mint grid size-3.5 place-items-center rounded-full text-[8px]"
                        >
                          <ng-icon
                            name="bootstrapCheckLg"
                            class="oc-tick"
                          ></ng-icon>
                        </span>
                        <i class="bg-ink/10 h-1.5 w-1/2 rounded-sm"></i>
                      </div>
                    </div>
                  }
                  @case ('parent') {
                    <p class="oc-slide text-muted mt-2.5 text-xs">تم إرسال تقدّم اليوم</p>
                  }
                }
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Subtitle + CTA column: everything is centered in the column (text and button) -->
      <div
        class="relative z-10 flex flex-col items-center gap-6 text-center lg:w-[min(22rem,100%)] lg:items-center lg:justify-self-end lg:text-center"
      >
        <div
          aria-hidden="true"
          class="hero-scrim pointer-events-none absolute -inset-x-10 -inset-y-12 -z-10"
        ></div>

        <p
          class="text-ink-subtle w-full max-w-[34rem] text-center text-[clamp(18px,2.3vw,23px)] leading-[1.9] font-light text-balance"
          ngmMotion
          [initial]="blurInitial"
          [animate]="blurAnimate"
          [transition]="subtitleTransition"
        >
          {{ h.subtitle }}
        </p>

        <div class="flex flex-col items-center gap-4 lg:items-center">
          <div
            class="flex w-full flex-col items-center justify-center gap-3 sm:w-auto sm:flex-row lg:flex-col lg:items-center"
            ngmMotion
            [initial]="blurInitial"
            [animate]="blurAnimate"
            [transition]="ctaTransition"
          >
            <!-- Two stars slide in from the sides, merge in the middle of the button and bloom into a soft light (hover or focus) -->
            <span class="hero-cta group/cta relative inline-flex w-full sm:w-auto">
              <span
                aria-hidden="true"
                class="hero-cta-star hero-cta-star-a bg-white max-sm:hidden"
              ></span>
              <span
                aria-hidden="true"
                class="hero-cta-star hero-cta-star-b bg-white max-sm:hidden"
              ></span>
              <a
                class="rounded-pill relative isolate inline-flex w-full items-center justify-center overflow-hidden bg-(--accent) px-8 py-3.5 text-base font-extrabold whitespace-nowrap text-(--on-accent) shadow-[0_10px_30px_-12px_color-mix(in_srgb,var(--accent)_90%,transparent)] transition-shadow duration-300 hover:shadow-[0_16px_38px_-12px_var(--accent)] sm:w-auto"
                routerLink="/register"
                ngmMotion
                [whileHover]="{ scale: 1.03 }"
                [whileTap]="{ scale: 0.97 }"
              >
                <span
                  aria-hidden="true"
                  class="pointer-events-none absolute inset-0 scale-50 bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.4),transparent_62%)] opacity-0 transition-[opacity,scale] duration-500 group-focus-within/cta:scale-100 group-focus-within/cta:opacity-100 group-focus-within/cta:delay-[850ms] group-hover/cta:scale-100 group-hover/cta:opacity-100 group-hover/cta:delay-[850ms]"
                ></span>
                <span class="relative z-10">{{ h.ctaPrimary }}</span>
              </a>
            </span>
          </div>

          <!--
            TODO(real data): once there are real numbers (active students, lessons, teachers),
            add ONE honest stat line here under the microcopy. Do not ship invented stats.
          -->
        </div>
      </div>
    </div>
  </section>
}
