@if (hero(); as h) {
  <section
    class="relative z-10 px-6 py-8 md:px-14 md:py-8 overflow-hidden min-h-[calc(100dvh-64px)] flex items-center"
  >
    <!-- Blob -->
    <div
      class="blob-hero absolute -top-20 left-0 w-160 height-[640px] pointer-events-none z-0 bg-[radial-gradient(ellipse_55%_50%_at_35%_40%,rgba(var(--accent-rgb),0.32)_0%,transparent_70%)] animate-[blobFloat_8s_ease-in-out_infinite]"
    ></div>

    <div
      class="relative z-10 w-full max-w-300 mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-16 items-center"
    >
      <!-- ── Right/Bottom: Content ── -->
      <div class="flex flex-col items-start order-last md:order-0">
        <!-- Tag -->
        <div
          class="inline-flex items-center gap-2 bg-transparent border-none rounded-full px-4 py-2 mb-6 text-xs text-[var(--lavender)] font-[var(--mono)] tracking-wider animate-[tagIn_600ms_100ms_var(--ease-out)_both]"
        >
          <span class="w-2 h-2 rounded-full bg-[var(--mint)] animate-[pulse_2s_infinite]"></span>
          {{ h.tag }}
        </div>

        <!-- Title -->
        <h1
          class="text-right text-[clamp(40px,4.5vw,64px)] font-black leading-normal tracking-[-2px] mb-6 w-full"
        >
          <span class="text-[var(--ink)] block animate-[slideUp_700ms_200ms_var(--ease-out)_both]">
            {{ h.title.split(' ').slice(0, 2).join(' ') }}
          </span>
          <span
            class="block bg-gradient-to-br from-[var(--purple-lt)] via-[var(--purple)] to-[var(--lavender)] bg-clip-text text-transparent animate-[slideUp_700ms_360ms_var(--ease-out)_both]"
          >
            {{ h.title.split(' ').slice(2).join(' ') }}
            <svg
              class="w-[70px] h-[70px] text-[var(--ink)] inline-block align-middle ms-1.5 animate-[pulse_2s_infinite]"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                d="M15 2L15.5387 4.39157C15.9957 6.42015 17.5798 8.00431 19.6084 8.46127L22 9L19.6084 9.53873C17.5798 9.99569 15.9957 11.5798 15.5387 13.6084L15 16L14.4613 13.6084C14.0043 11.5798 12.4202 9.99569 10.3916 9.53873L8 9L10.3916 8.46127C12.4201 8.00431 14.0043 6.42015 14.4613 4.39158L15 2Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <path
                d="M7 12L7.38481 13.7083C7.71121 15.1572 8.84275 16.2888 10.2917 16.6152L12 17L10.2917 17.3848C8.84275 17.7112 7.71121 18.8427 7.38481 20.2917L7 22L6.61519 20.2917C6.28879 18.8427 5.15725 17.7112 3.70827 17.3848L2 17L3.70827 16.6152C5.15725 16.2888 6.28879 15.1573 6.61519 13.7083L7 12Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </h1>

        <!-- Subtitle -->
        <p
          class="text-[16px] font-normal text-[var(--muted)] max-w-[440px] mb-8 leading-[1.75] text-right animate-[slideUp_600ms_520ms_var(--ease-out)_both]"
        >
          {{ h.subtitle }}
        </p>

        <!-- CTAs -->
        <div class="flex gap-3 animate-[slideUp_550ms_680ms_var(--ease-out)_both]">
          <button
            class="relative overflow-hidden bg-[var(--purple)] text-white border-none rounded-full px-8 py-3 text-[16px] leading-normal font-bold font-[var(--font)] cursor-pointer shadow-[0_6px_28px_var(--purple-glow)] transition-all duration-280 hover:scale-104 hover:shadow-[0_10px_40px_rgba(var(--accent-rgb),0.51)] active:scale-[0.97] after:content-[''] after:absolute after:top-0 after:-right-[110%] after:bottom-0 after:w-1/2 after:bg-gradient-to-r after:from-transparent after:via-white/20 after:to-transparent after:transition-[right] after:duration-500 after:ease-out hover:after:right-[120%]"
            [routerLink]="'/register'"
          >
            {{ h.ctaPrimary }}
          </button>

          <button
            class="bg-transparent text-[var(--lavender)] border border-[rgba(var(--accent-rgb),0.4)] rounded-full px-7 py-3 text-[16px] leading-normal font-semibold font-[var(--font)] cursor-pointer transition-all duration-250 hover:bg-[rgba(var(--accent-rgb),0.22)] hover:border-[rgba(var(--accent-rgb),0.7)] hover:scale-102"
            [routerLink]="'/lessons'"
          >
            {{ h.ctaSecondary }}
          </button>
        </div>
      </div>

      <!-- ── Left/Top: Visual ── -->
      <div class="flex justify-center items-center relative order-first md:order-none">
        <div
          class="relative flex justify-center items-center w-full animate-[slideUp_700ms_300ms_var(--ease-out)_both]"
        >
          <!-- Teacher Image -->
          <img
            class="w-full max-w-[260px] md:max-w-[360px] object-contain drop-shadow-[0_16px_40px_var(--purple-glow)] animate-[mascotBob_3.5s_ease-in-out_infinite]"
            [src]="h.teacherImage"
            alt="صورة المدرس"
          />

          <!-- Floating Badges -->
          <div class="absolute inset-0 pointer-events-none">
            @for (badge of h.badges; track badge.text; let i = $index) {
              <div
                class="absolute bg-[var(--surface2)] border border-[rgba(var(--accent-rgb),0.35)] rounded-2xl px-4 py-2 flex items-center gap-2 text-xs font-bold text-[var(--ink2)] shadow-[0_8px_24px_rgba(0,0,0,0.3)] whitespace-nowrap"
                [class]="'fb' + (i + 1)"
              >
                <ng-icon class="text-base text-[var(--purple-lt)]" [name]="badge.icon"></ng-icon>
                {{ badge.text }}
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </section>
}
