@if (hero(); as h) {
  <section
    class="relative z-10 flex min-h-[calc(100dvh-64px)] items-center overflow-hidden px-6 py-8 md:px-14 md:py-8"
  >
    <!-- Blob -->
    <div
      class="blob-hero height-[640px] pointer-events-none absolute start-0 -top-20 z-0 w-160 bg-[radial-gradient(ellipse_55%_50%_at_35%_40%,rgba(var(--color-primary-rgb),0.32)_0%,transparent_70%)]"
      ngmMotion
      [initial]="{ scale: 1, opacity: 1 }"
      [whileInView]="{ scale: [1, 1.06, 1], opacity: [1, 0.7, 1] }"
      [transition]="ambientTransition"
    ></div>

    <div
      class="relative z-10 mx-auto grid w-full max-w-300 grid-cols-1 items-center gap-12 md:grid-cols-2 md:gap-16"
    >
      <!-- ── Right/Bottom: Content ── -->
      <div class="order-last flex flex-col items-start md:order-0">
        <!-- Tag -->
        <div
          class="font-cairo text-ink-subtle mb-6 inline-flex items-center gap-2 rounded-full border-none bg-transparent px-4 py-2 text-xs tracking-wider"
          ngmMotion
          [initial]="{ opacity: 0, y: 10, scale: 0.95 }"
          [animate]="{ opacity: 1, y: 0, scale: 1 }"
          [transition]="{ ...entranceTransition, delay: 0.1 }"
        >
          <span
            class="bg-mint h-2 w-2 rounded-full"
            ngmMotion
            [initial]="{ opacity: 1, scale: 1 }"
            [whileInView]="{ opacity: [1, 0.3, 1], scale: [1, 0.6, 1] }"
            [transition]="pulseTransition"
          ></span>
          {{ h.tag }}
        </div>

        <!-- Title -->
        <h1
          class="mb-6 w-full text-end text-[clamp(40px,4.5vw,64px)] leading-normal font-black tracking-[-2px]"
        >
          <span
            class="text-ink block"
            ngmMotion
            [initial]="entranceInitial"
            [animate]="{ opacity: 1, y: 0 }"
            [transition]="{ ...entranceTransition, delay: 0.2 }"
          >
            {{ h.title.split(' ').slice(0, 2).join(' ') }}
          </span>
          <span
            class="from-ink via-primary-light to-primary block bg-linear-to-br bg-clip-text text-transparent"
            ngmMotion
            [initial]="entranceInitial"
            [animate]="{ opacity: 1, y: 0 }"
            [transition]="{ ...entranceTransition, delay: 0.36 }"
          >
            {{ h.title.split(' ').slice(2).join(' ') }}
            <svg
              class="text-ink ms-1.5 inline-block h-17.5 w-17.5 align-middle"
              aria-hidden="true"
              viewBox="0 0 24 24"
              fill="none"
              ngmMotion
              [initial]="{ opacity: 1, scale: 1 }"
              [whileInView]="{ opacity: [1, 0.3, 1], scale: [1, 0.6, 1] }"
              [transition]="pulseTransition"
            >
              <path
                d="M15 2L15.5387 4.39157C15.9957 6.42015 17.5798 8.00431 19.6084 8.46127L22 9L19.6084 9.53873C17.5798 9.99569 15.9957 11.5798 15.5387 13.6084L15 16L14.4613 13.6084C14.0043 11.5798 12.4202 9.99569 10.3916 9.53873L8 9L10.3916 8.46127C12.4201 8.00431 14.0043 6.42015 14.4613 4.39158L15 2Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <path
                d="M7 12L7.38481 13.7083C7.71121 15.1572 8.84275 16.2888 10.2917 16.6152L12 17L10.2917 17.3848C8.84275 17.7112 7.71121 18.8427 7.38481 20.2917L7 22L6.61519 20.2917C6.28879 18.8427 5.15725 17.7112 3.70827 17.3848L2 17L3.70827 16.6152C5.15725 16.2888 6.28879 15.1573 6.61519 13.7083L7 12Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
          </span>
        </h1>

        <!-- Subtitle -->
        <p
          class="text-ink-subtle mb-8 max-w-110 text-end text-base leading-[1.75] font-normal"
          ngmMotion
          [initial]="entranceInitial"
          [animate]="{ opacity: 1, y: 0 }"
          [transition]="{ ...entranceTransition, delay: 0.52 }"
        >
          {{ h.subtitle }}
        </p>

        <!-- CTAs -->
        <div
          class="flex gap-3"
          ngmMotion
          [initial]="entranceInitial"
          [animate]="{ opacity: 1, y: 0 }"
          [transition]="{ ...entranceTransition, delay: 0.68 }"
        >
          <button
            class="bg-primary relative cursor-pointer overflow-hidden rounded-full border-none px-8 py-3 text-base leading-normal font-bold text-white shadow-[0_6px_28px_var(--color-primary-glow)] transition-all duration-280 after:absolute after:-end-[110%] after:top-0 after:bottom-0 after:w-1/2 after:bg-gradient-to-r after:from-transparent after:via-white/20 after:to-transparent after:transition-[right] after:duration-500 after:ease-out after:content-[''] hover:scale-104 hover:shadow-[0_10px_40px_rgba(var(--color-primary-rgb),0.51)] hover:after:end-[120%] active:scale-[0.97]"
            [routerLink]="'/register'"
            ngmMotion
            [whileHover]="{ scale: 1.04 }"
            [whileTap]="{ scale: 0.97 }"
          >
            {{ h.ctaPrimary }}
          </button>

          <button
            class="text-ink font-font cursor-pointer rounded-full border border-[rgba(var(--color-primary-rgb),0.4)] bg-transparent px-7 py-3 text-base leading-normal transition-all duration-250 hover:scale-102 hover:border-[rgba(var(--color-primary-rgb),0.7)] hover:bg-[rgba(var(--color-primary-rgb),0.22)]"
            [routerLink]="'/lessons'"
            ngmMotion
            [whileHover]="{ scale: 1.02 }"
            [whileTap]="{ scale: 0.97 }"
          >
            {{ h.ctaSecondary }}
          </button>
        </div>
      </div>

      <!-- ── Left/Top: Visual ── -->
      <div class="relative order-first flex items-center justify-center md:order-0">
        <div
          class="relative flex w-full items-center justify-center"
          ngmMotion
          [initial]="entranceInitial"
          [animate]="{ opacity: 1, y: 0 }"
          [transition]="{ ...entranceTransition, delay: 0.3 }"
        >
          <!-- Teacher Image -->
          <img
            class="w-full max-w-65 object-contain drop-shadow-[0_16px_40px_var(--color-primary-glow)] md:max-w-90"
            [src]="h.teacherImage"
            alt="صورة المدرس"
            ngmMotion
            [initial]="{ y: 0 }"
            [whileInView]="{ y: [0, -16, 0] }"
            [transition]="{ duration: 3.5, ease: 'easeInOut', repeat: infiniteRepeat }"
          />

          <!-- Floating Badges -->
          <div class="pointer-events-none absolute inset-0">
            @for (badge of h.badges; track badge.text; let i = $index) {
              <div
                class="bg-surface-subtle text-ink-subtle absolute flex items-center gap-2 rounded-2xl border border-[rgba(var(--color-primary-rgb),0.35)] px-4 py-2 text-xs font-bold whitespace-nowrap shadow-[0_8px_24px_rgba(0,0,0,0.3)]"
                [class]="'fb' + (i + 1)"
                ngmMotion
                [initial]="{ y: 0, rotate: i % 2 === 0 ? -2 : 1 }"
                [whileInView]="
                  i % 2 === 0
                    ? { y: [0, -8, 0], rotate: [-2, 1, -2] }
                    : { y: [0, -10, 0], rotate: [1, -2, 1] }
                "
                [transition]="{
                  duration: 3.8 + i * 0.2,
                  delay: i * 0.2,
                  ease: 'easeInOut',
                  repeat: infiniteRepeat,
                }"
              >
                <ng-icon
                  class="text-primary-light text-base"
                  [name]="badge.icon"
                ></ng-icon>
                {{ badge.text }}
              </div>
            }
          </div>
        </div>
      </div>
    </div>
  </section>
}
