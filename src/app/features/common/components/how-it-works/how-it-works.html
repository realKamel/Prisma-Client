<section
  id="how"
  class="bg-surface border-border relative z-10 border-y px-6 py-24 backdrop-blur-sm md:px-14"
>
  <div class="mx-auto max-w-7xl">
    <div class="mb-20 text-center">
      <span class="text-primary-light mb-4 block text-sm font-bold">خطوات بسيطة </span>
      <h2 class="text-ink text-3xl font-black tracking-tight md:text-5xl">
        ابدأ في أقل من دقيقتين
      </h2>
    </div>

    <div class="relative grid grid-cols-1 gap-8 md:grid-cols-2 lg:grid-cols-4 lg:gap-8">
      <div
        class="via-primary pointer-events-none absolute start-[12.5%] end-[12.5%] top-9 hidden h-0.5 bg-linear-to-r from-transparent to-transparent lg:block"
      ></div>

      @for (step of steps; track step) {
        <div class="group px-4 text-center">
          <div
            class="bg-surface-subtle group-hover:border-primary relative mx-auto mb-6 flex h-18 w-18 items-center justify-center rounded-full border-2 border-[--border] text-3xl transition-all duration-200 group-hover:scale-115 group-hover:-rotate-6 group-hover:[box-shadow:0_0_32px_color-mix(in_srgb,var(--color-primary)_30%,transparent)]"
          >
            <span
              class="bg-primary absolute -start-1.5 -top-1.5 flex h-6 w-6 items-center justify-center rounded-full font-sans text-xs font-black text-white shadow-md"
              >{{ step.num }}</span
            >
            <span>
              <ng-icon [name]="step.emoji"></ng-icon>
            </span>
          </div>
          <h3 class="text-ink mb-2 text-base font-bold">{{ step.title }}</h3>
          <p class="text-ink-subtle mx-auto max-w-50 text-xs leading-relaxed">
            {{ step.desc }}
          </p>
        </div>
      }
    </div>
  </div>
</section>
