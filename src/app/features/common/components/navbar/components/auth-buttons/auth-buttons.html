<div class="flex items-center gap-2">
  <button
    [routerLink]="'/login'"
    (click)="isSideBarOpen.set(false)"
    ngmMotion
    [initial]="entranceInitial"
    [animate]="entranceAnimate"
    [whileHover]="{ scale: 1.04 }"
    [whileTap]="{ scale: 0.96, transition: tapTransition }"
    [transition]="{ ...entranceTransition, delay: 0.04 }"
    class="inline-flex items-center justify-center h-10 px-5 whitespace-nowrap rounded-full border border-border text-[12px] font-semibold text-ink transition-colors duration-200 hover:bg-border-focus/45 hover:border-border/75"
  >
    {{ 'NAVBAR.LOGIN' | translate }}
  </button>
  <button
    [routerLink]="'/register'"
    (click)="isSideBarOpen.set(false)"
    ngmMotion
    [initial]="entranceInitial"
    [animate]="entranceAnimate"
    [whileHover]="{ scale: 1.04 }"
    [whileTap]="{ scale: 0.96, transition: tapTransition }"
    [transition]="{ ...entranceTransition, delay: 0.1 }"
    class="inline-flex items-center justify-center h-10 px-5 whitespace-nowrap rounded-full bg-primary text-white text-[12px] font-bold shadow-[0_4px_20px_var(--color-primary-glow)] transition-shadow duration-200 hover:shadow-[0_6px_28px_var(--color-primary-glow)]"
  >
    {{ 'NAVBAR.REGISTER' | translate }}
  </button>
</div>
