<div class="flex items-center gap-2">
  <button
    [routerLink]="'/login'"
    (click)="isSideBarOpen.set(false)"
    ngmMotion
    [initial]="entranceInitial"
    [animate]="entranceAnimate"
    [whileHover]="{ scale: 1.04 }"
    [whileTap]="{ scale: 0.96, transition: tapTransition }"
    [transition]="{ ...entranceTransition, delay: 0.04 }"
    class="border-border text-ink hover:bg-border-focus/45 hover:border-border/75 inline-flex h-10 items-center justify-center rounded-full border px-5 text-xs font-semibold whitespace-nowrap transition-colors duration-200"
  >
    {{ 'NAVBAR.LOGIN' | translate }}
  </button>
  <button
    [routerLink]="'/register'"
    (click)="isSideBarOpen.set(false)"
    ngmMotion
    [initial]="entranceInitial"
    [animate]="entranceAnimate"
    [whileHover]="{ scale: 1.04 }"
    [whileTap]="{ scale: 0.96, transition: tapTransition }"
    [transition]="{ ...entranceTransition, delay: 0.1 }"
    class="bg-primary inline-flex h-10 items-center justify-center rounded-full px-5 text-xs font-bold whitespace-nowrap text-white shadow-[0_4px_20px_var(--color-primary-glow)] transition-shadow duration-200 hover:shadow-[0_6px_28px_var(--color-primary-glow)]"
  >
    {{ 'NAVBAR.REGISTER' | translate }}
  </button>
</div>
