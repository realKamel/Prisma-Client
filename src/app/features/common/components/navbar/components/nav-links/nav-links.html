<div class="flex flex-col md:flex-row gap-2 md:gap-4 items-stretch md:items-center w-full">
  @for (link of links(); track link.path) {
    <a
      [routerLink]="link.path"
      [fragment]="link.fragment"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true, matrixParams: 'exact', fragment: 'exact' }"
      (click)="isSideBarOpen.set(false)"
      class="nav-link flex items-center gap-3 md:gap-2 w-full md:w-auto text-xs font-semibold no-underline px-4 py-2.5 md:px-4 md:py-2 rounded-xl md:rounded-full transition-colors duration-200"
    >
      <ng-icon [name]="link.icon" class="text-lg md:text-xs shrink-0" />
      <span>{{ link.labelKey | translate }}</span>
    </a>
  }
</div>
