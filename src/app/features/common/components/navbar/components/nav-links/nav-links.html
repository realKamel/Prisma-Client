<div class="flex w-full flex-col items-stretch gap-2 md:flex-row md:items-center md:gap-4">
  @for (link of links(); track link.path) {
    <a
      [routerLink]="link.path"
      [fragment]="link.fragment"
      routerLinkActive="bg-border-focus"
      [routerLinkActiveOptions]="{ exact: true, matrixParams: 'exact', fragment: 'exact' }"
      (click)="isSideBarOpen.set(false)"
      class="nav-link text-ink hover:bg-surface flex w-full items-center gap-3 rounded-xl px-4 py-2.5 text-xs font-semibold no-underline transition-colors duration-200 md:w-auto md:gap-2 md:rounded-full md:px-4 md:py-2"
    >
      <ng-icon
        [name]="link.icon"
        class="shrink-0 text-lg md:text-xs"
      />
      <span>{{ link.labelKey | translate }}</span>
    </a>
  }
</div>
