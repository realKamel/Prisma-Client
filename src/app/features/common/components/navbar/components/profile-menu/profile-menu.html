@if (!isSidebar()) {
  <div class="relative">
    <!-- Avatar Button -->
    <button
      class="avatar-btn avatar-btn flex items-center gap-2 ps-2 px-3 py-1.5 rounded-full border border-(--border) cursor-pointer"
      (click)="toggleDropdown()"
    >
      <span
        class="flex items-center justify-center w-7 h-7 rounded-full bg-(--purple) text-white text-[13px] font-bold"
      >
        {{ initial() }}
      </span>

      <span class="text-[13px] font-semibold text-(--ink)">
        {{ name() }}
      </span>
      <svg
        class="chevron text-(--muted)"
        [class.open]="isOpen()"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    <!-- Dropdown -->
    @if (isOpen()) {
      <div
        class="profile-dropdown absolute top-[calc(100%+12px)] inset-e-0.5 w-60 overflow-hidden rounded-2xl border border-(--border) bg-(--surface) p-3 shadow-[0_16px_48px_rgba(0,0,0,0.24)] z-100 animate-[fadeSlideUp_200ms_var(--ease-out)_forwards]"
      >
        <!-- Links -->
        @for (link of links(); track link.path) {
          <a
            class="profile-link flex items-center gap-2.5 px-5 py-2.5 text-[13px] font-semibold no-underline text-(--ink2)"
            [routerLink]="link.path"
            (click)="isOpen.set(false)"
          >
            <ng-icon class="fbadge-icon" [name]="link.icon"></ng-icon>
            {{ link.labelKey | translate }}
          </a>
        }

        <div class="divider"></div>

        <!-- Logout -->
        <button
          (click)="logout()"
          class="flex items-center gap-2.5 w-full px-5 py-3 border-0 bg-transparent text-[13px] font-semibold text-(--coral) cursor-pointer transition-colors duration-200 hover:bg-[rgba(240,106,106,0.1)]"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          {{ 'NAVBAR.LOGOUT' | translate }}
        </button>
      </div>
    }
  </div>
} @else {
  <div class="overflow-hidden rounded-2xl border border-(--border)">
    <!-- Header -->
    <button
      class="accordion-header flex items-center justify-between w-full px-4 py-3"
      (click)="toggleAccordion()"
      [class.open]="isExpanded()"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex items-center justify-center w-10 h-10 rounded-full bg-(--purple) text-white font-bold"
        >
          {{ initial() }}
        </div>

        <div class="text-start">
          <p class="text-sm font-bold text-(--ink)">
            {{ name() }}
          </p>

          <p class="text-xs text-(-uted)">
            {{ email() }}
          </p>
        </div>
      </div>

      <ng-icon
        name="bootstrapChevronDown"
        class="transition-transform duration-300"
        [class.rotate-180]="isExpanded()"
      >
      </ng-icon>
    </button>

    <div class="accordion-content" [class.open]="isExpanded()">
      <div class="border-t border-(--border)">
        @for (link of links(); track link.path) {
          <a
            [routerLink]="link.path"
            (click)="isExpanded.set(false)"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium text-(--ink2) hover:bg-(--surface2) hover:text-(--ink) transition-colors"
          >
            <ng-icon class="w-5 text-center" [name]="link.icon"></ng-icon>

            {{ link.labelKey | translate }}
          </a>
        }

        <div class="h-px bg-(--border) mx-4"></div>

        <button
          (click)="logout()"
          class="flex items-center gap-3 w-full px-4 py-3 text-sm font-medium text-(--coral) hover:bg-[rgba(240,106,106,0.1)] transition-colors"
        >
          <ng-icon name="lucideCircleArrowOutUpRight"></ng-icon>
          {{ 'NAVBAR.LOGOUT' | translate }}
        </button>
      </div>
    </div>
  </div>
}
