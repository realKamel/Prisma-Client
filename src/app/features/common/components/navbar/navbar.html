<!-- <header class="navbar" [class.scrolled]="isScrolled()"> -->
<header
  class="navbar fixed top-0 z-200 flex items-center justify-between h-16 px-4 md:px-8 lg:px-14 bg-(--nav-bg) border-b border-(--border) backdrop-blur-[20px]"
  [class.inset-x-0]="true"
>
  <!-- Logo -->
  <app-nav-logo />

  <!-- Desktop Links -->
  <nav class="hidden md:flex flex-1 justify-center">
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </nav>

  <!-- Desktop Actions -->
  <div class="flex items-center gap-2">
    <!-- <button
      (click)="langService.toggle()"
      class="flex items-center justify-center w-9 h-9 rounded-xl border border-(--border) bg-transparent text-(--ink2) text-sm font-black cursor-pointer transition-all duration-200 hover:bg-[rgba(96,81,155,0.14)] hover:text-(--ink)"
      [attr.aria-label]="langToggleAria()"
    >
      {{ langToggleText() }}
    </button> -->
    <app-theme-toggle />

    @if (isLoggedIn()) {
      <div class="hidden md:block">
        <app-profile-menu [name]?="userName()" [email]?="userEmail()" />
      </div>
    } @else {
      <div class="hidden md:block">
        <app-auth-buttons />
      </div>
    }

    <!-- Hamburger — mobile only -->
    <button
      class="hamburger md:hidden flex items-center justify-center gap-1.25 w-10 h-10 p-2.5 rounded-[10px] border border-(--border) bg-transparent cursor-pointer"
      (click)="toggleSidebar()"
      attr.aria-label="{{ menuLabel() }}"
    >
      <ng-icon
        name="bootstrapListUl"
        class="text-2xl flex justify-center items-center"
        [class.open]="isSidebarOpen()"
      >
      </ng-icon>
    </button>
  </div>
</header>

<!-- Overlay -->
@if (isSidebarOpen()) {
  <div
    class="sidebar-overlay fixed inset-0 z-60 bg-black/50 backdrop-blur-xs"
    (click)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
    role="button"
    tabindex="0"
  ></div>
}

<!-- Sidebar -->
<aside
  class="sidebar fixed top-16 w-70 h-[calc(100dvh-64px)] z-70 flex flex-col gap-6 p-6 bg-(--surface) border-(--border)"
  [class.right-0]="langService.lang() === 'ar'"
  [class.left-0]="langService.lang() === 'en'"
  [class.border-l]="langService.lang() === 'ar'"
  [class.border-r]="langService.lang() === 'en'"
  [class.translate-x-0]="isSidebarOpen()"
  [class.translate-x-full]="!isSidebarOpen() && langService.lang() === 'ar'"
  [class.-translate-x-full]="!isSidebarOpen() && langService.lang() === 'en'"
>
  <div class="flex items-center justify-between">
    <app-nav-logo />
    <button
      (click)="closeSidebar()"
      attr.aria-label="{{ closeLabel() }}"
      class="flex items-center justify-center w-9 h-9 rounded-full border border-(--border) bg-transparent text-(--ink2) cursor-pointer transition-colors duration-200 hover:bg-[rgba(96,81,155,0.14)] hover:text-(--ink)"
    >
      <ng-icon name="lucideX"></ng-icon>
    </button>
  </div>

  <div class="flex-1 overflow-y-auto">
    <app-nav-links [(isSideBarOpen)]="isSidebarOpen" [isLoggedIn]="isLoggedIn()" />
  </div>

  <div class="flex flex-col gap-2 pt-4 border-t border-(--border)">
    <!-- <button
      (click)="langService.toggle()"
      class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl border border-(--border) bg-transparent text-(--ink2) text-sm font-semibold cursor-pointer transition-colors duration-200 hover:bg-[rgba(96,81,155,0.1)] hover:text-(--ink)"
    >
      <span class="text-base font-black">{{ langToggleText() }}</span>
      <span>{{ langToggleLabel() }}</span>
    </button> -->
    @if (isLoggedIn()) {
      <app-profile-menu [name]?="userName()" [email]?="userEmail()" [isSidebar]="true" />
    } @else {
      <app-auth-buttons />
    }
  </div>
</aside>
