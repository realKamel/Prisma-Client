<!-- <header class="navbar" [class.scrolled]="isScrolled()"> -->
<header
  class="navbar bg-nav border-border fixed top-0 z-200 flex h-16 items-center justify-between border-b px-4 backdrop-blur-[20px] md:px-8 lg:px-14"
  [class.inset-x-0]="true"
  ngmMotion
  [initial]="{ opacity: 0 }"
  [animate]="{ opacity: 1 }"
  [transition]="navbarEntranceTransition"
>
  <!-- Logo -->
  <app-nav-logo />

  <!-- Desktop Links -->
  <nav class="hidden justify-self-center md:grid">
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </nav>

  <!-- Desktop Actions -->
  <div class="col-inset-s-3 grid grid-flow-col items-center gap-2">
    <app-theme-toggle />

    @if (isLoggedIn()) {
      <div class="hidden md:block">
        <app-profile-menu
          [name]?="userName()"
          [email]?="userEmail()"
        />
      </div>
    } @else {
      <div class="hidden md:block">
        <app-auth-buttons />
      </div>
    }

    <!-- Hamburger — mobile only (burger / close swap: both glyphs stay mounted
         and only their state classes flip, so the outgoing glyph dissolves into
         a blur while the incoming one sharpens up) -->
    <button
      class="hamburger rounded-10 border-border relative grid h-10 w-10 cursor-pointer place-items-center items-center justify-center border bg-transparent p-2.5 md:hidden"
      (click)="toggleSidebar()"
      [attr.aria-label]="(isSidebarOpen() ? 'NAVBAR.CLOSE' : 'NAVBAR.MENU') | translate"
      [attr.aria-expanded]="isSidebarOpen()"
    >
      <span class="relative flex h-6 w-6 shrink-0 items-center justify-center">
        <!-- Burger — visible while the drawer is closed -->
        <ng-icon
          name="bootstrapList"
          class="absolute inset-0 m-auto flex items-center justify-center text-3xl transition-[opacity,filter,scale] duration-220 ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none"
          [class.opacity-0]="isSidebarOpen()"
          [class.blur-xs]="isSidebarOpen()"
          [class.scale-75]="isSidebarOpen()"
          aria-hidden="true"
        />

        <!-- Close — visible while the drawer is open -->
        <ng-icon
          name="bootstrapX"
          class="absolute inset-0 m-auto flex items-center justify-center text-4xl transition-[opacity,filter,scale] duration-220 ease-[cubic-bezier(0.22,1,0.36,1)] motion-reduce:transition-none"
          [class.opacity-0]="!isSidebarOpen()"
          [class.blur-xs]="!isSidebarOpen()"
          [class.scale-75]="!isSidebarOpen()"
          aria-hidden="true"
        />
      </span>
    </button>
  </div>
</header>

<!-- Overlay -->
@if (isSidebarOpen()) {
  <div
    class="sidebar-overlay fixed inset-0 z-60 bg-black/60"
    (click)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
    role="button"
    tabindex="0"
    ngmMotion
    [initial]="{ opacity: 0 }"
    [animate]="{ opacity: 1 }"
    [exit]="{ opacity: 0 }"
    [transition]="overlayTransition"
  ></div>
}

<!-- Sidebar -->
<aside
  class="sidebar bg-surface border-border fixed inset-s-0 top-16 z-70 flex h-[calc(100dvh-64px)] w-70 flex-col gap-6 border-e p-6"
  [attr.aria-hidden]="!isSidebarOpen()"
  [attr.inert]="isSidebarOpen() ? null : ''"
  [class.pointer-events-none]="!isSidebarOpen()"
  ngmMotion
  [initial]="sidebarClosedState()"
  [animate]="isSidebarOpen() ? sidebarOpenState : sidebarClosedState()"
  [transition]="sidebarTransition"
>
  <div class="flex-1 overflow-y-auto">
    <app-nav-links
      [(isSideBarOpen)]="isSidebarOpen"
      [isLoggedIn]="isLoggedIn()"
    />
  </div>

  <div class="border-border flex flex-col gap-2 border-t pt-4">
    @if (isLoggedIn()) {
      <app-profile-menu
        [name]?="userName()"
        [email]?="userEmail()"
        [isSidebar]="true"
      />
    } @else {
      <app-auth-buttons [(isSideBarOpen)]="isSidebarOpen" />
    }
  </div>
</aside>
