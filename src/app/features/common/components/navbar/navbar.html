<!-- <header class="navbar" [class.scrolled]="isScrolled()"> -->
<header
  class="navbar bg-nav border-border fixed top-0 z-200 flex h-16 items-center justify-between border-b px-4 backdrop-blur-[20px] md:px-8 lg:px-14"
  [class.inset-x-0]="true"
  ngmMotion
  [initial]="{ opacity: 0 }"
  [animate]="{ opacity: 1 }"
  [transition]="navbarEntranceTransition"
>
  <!-- Logo -->
  <app-nav-logo />

  <!-- Desktop Links -->
  <nav class="hidden justify-self-center md:grid">
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </nav>

  <!-- Desktop Actions -->
  <div class="col-inset-s-3 grid grid-flow-col items-center gap-2">
    <app-theme-toggle />

    @if (isLoggedIn()) {
      <div class="hidden md:block">
        <app-profile-menu
          [name]?="userName()"
          [email]?="userEmail()"
        />
      </div>
    } @else {
      <div class="hidden md:block">
        <app-auth-buttons />
      </div>
    }

    <!-- Hamburger — mobile only (smooth morph to X when sidebar is open) -->
    <button
      class="hamburger rounded-10 border-border relative grid h-10 w-10 cursor-pointer place-items-center gap-1.25 border bg-transparent p-2.5 md:hidden"
      (click)="toggleSidebar()"
      [attr.aria-label]="(isSidebarOpen() ? 'NAVBAR.CLOSE' : 'NAVBAR.MENU') | translate"
      [class.menu-open]="isSidebarOpen()"
    >
      <span class="grid size-6 place-items-center">
        <!-- Hamburger icon (tw-animate-css: exits when sidebar opens, enters when it closes) -->
        <svg
          class="col-inset-s-1 row-inset-s-1 size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line
            x1="3"
            y1="6"
            x2="21"
            y2="6"
          />
          <line
            x1="3"
            y1="12"
            x2="21"
            y2="12"
          />
          <line
            x1="3"
            y1="18"
            x2="21"
            y2="18"
          />
        </svg>
        <!-- X icon (tw-animate-css: enters when sidebar opens, exits when it closes) -->
        <svg
          class="col-inset-s-1 row-inset-s-1 size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </span>
    </button>
  </div>
</header>

<!-- Overlay -->
@if (isSidebarOpen()) {
  <div
    class="sidebar-overlay fixed inset-0 z-60 bg-black/60"
    (click)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
    role="button"
    tabindex="0"
    ngmMotion
    [initial]="{ opacity: 0 }"
    [animate]="{ opacity: 1 }"
    [exit]="{ opacity: 0 }"
    [transition]="overlayTransition"
  ></div>
}

<!-- Sidebar -->
<aside
  class="sidebar bg-surface border-border fixed inset-s-0 top-16 z-70 flex h-[calc(100dvh-64px)] w-70 flex-col gap-6 border-e p-6"
  [attr.aria-hidden]="!isSidebarOpen()"
  [attr.inert]="isSidebarOpen() ? null : ''"
  [class.pointer-events-none]="!isSidebarOpen()"
  ngmMotion
  [initial]="sidebarClosedState()"
  [animate]="isSidebarOpen() ? sidebarOpenState : sidebarClosedState()"
  [transition]="sidebarTransition"
>
  <div class="flex-1 overflow-y-auto">
    <app-nav-links
      [(isSideBarOpen)]="isSidebarOpen"
      [isLoggedIn]="isLoggedIn()"
    />
  </div>

  <div class="border-border flex flex-col gap-2 border-t pt-4">
    @if (isLoggedIn()) {
      <app-profile-menu
        [name]?="userName()"
        [email]?="userEmail()"
        [isSidebar]="true"
      />
    } @else {
      <app-auth-buttons [(isSideBarOpen)]="isSidebarOpen" />
    }
  </div>
</aside>
