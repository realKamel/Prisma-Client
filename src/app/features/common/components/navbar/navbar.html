<!-- <header class="navbar" [class.scrolled]="isScrolled()"> -->
<header
  class="navbar fixed top-0 z-200 flex items-center justify-between h-16 px-4 md:px-8 lg:px-14 bg-nav border-b border-border backdrop-blur-[20px]"
  [class.inset-x-0]="true"
  ngmMotion
  [initial]="{ opacity: 0, y: -18 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="navbarEntranceTransition"
>
  <!-- Logo -->
  <div
    ngmMotion
    [initial]="{ opacity: 0, x: -12 }"
    [animate]="{ opacity: 1, x: 0 }"
    [transition]="{ ...navbarEntranceTransition, delay: 0.04 }"
  >
    <app-nav-logo />
  </div>

  <!-- Desktop Links -->
  <nav
    class="hidden md:grid justify-self-center"
    ngmMotion
    [initial]="{ opacity: 0, y: -8 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ ...navbarEntranceTransition, delay: 0.1 }"
  >
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </nav>

  <!-- Desktop Actions -->
  <div
    class="grid grid-flow-col items-center gap-2 col-start-3"
    ngmMotion
    [initial]="{ opacity: 0, x: 12 }"
    [animate]="{ opacity: 1, x: 0 }"
    [transition]="{ ...navbarEntranceTransition, delay: 0.16 }"
  >
    <app-theme-toggle />

    @if (isLoggedIn()) {
      <div class="hidden md:block">
        <app-profile-menu [name]?="userName()" [email]?="userEmail()" />
      </div>
    } @else {
      <div class="hidden md:block">
        <app-auth-buttons />
      </div>
    }

    <!-- Hamburger — mobile only (smooth morph to X when sidebar is open) -->
    <button
      class="hamburger md:hidden relative grid place-items-center gap-1.25 w-10 h-10 p-2.5 rounded-10 border border-border bg-transparent cursor-pointer"
      (click)="toggleSidebar()"
      [attr.aria-label]="(isSidebarOpen() ? 'NAVBAR.CLOSE' : 'NAVBAR.MENU') | translate"
      [class.menu-open]="isSidebarOpen()"
      ngmMotion
      [whileHover]="{ scale: 1.04 }"
      [whileTap]="{ scale: 0.96 }"
      [transition]="navbarIconTransition"
    >
      <span class="grid size-6 place-items-center">
        <!-- Hamburger icon (tw-animate-css: exits when sidebar opens, enters when it closes) -->
        <svg
          class="col-start-1 row-start-1 size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <!-- X icon (tw-animate-css: enters when sidebar opens, exits when it closes) -->
        <svg
          class="col-start-1 row-start-1 size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </span>
    </button>
  </div>
</header>

<!-- Overlay -->
@if (isSidebarOpen()) {
  <div
    class="sidebar-overlay fixed inset-0 z-60 bg-black/60"
    (click)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
    role="button"
    tabindex="0"
    ngmMotion
    [initial]="{ opacity: 0 }"
    [animate]="{ opacity: 1 }"
    [exit]="{ opacity: 0 }"
    [transition]="overlayTransition"
  ></div>
}

<!-- Sidebar -->
<aside
  class="sidebar fixed top-16 left-0 w-70 h-[calc(100dvh-64px)] z-70 flex flex-col gap-6 p-6 bg-surface border-border border-r"
  [attr.aria-hidden]="!isSidebarOpen()"
  ngmMotion
  [initial]="{ x: '-100%', opacity: 0 }"
  [animate]="isSidebarOpen() ? { x: 0, opacity: 1 } : { x: '-100%', opacity: 0 }"
  [transition]="sidebarTransition"
>
  <div class="flex-1 overflow-y-auto">
    <app-nav-links [(isSideBarOpen)]="isSidebarOpen" [isLoggedIn]="isLoggedIn()" />
  </div>

  <div class="flex flex-col gap-2 pt-4 border-t border-border">
    @if (isLoggedIn()) {
      <app-profile-menu [name]?="userName()" [email]?="userEmail()" [isSidebar]="true" />
    } @else {
      <app-auth-buttons [(isSideBarOpen)]="isSidebarOpen" />
    }
  </div>
</aside>
