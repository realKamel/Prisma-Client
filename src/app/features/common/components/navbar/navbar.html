<!-- <header class="navbar" [class.scrolled]="isScrolled()"> -->
<header
  class="navbar fixed top-0 z-200 flex items-center justify-between h-16 px-4 md:px-8 lg:px-14 bg-(--nav-bg) border-b border-(--border) backdrop-blur-[20px]"
  [class.inset-x-0]="true"
>
  <!-- Logo -->
  <app-nav-logo />

  <!-- Desktop Links -->
  <nav class="hidden md:flex flex-1 justify-center">
    <app-nav-links [isLoggedIn]="isLoggedIn()" />
  </nav>

  <!-- Desktop Actions -->
  <div class="flex items-center gap-2">
    <app-theme-toggle />

    @if (isLoggedIn()) {
      <div class="hidden md:block">
        <app-profile-menu [name]?="userName()" [email]?="userEmail()" />
      </div>
    } @else {
      <div class="hidden md:block">
        <app-auth-buttons />
      </div>
    }

    <!-- Hamburger — mobile only (smooth morph to X when sidebar is open) -->
    <button
      class="hamburger md:hidden relative flex items-center justify-center gap-1.25 w-10 h-10 p-2.5 rounded-[10px] border border-(--border) bg-transparent cursor-pointer"
      (click)="toggleSidebar()"
      [attr.aria-label]="(isSidebarOpen() ? 'NAVBAR.CLOSE' : 'NAVBAR.MENU') | translate"
    >
      <span class="grid size-6 place-items-center">
        <!-- Hamburger icon -->
        <svg
          class="col-start-1 row-start-1 size-6 transition-all duration-300 ease-in-out"
          [class.opacity-0]="isSidebarOpen()"
          [class.rotate-90]="isSidebarOpen()"
          [class.scale-50]="isSidebarOpen()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
        <!-- X icon -->
        <svg
          class="col-start-1 row-start-1 size-6 transition-all duration-300 ease-in-out"
          [class.opacity-0]="!isSidebarOpen()"
          [class.rotate-90]="!isSidebarOpen()"
          [class.scale-50]="!isSidebarOpen()"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </span>
    </button>
  </div>
</header>

<!-- Overlay -->
@if (isSidebarOpen()) {
  <div
    class="sidebar-overlay fixed inset-0 z-60 bg-black/60"
    (click)="closeSidebar()"
    (keydown.escape)="closeSidebar()"
    role="button"
    tabindex="0"
  ></div>
}

<!-- Sidebar -->
<aside
  class="sidebar fixed top-16 left-0 w-70 h-[calc(100dvh-64px)] z-70 flex flex-col gap-6 p-6 bg-(--surface) border-(--border) border-r"
  [class.translate-x-0]="isSidebarOpen()"
  [class.-translate-x-full]="!isSidebarOpen()"
>
  <div class="flex-1 overflow-y-auto">
    <app-nav-links [(isSideBarOpen)]="isSidebarOpen" [isLoggedIn]="isLoggedIn()" />
  </div>

  <div class="flex flex-col gap-2 pt-4 border-t border-(--border)">
    @if (isLoggedIn()) {
      <app-profile-menu [name]?="userName()" [email]?="userEmail()" [isSidebar]="true" />
    } @else {
      <app-auth-buttons [(isSideBarOpen)]="isSidebarOpen" />
    }
  </div>
</aside>
