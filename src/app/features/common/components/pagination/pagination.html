@if (totalPages() > 1) {
  <div class="flex items-center justify-center gap-2 border-t border-(--border) px-4 py-4">
    <!-- Prev -->
    <button
      type="button"
      (click)="pageChange.emit(currentPage() - 1)"
      [disabled]="currentPage() === 1"
      class="flex h-8 w-8 items-center justify-center rounded-full border border-(--border) text-(--muted) transition-colors hover:border-(--border-focus) hover:text-(--ink) disabled:opacity-30 disabled:hover:border-(--border) disabled:hover:text-(--muted)"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </button>

    <!-- Page numbers -->
    @for (page of pagesArray(); track page) {
      <button
        type="button"
        (click)="pageChange.emit(page)"
        class="flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold transition-colors"
        [class]="
          currentPage() === page
            ? 'bg-(--purple) text-white'
            : 'border border-(--border) text-(--muted) hover:border-(--border-focus) hover:text-(--ink)'
        "
      >
        {{ page | number }}
      </button>
    }

    <!-- Next -->
    <button
      type="button"
      (click)="pageChange.emit(currentPage() + 1)"
      [disabled]="currentPage() === totalPages()"
      class="flex h-8 w-8 items-center justify-center rounded-full border border-(--border) text-(--muted) transition-colors hover:border-(--border-focus) hover:text-(--ink) disabled:opacity-30 disabled:hover:border-(--border) disabled:hover:text-(--muted)"
    >
      <svg
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
  </div>
}
