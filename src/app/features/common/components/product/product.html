<section
  class="relative z-10 flex flex-col items-center overflow-x-clip px-5 py-16 text-center sm:px-8 md:py-24"
>
  <h2
    class="text-ink text-[clamp(24px,4.5vw,40px)] leading-[1.3] font-black text-balance"
    ngmMotion
    [initial]="blurInitial"
    [whileInView]="blurAnimate"
    [viewport]="headingViewport"
    [transition]="headingTransition"
  >
    {{ heading }}
  </h2>

  <!-- Product mock: a full, uncropped lesson player with two floating chips that echo the
       chain below (quiz result, parent report). Chips sit outside the card so they can overlap its edges. -->
  <div
    aria-hidden="true"
    class="relative mt-12 w-full max-w-[780px] md:mt-14"
    ngmMotion
    [initial]="blurInitial"
    [whileInView]="blurAnimate"
    [viewport]="mockViewport"
    [transition]="mockTransition"
  >
    <div
      class="border-border bg-main overflow-hidden rounded-[18px] border text-start shadow-[0_30px_80px_-30px_rgba(var(--color-primary-rgb),0.35)]"
    >
      <div class="bg-surface border-border flex items-center gap-1.5 border-b px-3.5 py-2.5">
        <span class="bg-border size-2.5 rounded-full"></span>
        <span class="bg-border size-2.5 rounded-full"></span>
        <span class="bg-border size-2.5 rounded-full"></span>
        <span
          class="bg-surface-subtle text-muted rounded-pill ms-3 max-w-[280px] flex-1 px-3.5 text-center text-xs"
          dir="ltr"
          >wasla.app</span
        >
      </div>

      <div class="text-ink flex items-center gap-2 px-4 py-2.5 text-sm font-extrabold">
        <span class="bg-primary grid size-[22px] place-items-center rounded-md text-xs text-white"
          >W</span
        >
        وصلة
      </div>

      <div class="grid gap-3.5 px-4 pb-4 sm:grid-cols-[1.9fr_1fr]">
        <div
          class="bg-surface-subtle border-border relative aspect-[16/8.4] overflow-hidden rounded-xl border"
        >
          <div
            class="absolute inset-x-[6%] top-[9%] bottom-[20%] grid grid-cols-[1fr_2.4fr] gap-1.5"
          >
            <i class="bg-primary/30 rounded-[3px]"></i>
            <i class="bg-border row-span-2 rounded-[3px]"></i>
            <i class="bg-border rounded-[3px]"></i>
          </div>
          <div
            class="rounded-pill absolute inset-x-3 bottom-2.5 flex h-8 items-center gap-2.5 border border-white/15 bg-black/85 px-3 text-xs text-white/80"
          >
            <ng-icon
              name="bootstrapPlayFill"
              class="shrink-0 text-xs text-white"
            ></ng-icon>
            <ng-icon
              name="bootstrapVolumeUpFill"
              class="shrink-0 text-xs text-white"
            ></ng-icon>
            <span class="rounded-pill h-[3px] flex-1 bg-white/20"
              ><span class="rounded-pill block h-full w-[28%] bg-white"></span
            ></span>
            <span dir="ltr">0:00 / 0:20</span>
          </div>
        </div>

        <aside class="bg-surface border-border hidden self-start rounded-2xl border p-3 sm:block">
          <div class="flex items-center gap-2.5 py-1.5">
            <span
              class="bg-mint/15 text-mint grid size-[26px] shrink-0 place-items-center rounded-lg text-xs"
            >
              <ng-icon name="bootstrapCheckLg"></ng-icon>
            </span>
            <b class="text-ink text-[13px] font-bold">الفصل الأول</b>
          </div>
          <div class="flex items-center gap-2.5 py-1.5">
            <span
              class="border-ink/40 text-ink grid size-[26px] shrink-0 place-items-center rounded-full border-[1.5px] text-xs"
            >
              <ng-icon name="bootstrapPlayFill"></ng-icon>
            </span>
            <b class="text-ink text-[13px] font-bold">الفصل الثاني</b>
          </div>
          <div class="flex items-center gap-2.5 py-1.5">
            <span
              class="bg-surface-subtle text-muted grid size-[26px] shrink-0 place-items-center rounded-lg text-xs font-bold"
              >?</span
            >
            <b class="text-ink text-[13px] font-bold">اختبر نفسك</b>
          </div>
        </aside>
      </div>
    </div>

    <!-- Chip: quiz result -->
    <div
      class="bg-surface border-border absolute -start-2 -top-5 flex items-center gap-2.5 rounded-2xl border px-3.5 py-2.5 text-start shadow-[0_18px_40px_-18px_rgba(0,0,0,0.45)] md:-start-6 lg:-start-12"
    >
      <span
        class="bg-mint/15 text-mint grid size-8 shrink-0 place-items-center rounded-lg text-xs font-extrabold"
        >٩/١٠</span
      >
      <span class="flex flex-col leading-tight">
        <b class="text-ink text-[13px] font-bold">نتيجة الاختبار</b>
        <span class="text-muted text-xs">أحسنت!</span>
      </span>
    </div>

    <!-- Chip: parent report -->
    <div
      class="bg-surface border-border absolute -end-2 -bottom-5 flex items-center gap-2.5 rounded-2xl border px-3.5 py-2.5 text-start shadow-[0_18px_40px_-18px_rgba(0,0,0,0.45)] md:-end-6 lg:-end-12"
    >
      <span
        class="bg-primary/15 text-primary-light grid size-8 shrink-0 place-items-center rounded-lg text-xs"
      >
        <ng-icon name="bootstrapCheckLg"></ng-icon>
      </span>
      <span class="flex flex-col leading-tight">
        <b class="text-ink text-[13px] font-bold">تقرير ولي الأمر</b>
        <span class="text-muted text-xs">تم إرسال تقدّم اليوم</span>
      </span>
    </div>
  </div>

  <!-- Connected feature chain: the steps of the product. One soft light passes along it once it's on screen. -->
  <ol
    #chain
    class="hero-chain text-ink relative mt-12 flex w-full max-w-[720px] list-none pt-3.5 pb-7"
    ngmMotion
    [initial]="blurInitial"
    [whileInView]="blurAnimate"
    [viewport]="chainViewport"
    [transition]="chainTransition"
  >
    @for (step of chainSteps; track step) {
      <li class="hero-chain-step relative flex flex-1 flex-col items-center gap-2.5 text-center">
        <span class="hero-node"></span>
        <span class="text-muted text-xs font-semibold sm:text-sm">{{ step }}</span>
      </li>
    }
  </ol>
</section>
