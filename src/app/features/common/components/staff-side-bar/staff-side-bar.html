@if (isMobileMenuOpen()) {
  <div
    ngmMotion
    [initial]="{ opacity: 0 }"
    [animate]="{ opacity: 1 }"
    [exit]="{ opacity: 0 }"
    [transition]="fadeTransition"
    class="fixed inset-0 bg-[#0a0a14]/60 backdrop-blur-[2px] z-190 md:hidden"
    (click)="toggleMobileMenu.emit()"
    (keyup.escape)="toggleMobileMenu.emit()"
    role="button"
    tabindex="0"
  ></div>
}

<aside
  ngmMotion
  [initial]="{ opacity: 0 }"
  [animate]="{ opacity: 1 }"
  [transition]="fadeTransition"
  class="fixed inset-y-0 inset-s-0 inset-e-auto w-60 h-screen bg-surface border-e border-border flex flex-col z-200 transition-transform duration-260 ease-out overflow-hidden md:w-16 lg:w-60 md:translate-x-0 shrink-0"
  [class.translate-x-0]="isMobileMenuOpen()"
  [class.translate-x-full]="!isMobileMenuOpen() && langService.lang() === 'ar'"
  [class.-translate-x-full]="!isMobileMenuOpen() && langService.lang() === 'en'"
>
  <div class="flex flex-col h-full w-full">
    <div
      class="flex items-center gap-3 p-5 border-b border-border shrink-0 justify-center lg:justify-start"
    >
      <div
        class="w-10 h-10 rounded-full bg-primary text-white text-base font-black flex items-center justify-center shrink-0 shadow-[0_4px_12px_var(--color-primary-glow)]"
        ngmMotion
        [initial]="{ opacity: 0, scale: 0.8 }"
        [animate]="{ opacity: 1, scale: 1 }"
        [transition]="{ type: 'spring', stiffness: 320, damping: 22, delay: 0.05 }"
      >
        {{ teacherInitial() }}
      </div>
      <div
        class="overflow-hidden transition-opacity duration-200 md:hidden lg:block min-w-0"
        ngmMotion
        [initial]="{ opacity: 0, x: -10 }"
        [animate]="{ opacity: 1, x: 0 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 26, delay: 0.1 }"
      >
        <div
          class="text-base font-bold text-ink whitespace-nowrap overflow-hidden text-ellipsis"
          [attr.title]="teacherName()"
        >
          {{ teacherName() }}
        </div>
        <div class="text-xs font-normal text-muted mt-1">
          {{ teacherSubject() | translate }}
        </div>
      </div>
    </div>

    <nav
      class="p-3 flex flex-col gap-1 flex-1 items-start overflow-y-auto overflow-x-hidden scrollbar-none"
    >
      @for (item of navItems(); track item.id; let i = $index) {
        <a
          [routerLink]="item.route"
          (click)="toggleMobileMenu.emit()"
          routerLinkActive="bg-primary text-white shadow-[0_4px_16px_var(--color-primary-glow)]"
          [routerLinkActiveOptions]="{ exact: true }"
          ngmMotion
          [initial]="{ opacity: 0, x: langService.lang() === 'ar' ? 12 : -12 }"
          [animate]="{ opacity: 1, x: 0 }"
          [whileTap]="{
            ...sidebarItemTap,
          }"
          [transition]="{ ...sidebarItemTransition, delay: 0.12 + i * 0.035 }"
          class="flex items-start justify-start gap-3 p-3 rounded-xl no-underline text-base w-full font-semibold text-ink-subtle transition-colors duration-200 whitespace-nowrap group lg:justify-start hover:bg-primary/10 hover:text-ink"
        >
          <span
            class="w-5 h-5 shrink-0 opacity-70 group-hover:opacity-100 transition-opacity flex items-center justify-center"
          >
            <ng-icon [name]="item.icon" />
          </span>
          <span class="transition-opacity duration-200 md:hidden lg:inline-block">
            {{ item.labelKey | translate }}
          </span>
        </a>
      }
    </nav>

    <div class="mt-auto p-3 border-t border-border flex flex-col gap-1 shrink-0 bg-surface">
      <button
        (click)="themeService.toggle()"
        ngmMotion
        [initial]="{ opacity: 0, y: 8 }"
        [animate]="{ opacity: 1, y: 0 }"
        [whileTap]="{
          ...sidebarItemTap,
        }"
        [transition]="{ ...sidebarItemTransition, delay: 0.28 }"
        class="flex items-center gap-3 p-3 rounded-xl bg-transparent border-0 text-ink-subtle text-base font-semibold cursor-pointer transition-colors duration-200 w-full text-start justify-center lg:justify-start hover:bg-primary/10 hover:text-ink"
      >
        <!-- Sun / moon cross-fade: both icons stay mounted, only their motion
             targets flip with the theme, so the swap springs instead of snapping. -->
        <span class="relative w-5 h-5 shrink-0">
          <!-- Sun — visible while the dark theme is active -->
          <svg
            ngmMotion
            [initial]="false"
            [animate]="
              themeService.theme() === 'dark'
                ? { opacity: 0.7, rotate: 0, scale: 1 }
                : { opacity: 0, rotate: -90, scale: 0.4 }
            "
            [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
            class="absolute inset-0 w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M7.757 6.343l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z"
            />
          </svg>

          <!-- Moon — visible while the light theme is active -->
          <svg
            ngmMotion
            [initial]="false"
            [animate]="
              themeService.theme() === 'dark'
                ? { opacity: 0, rotate: 90, scale: 0.4 }
                : { opacity: 0.7, rotate: 0, scale: 1 }
            "
            [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
            class="absolute inset-0 w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </span>

        <span class="md:hidden lg:inline">{{
          (themeService.theme() === 'dark' ? 'SIDEBAR.LIGHT_MODE' : 'SIDEBAR.DARK_MODE') | translate
        }}</span>
      </button>

      <button
        (click)="auth.logout()"
        ngmMotion
        [variants]="sidebarActionVariants"
        [whileHover]="'hover'"
        [initial]="{ opacity: 0, y: 8 }"
        [animate]="{ opacity: 1, y: 0 }"
        [whileTap]="{
          ...sidebarItemTap,
        }"
        [transition]="{ ...sidebarItemTransition, delay: 0.32 }"
        class="flex items-center gap-3 p-3 rounded-xl no-underline text-coral text-base font-semibold transition-colors duration-200 whitespace-nowrap justify-center lg:justify-start hover:bg-coral/10 cursor-pointer"
      >
        <!-- Pure variant node: no [animate]/[initial] of its own, so it registers
             as a variant child of the button and inherits its `hover` label. -->
        <svg
          ngmMotion
          [variants]="sidebarActionIconVariants"
          class="w-5 h-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span class="md:hidden lg:inline">{{ 'SIDEBAR.LOGOUT' | translate }}</span>
      </button>
    </div>
  </div>
</aside>
