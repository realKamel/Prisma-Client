@if (isMobileMenuOpen()) {
  <div
    ngmMotion
    [initial]="{ opacity: 0 }"
    [animate]="{ opacity: 1 }"
    [exit]="{ opacity: 0 }"
    [transition]="fadeTransition"
    class="fixed inset-0 z-190 bg-[#0a0a14]/60 backdrop-blur-[2px] md:hidden"
    (click)="toggleMobileMenu.emit()"
    (keyup.escape)="toggleMobileMenu.emit()"
    role="button"
    tabindex="0"
  ></div>
}

<aside
  ngmMotion
  [initial]="{ opacity: 0 }"
  [animate]="{ opacity: 1 }"
  [transition]="fadeTransition"
  class="bg-surface border-border fixed inset-y-0 inset-s-0 inset-e-auto z-200 flex h-screen w-60 shrink-0 flex-col overflow-hidden border-e transition-transform duration-260 ease-out md:w-16 md:translate-x-0 lg:w-60"
  [class.translate-x-0]="isMobileMenuOpen()"
  [class.translate-x-full]="!isMobileMenuOpen() && langService.lang() === 'ar'"
  [class.-translate-x-full]="!isMobileMenuOpen() && langService.lang() === 'en'"
>
  <div class="flex h-full w-full flex-col">
    <div
      class="border-border flex shrink-0 items-center justify-center gap-3 border-b p-5 lg:justify-start"
    >
      <div
        class="bg-primary flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-base font-black text-white shadow-[0_4px_12px_var(--color-primary-glow)]"
        ngmMotion
        [initial]="{ opacity: 0, scale: 0.8 }"
        [animate]="{ opacity: 1, scale: 1 }"
        [transition]="{ type: 'spring', stiffness: 320, damping: 22, delay: 0.05 }"
      >
        {{ teacherInitial() }}
      </div>
      <div
        class="min-w-0 overflow-hidden transition-opacity duration-200 md:hidden lg:block"
        ngmMotion
        [initial]="{ opacity: 0, x: -10 }"
        [animate]="{ opacity: 1, x: 0 }"
        [transition]="{ type: 'spring', stiffness: 300, damping: 26, delay: 0.1 }"
      >
        <div
          class="text-ink overflow-hidden text-base font-bold text-ellipsis whitespace-nowrap"
          [attr.title]="teacherName()"
        >
          {{ teacherName() }}
        </div>
        <div class="text-muted mt-1 text-xs font-normal">
          {{ teacherSubject() | translate }}
        </div>
      </div>
    </div>

    <nav
      class="flex flex-1 scrollbar-none flex-col items-start gap-1 overflow-x-hidden overflow-y-auto p-3"
    >
      @for (item of navItems(); track item.id; let i = $index) {
        <a
          [routerLink]="item.route"
          (click)="toggleMobileMenu.emit()"
          routerLinkActive="bg-primary text-white shadow-[0_4px_16px_var(--color-primary-glow)]"
          [routerLinkActiveOptions]="{ exact: true }"
          ngmMotion
          [initial]="{ opacity: 0, x: langService.lang() === 'ar' ? 12 : -12 }"
          [animate]="{ opacity: 1, x: 0 }"
          [whileTap]="{
            ...sidebarItemTap,
          }"
          [transition]="{ ...sidebarItemTransition, delay: 0.12 + i * 0.035 }"
          class="text-ink-subtle group hover:bg-surface-subtle hover:text-ink flex w-full items-start justify-start gap-3 rounded-xl p-3 text-base font-semibold whitespace-nowrap no-underline transition-colors duration-200 hover:shadow-xs lg:justify-start"
        >
          <span
            class="flex h-5 w-5 shrink-0 items-center justify-center opacity-70 transition-opacity group-hover:opacity-100"
          >
            <ng-icon [name]="item.icon" />
          </span>
          <span class="transition-opacity duration-200 md:hidden lg:inline-block">
            {{ item.labelKey | translate }}
          </span>
        </a>
      }
    </nav>

    <div class="border-border bg-surface mt-auto flex shrink-0 flex-col gap-1 border-t p-3">
      <button
        (click)="themeService.toggle()"
        ngmMotion
        [initial]="{ opacity: 0, y: 8 }"
        [animate]="{ opacity: 1, y: 0 }"
        [whileTap]="{
          ...sidebarItemTap,
        }"
        [transition]="{ ...sidebarItemTransition, delay: 0.28 }"
        class="text-ink-subtle hover:bg-primary/10 hover:text-ink flex w-full cursor-pointer items-center justify-center gap-3 rounded-xl border-0 bg-transparent p-3 text-start text-base font-semibold transition-colors duration-200 lg:justify-start"
      >
        <!-- Sun / moon cross-fade: both icons stay mounted, only their motion
             targets flip with the theme, so the swap springs instead of snapping. -->
        <span class="relative h-5 w-5 shrink-0">
          <!-- Sun — visible while the dark theme is active -->
          <svg
            ngmMotion
            [initial]="false"
            [animate]="
              themeService.theme() === 'dark'
                ? { opacity: 0.7, rotate: 0, scale: 1 }
                : { opacity: 0, rotate: -90, scale: 0.4 }
            "
            [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
            class="absolute inset-0 h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M7.757 6.343l.707-.707M12 5a7 7 0 100 14 7 7 0 000-14z"
            />
          </svg>

          <!-- Moon — visible while the light theme is active -->
          <svg
            ngmMotion
            [initial]="false"
            [animate]="
              themeService.theme() === 'dark'
                ? { opacity: 0, rotate: 90, scale: 0.4 }
                : { opacity: 0.7, rotate: 0, scale: 1 }
            "
            [transition]="{ type: 'spring', stiffness: 300, damping: 24 }"
            class="absolute inset-0 h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
        </span>

        <span class="md:hidden lg:inline">{{
          (themeService.theme() === 'dark' ? 'SIDEBAR.LIGHT_MODE' : 'SIDEBAR.DARK_MODE') | translate
        }}</span>
      </button>

      <button
        (click)="auth.logout()"
        ngmMotion
        [variants]="sidebarActionVariants"
        [whileHover]="'hover'"
        [initial]="{ opacity: 0, y: 8 }"
        [animate]="{ opacity: 1, y: 0 }"
        [whileTap]="{
          ...sidebarItemTap,
        }"
        [transition]="{ ...sidebarItemTransition, delay: 0.32 }"
        class="text-coral hover:bg-coral/10 flex cursor-pointer items-center justify-center gap-3 rounded-xl p-3 text-base font-semibold whitespace-nowrap no-underline transition-colors duration-200 lg:justify-start"
      >
        <!-- Pure variant node: no [animate]/[initial] of its own, so it registers
             as a variant child of the button and inherits its `hover` label. -->
        <svg
          ngmMotion
          [variants]="sidebarActionIconVariants"
          class="h-5 w-5 shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
          />
        </svg>
        <span class="md:hidden lg:inline">{{ 'SIDEBAR.LOGOUT' | translate }}</span>
      </button>
    </div>
  </div>
</aside>
