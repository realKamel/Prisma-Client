<section class="py-16 px-6 md:px-14 bg-surface">
  <div class="max-w-7xl mx-auto">
    <div class="text-center mb-12">
      <span class="text-xs font-light text-primary-light block mb-3">بيقولوا إيه؟</span>
      <h2 class="text-4xl md:text-5xl font-black text-ink">
        أهالي وطلاب
        <span class="text-primary-light ml-2">بيحبونا</span>
        <ng-icon name="bootstrapHeart" class="flex items-center" aria-hidden="true"></ng-icon>
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
      @if (reviews(); as list) {
        @for (review of list; track review.name) {
          <div
            class="bg-surface-subtle border border-border rounded-card p-7 flex flex-col gap-4 hover:-translate-y-1 transition-transform duration-200"
          >
            <div class="text-star text-xs tracking-widest text-right">
              {{ review.stars }}
            </div>

            <p class="text-sm text-lavender leading-relaxed text-right flex-1">
              {{ review.body }}
            </p>

            <div class="flex items-center gap-3 flex-row">
              <div
                class="w-10 h-10 rounded-full bg-primary text-white font-black text-sm flex items-center justify-center shrink-0"
              >
                {{ review.avatar }}
              </div>

              <div class="text-right">
                <div class="text-xs font-bold text-ink">{{ review.name }}</div>
                <div class="text-[11px] text-lavender mt-0.5">{{ review.role }}</div>
              </div>
            </div>
          </div>
        }
      }
    </div>
  </div>
</section>
