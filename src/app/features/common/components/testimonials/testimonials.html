<section class="bg-surface px-6 py-16 md:px-14">
  <div class="mx-auto max-w-7xl">
    <div class="mb-12 text-center">
      <span class="text-primary-light mb-3 block text-xs font-light">بيقولوا إيه؟</span>
      <h2 class="text-ink text-4xl font-black md:text-5xl">
        أهالي وطلاب
        <span class="text-primary-light ms-2">بيحبونا</span>
        <ng-icon
          name="bootstrapHeart"
          class="flex items-center"
          aria-hidden="true"
        ></ng-icon>
      </h2>
    </div>

    <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
      @if (reviews(); as list) {
        @for (review of list; track review.name) {
          <div
            class="bg-surface-subtle border-border rounded-card flex flex-col gap-4 border p-7 transition-transform duration-200 hover:-translate-y-1"
          >
            <div class="text-star text-right text-xs tracking-widest">
              {{ review.stars }}
            </div>

            <p class="text-lavender flex-1 text-right text-sm leading-relaxed">
              {{ review.body }}
            </p>

            <div class="flex flex-row items-center gap-3">
              <div
                class="bg-primary flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-black text-white"
              >
                {{ review.avatar }}
              </div>

              <div class="text-right">
                <div class="text-ink text-xs font-bold">{{ review.name }}</div>
                <div class="text-lavender mt-0.5 text-[11px]">{{ review.role }}</div>
              </div>
            </div>
          </div>
        }
      }
    </div>
  </div>
</section>
