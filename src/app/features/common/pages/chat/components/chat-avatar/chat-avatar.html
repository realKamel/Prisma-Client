<span class="relative inline-flex shrink-0" [class]="sizeClass()">
  @if (imageUrl()) {
    <img
      [src]="imageUrl()"
      [alt]="name()"
      width="48"
      height="48"
      loading="lazy"
      class="border-border h-full w-full rounded-full border object-cover"
    />
  } @else {
    <span
      class="flex h-full w-full items-center justify-center rounded-full font-bold text-white select-none"
      [class]="accentClass()"
      aria-hidden="true"
    >
      {{ initials() }}
    </span>
  }

  @if (showPresence()) {
    <span
      class="border-surface absolute -end-0.5 -bottom-0.5 h-3 w-3 rounded-full border-2"
      [class]="isOnline() ? 'bg-[var(--color-success)]' : 'bg-[var(--color-muted)]'"
      aria-hidden="true"
    ></span>
  }
</span>
