<div class="border-border bg-surface/40 border-t px-3 py-3 sm:px-4">
  <div
    class="border-border bg-surface-subtle focus-within:border-primary flex items-end gap-2 rounded-2xl border p-1.5 transition-colors duration-150 sm:p-2"
  >
    <textarea
      #textarea
      rows="1"
      [value]="text()"
      [attr.maxlength]="maxLength"
      [disabled]="disabled()"
      [placeholder]="placeholder()"
      [attr.aria-label]="placeholder()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      class="text-ink placeholder:text-muted max-h-36 min-h-9 w-full resize-none bg-transparent px-2 py-1.5 text-sm leading-relaxed outline-none disabled:cursor-not-allowed disabled:opacity-60"
    ></textarea>

    <button
      type="button"
      (click)="submit()"
      [disabled]="!canSend()"
      class="bg-primary focus-visible:outline-border-focus flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-xl text-white shadow-[0_4px_14px_var(--color-primary-glow)] transition-transform duration-150 hover:scale-105 focus-visible:outline-2 focus-visible:outline-offset-2 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:scale-100"
      [attr.aria-label]="'CHAT.COMPOSER.SEND' | translate"
      [attr.title]="'CHAT.COMPOSER.SEND' | translate"
    >
      <ng-icon
        name="bootstrapSendFill"
        class="text-sm"
        aria-hidden="true"
      />
    </button>
  </div>

  <div class="mt-1.5 flex items-center justify-between gap-3 px-1">
    <p class="text-muted text-[0.65rem]">{{ 'CHAT.COMPOSER.HINT' | translate }}</p>

    @if (showCounter()) {
      <p
        class="shrink-0 text-[0.65rem] font-semibold"
        [class.text-coral]="text().length >= maxLength"
        [class.text-muted]="text().length < maxLength"
        aria-live="polite"
      >
        {{ text().length }} / {{ maxLength }}
      </p>
    }
  </div>
</div>
