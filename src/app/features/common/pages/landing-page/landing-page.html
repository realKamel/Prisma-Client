<app-scroll-reveal>
  <div
    class="block"
    ngmMotion
    [initial]="{ opacity: 0, y: -20 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="heroTransition"
  >
    <app-hero></app-hero>
  </div>
</app-scroll-reveal>

@defer {
  <div class="landing-sections">
    <app-status-bar></app-status-bar>
    <div
      class="bg-bg text-ink selection:bg-primary/30 selection:text-ink min-h-screen overflow-x-clip font-['Cairo'] antialiased"
    >
      <div class="relative z-10">
        <app-features-bento></app-features-bento>
        <app-how-it-works></app-how-it-works>
        <app-for-whom></app-for-whom>
        <app-cta-section></app-cta-section>
      </div>
    </div>
  </div>
}
