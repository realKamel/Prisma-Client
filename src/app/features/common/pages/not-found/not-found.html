<main
  class="text-ink relative z-10 flex min-h-screen items-center justify-center px-5 py-20 antialiased md:px-10"
>
  <canvas
    id="stars-canvas"
    class="pointer-events-none absolute inset-0 z-0"
    aria-hidden="true"
  ></canvas>
  <div class="blob blob-1 pointer-events-none absolute opacity-20"></div>
  <div class="blob blob-2 pointer-events-none absolute opacity-20"></div>

  <div class="z-10 flex w-full max-w-140 flex-col items-center text-center">
    <div class="relative mb-10 flex h-60 w-full items-center justify-center">
      <div
        class="animate-spin-cw pointer-events-none absolute h-40 w-40 rounded-full border border-dashed border-[rgba(var(--color-primary-rgb),0.2)]"
      >
        <div
          class="bg-primary-light absolute -top-1 left-1/2 -ms-1 h-2 w-2 rounded-full shadow-[0_0_8px_var(--color-primary-light)]"
        ></div>
      </div>

      <div
        class="animate-spin-ccw pointer-events-none absolute h-55 w-55 rounded-full border border-dashed border-[rgba(var(--color-primary-rgb),0.2)]"
      >
        <div
          class="bg-mint absolute -top-1 left-1/2 -ms-1 h-2 w-2 rounded-full shadow-[0_0_8px_var(--color-mint)]"
        ></div>
      </div>

      <div
        class="from-primary-light to-mint animate-float-num bg-linear-to-br bg-clip-text text-[clamp(100px,20vw,160px)] leading-none font-black tracking-[-6px] text-transparent select-none"
        aria-hidden="true"
      >
        ٤٠٤
      </div>

      <div
        class="animate-float-icon absolute top-1/2 left-1/2 flex h-20 w-20 items-center justify-center rounded-[22px] border border-[rgba(var(--color-primary-rgb),0.3)] bg-[#080612]/85 shadow-[0_0_40px_rgba(var(--color-primary-rgb),0.2)]"
      >
        <ng-icon
          name="bootstrapPatchQuestionFill"
          class="text-4xl text-white"
        ></ng-icon>
      </div>
    </div>

    <div class="text-muted mb-2.5 text-xs font-bold tracking-[.08em] uppercase">خطأ ٤٠٤</div>
    <h1 class="text-ink mb-3 text-[clamp(22px,5vw,32px)] font-black tracking-[-.4px]">
      عذرًا، هذه الصفحة غير موجودة!
    </h1>
    <p class="text-muted mb-9 max-w-100 text-sm leading-relaxed md:text-[15px]">
      يبدو أن الرابط الذي وصلت منه خاطئ أو أن هذه الصفحة انتقلت لمكان آخر. لا تقلق — مكتبة دروسنا في
      انتظارك!
    </p>

    <div class="mb-12 flex w-full max-w-70 flex-col justify-center gap-3 sm:max-w-none sm:flex-row">
      <a
        [routerLink]="['/']"
        class="rounded-14 bg-primary inline-flex h-12.5 w-full cursor-pointer items-center justify-center gap-2 px-7 text-[15px] font-bold text-white no-underline shadow-[0_4px_20px_var(--color-primary-glow)] transition-all duration-200 hover:-translate-y-0.5 hover:opacity-90 sm:w-auto"
      >
        <ng-icon name="bootstrapHouseDoor"></ng-icon>
        العودة للرئيسية
      </a>
    </div>

    @if (auth.isLoggedIn()) {
      <div class="text-muted mb-3.5 text-xs font-bold tracking-[.07em] uppercase">
        أو انتقل مباشرةً إلى
      </div>
      <div class="flex flex-wrap justify-center gap-2.5">
        <a
          [routerLink]="['/dashboard']"
          class="bg-surface-subtle border-border text-ink-subtle hover:border-primary-light hover:text-primary-light inline-flex items-center gap-1.5 rounded-full border px-4 py-2 text-[13px] font-semibold no-underline transition-all duration-200 hover:bg-[rgba(var(--color-primary-rgb),0.12)]"
        >
          <ng-icon
            name="bootstrapGrid1x2Fill"
            size="14"
          ></ng-icon>
          لوحتي
        </a>
        <a
          [routerLink]="['/history']"
          class="bg-surface-subtle border-border text-ink-subtle hover:border-primary-light hover:text-primary-light inline-flex items-center gap-1.5 rounded-full border px-4 py-2 text-[13px] font-semibold no-underline transition-all duration-200 hover:bg-[rgba(var(--color-primary-rgb),0.12)]"
        >
          <ng-icon
            name="bootstrapBookHalf"
            size="14"
          ></ng-icon>
          دروسي
        </a>
        <a
          [routerLink]="['/lessons']"
          class="bg-surface-subtle border-border text-ink-subtle hover:border-primary-light hover:text-primary-light inline-flex items-center gap-1.5 rounded-full border px-4 py-2 text-[13px] font-semibold no-underline transition-all duration-200 hover:bg-[rgba(var(--color-primary-rgb),0.12)]"
        >
          <ng-icon name="bootstrapMortarboard"></ng-icon>
          تصفح الدروس
        </a>
      </div>
    }
  </div>
</main>
