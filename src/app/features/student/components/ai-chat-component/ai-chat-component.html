<div
  class="dir-rtl fixed start-6 bottom-6 z-9000"
  [class.open]="isOpen()"
  id="chatbot-widget"
>
  <!-- Chat Panel -->
  <div
    class="absolute start-0 bottom-17 flex w-80 origin-bottom-left flex-col overflow-hidden rounded-3xl border transition-all duration-300 ease-out max-[480px]:fixed max-[480px]:start-4 max-[480px]:end-4 max-[480px]:bottom-21 max-[480px]:w-auto"
    style="
      background: var(--color-surface);
      border-color: var(--color-border);
      box-shadow:
        0 16px 64px rgba(0, 0, 0, 0.35),
        0 4px 16px var(--color-primary-glow);
    "
    [class.opacity-100]="isOpen()"
    [class.scale-100]="isOpen()"
    [class.translate-y-0]="isOpen()"
    [class.pointer-events-auto]="isOpen()"
    [class.opacity-0]="!isOpen()"
    [class.scale-90]="!isOpen()"
    [class.translate-y-3]="!isOpen()"
    [class.pointer-events-none]="!isOpen()"
    id="chatbot-panel"
    role="dialog"
    aria-label="مساعد بريزما أكاديمي"
    [attr.aria-hidden]="!isOpen()"
  >
    <!-- Header -->
    <div
      class="flex flex-shrink-0 items-center justify-between px-5 py-4"
      style="background: var(--color-primary)"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full bg-white/25 text-lg font-bold text-white"
          aria-hidden="true"
        >
          م
        </div>
        <div>
          <div class="text-base leading-snug font-bold text-white">مساعد بريزما أكاديمي</div>
          <div
            class="mt-0.5 flex items-center gap-1.5 text-xs text-white/80 before:h-2 before:w-2 before:flex-shrink-0 before:rounded-full before:content-['']"
            style="--tw-content: ''"
            [style.before.background]="'var(--color-mint)'"
          >
            متاح الآن
          </div>
        </div>
      </div>

      <!-- Close Button -->
      <button
        class="flex cursor-pointer items-center justify-center rounded-full border-none bg-none p-1.5 text-white/75 transition-colors duration-150 hover:bg-white/15 hover:text-white"
        id="chatbot-close"
        type="button"
        (click)="closePanel()"
        aria-label="إغلاق"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6L6 18M6 6L18 18"></path>
        </svg>
      </button>
    </div>

    <!-- Messages Container -->
    <div
      #messagesContainer
      class="dataset-scrollbar flex max-h-65 min-h-35 flex-1 flex-col gap-3.5 overflow-y-auto scroll-smooth p-5"
      id="chatbot-messages"
      role="log"
      aria-live="polite"
    >
      <!-- Welcome Message -->
      <div class="flex animate-[fadeIn_250ms_ease-out_both] flex-row justify-start">
        <div
          class="max-w-[85%] rounded-[18px] rounded-tr-sm px-4 py-2.5 text-xs leading-relaxed"
          style="background: var(--color-surface-subtle); color: var(--color-ink)"
        >
          أهلاً! أنا مساعد بريزما أكاديمي. كيف أقدر أساعدك؟
        </div>
      </div>

      <!-- Message History Loops -->
      @for (msg of messages(); track msg.messageId) {
        @if (msg.messageText) {
          <div
            class="flex animate-[fadeIn_250ms_ease-out_both]"
            [class.flex-row]="msg.ChatRole === 'assistant'"
            [class.flex-row-reverse]="msg.ChatRole === 'user'"
          >
            <div
              class="max-w-[85%] rounded-[18px] px-4 py-2.5 text-xs leading-relaxed"
              [style.background]="
                msg.ChatRole === 'assistant'
                  ? 'var(--color-surface-subtle)'
                  : 'var(--color-primary)'
              "
              [style.color]="msg.ChatRole === 'assistant' ? 'var(--color-ink)' : '#fff'"
              [class.rounded-tr-sm]="msg.ChatRole === 'assistant'"
              [class.rounded-tl-sm]="msg.ChatRole === 'user'"
              [innerHTML]="msg.messageText | markdown"
            ></div>
          </div>
        }
      }

      <!-- Typing Indicator -->
      @if (isStreaming()) {
        <div class="flex animate-[fadeIn_250ms_ease-out_both] flex-row justify-start">
          <div
            class="flex w-fit items-center gap-1.5 rounded-[18px] rounded-tr-sm px-4 py-3"
            style="background: var(--color-surface-subtle)"
          >
            <span
              class="block h-1.5 w-1.5 animate-[bounce_1.2s_infinite_ease-in-out] rounded-full"
              style="background: var(--color-muted)"
            ></span>
            <span
              class="block h-1.5 w-1.5 animate-[bounce_1.2s_infinite_ease-in-out_0.2s] rounded-full"
              style="background: var(--color-muted)"
            ></span>
            <span
              class="block h-1.5 w-1.5 animate-[bounce_1.2s_infinite_ease-in-out_0.4s] rounded-full"
              style="background: var(--color-muted)"
            ></span>
          </div>
        </div>
      }

      <!-- Error State -->
      @if (error()) {
        <div class="flex animate-[fadeIn_250ms_ease-out_both] flex-row justify-start">
          <div
            class="max-w-[85%] rounded-[18px] rounded-tr-sm px-4 py-2.5 text-xs leading-relaxed"
            style="color: var(--coral, #ef4444); background-color: rgba(239, 68, 68, 0.06)"
          >
            {{ error() }}
          </div>
        </div>
      }
    </div>

    <!-- Quick Chips Grid -->
    <div
      class="grid flex-shrink-0 grid-cols-2 gap-2.5 border-t p-3 pb-4"
      style="border-color: var(--color-border)"
      id="chatbot-quick"
      [class.hidden]="messages().length > 0"
    >
      @for (q of quickQuestions; track q) {
        <button
          class="hover:text-opacity-80 cursor-pointer overflow-hidden rounded-full border bg-transparent px-2.5 py-2 text-center text-xs font-semibold text-ellipsis whitespace-nowrap transition-all duration-150 hover:bg-black/5 active:scale-95"
          style="
            border-color: var(--color-border);
            color: var(--color-primary-light);
            font-family: var(--font);
          "
          type="button"
          [disabled]="isStreaming()"
          (click)="handleQuickQuestion(q)"
        >
          {{ q }}
        </button>
      }
    </div>

    <!-- Input Row -->
    <div
      class="flex flex-shrink-0 items-center gap-2.5 border-t p-3.5"
      style="border-color: var(--color-border); background: var(--color-surface)"
    >
      <!-- Send Button -->
      <button
        class="hover:bg-primary hover:border-primary disabled:border-border flex h-10 w-10 flex-shrink-0 cursor-pointer items-center justify-center rounded-full border bg-white/5 transition-all duration-200 hover:text-white active:scale-95 disabled:transform-none disabled:cursor-not-allowed disabled:bg-transparent disabled:opacity-40"
        style="border-color: var(--color-border); color: var(--color-primary-light)"
        id="chatbot-send"
        type="button"
        (click)="handleSend()"
        [disabled]="!userInput().trim() || isStreaming()"
        aria-label="إرسال"
      >
        <svg
          class="h-4.5 w-4.5 -scale-x-100"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 3L12 12M21 3L14.5 21L12 12M21 3L3 9.5L12 12"></path>
        </svg>
      </button>

      <!-- Text Input -->
      <input
        class="dir-rtl flex-1 rounded-[22px] border px-4 py-2.5 text-right text-xs transition-all duration-200 outline-none disabled:opacity-60"
        style="
          background: var(--color-surface-subtle);
          border-color: var(--color-border);
          color: var(--color-ink);
          font-family: var(--font);
        "
        id="chatbot-input"
        type="text"
        [(ngModel)]="userInput"
        (keydown.enter)="userInput().trim() && !isStreaming() && handleSend()"
        placeholder="اكتب سؤالك هنا…"
        autocomplete="off"
        [disabled]="isStreaming()"
        aria-label="رسالة"
      />
    </div>
  </div>

  <!-- Launcher Floating Bubble -->
  <button
    class="relative flex h-14 w-14 cursor-pointer items-center justify-center rounded-full border-none text-white transition-all duration-200 ease-out hover:scale-108"
    style="
      background: var(--color-primary);
      box-shadow:
        0 4px 20px var(--color-primary-glow),
        0 2px 8px rgba(0, 0, 0, 0.2);
    "
    [class.before:absolute]="!isOpen()"
    [class.before:-inset-1]="!isOpen()"
    [class.before:rounded-full]="!isOpen()"
    [class.before:border-2]="!isOpen()"
    [class.before:border-primary]="!isOpen()"
    [class.before:animate-ping]="!isOpen()"
    id="chatbot-bubble"
    type="button"
    (click)="togglePanel()"
    aria-label="افتح مساعد الدعم"
    [attr.aria-expanded]="isOpen()"
  >
    <svg
      class="h-6 w-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 12H8.01M12 12H12.01M16 12H16.01"></path>
      <path
        d="M20 12C20 16.418 16.418 20 12 20C10.535 20 9.157 19.601 7.975 18.903L4 20L5.097 16.025C4.399 14.843 4 13.465 4 12C4 7.582 7.582 4 12 4C16.418 4 20 7.582 20 12Z"
      ></path>
    </svg>
  </button>
</div>
