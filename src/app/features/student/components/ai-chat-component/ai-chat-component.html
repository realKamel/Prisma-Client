<div class="fixed bottom-6 left-6 z-9000 dir-rtl" [class.open]="isOpen()" id="chatbot-widget">
  <!-- Chat Panel -->
  <div
    class="absolute bottom-17 left-0 w-80 border rounded-3xl flex flex-col overflow-hidden origin-bottom-left transition-all duration-300 ease-out max-[480px]:fixed max-[480px]:bottom-21 max-[480px]:left-4 max-[480px]:right-4 max-[480px]:w-auto"
    style="
      background: var(--color-surface);
      border-color: var(--color-border);
      box-shadow:
        0 16px 64px rgba(0, 0, 0, 0.35),
        0 4px 16px var(--color-primary-glow);
    "
    [class.opacity-100]="isOpen()"
    [class.scale-100]="isOpen()"
    [class.translate-y-0]="isOpen()"
    [class.pointer-events-auto]="isOpen()"
    [class.opacity-0]="!isOpen()"
    [class.scale-90]="!isOpen()"
    [class.translate-y-3]="!isOpen()"
    [class.pointer-events-none]="!isOpen()"
    id="chatbot-panel"
    role="dialog"
    aria-label="مساعد بريزما أكاديمي"
    [attr.aria-hidden]="!isOpen()"
  >
    <!-- Header -->
    <div
      class="flex items-center justify-between px-5 py-4 flex-shrink-0"
      style="background: var(--color-primary)"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-full bg-white/25 flex items-center justify-center text-lg font-bold text-white flex-shrink-0"
          aria-hidden="true"
        >
          م
        </div>
        <div>
          <div class="text-base font-bold text-white leading-snug">مساعد بريزما أكاديمي</div>
          <div
            class="text-xs text-white/80 flex items-center gap-1.5 mt-0.5 before:content-[''] before:w-2 before:h-2 before:rounded-full before:flex-shrink-0"
            style="--tw-content: ''"
            [style.before.background]="'var(--color-mint)'"
          >
            متاح الآن
          </div>
        </div>
      </div>

      <!-- Close Button -->
      <button
        class="bg-none border-none text-white/75 cursor-pointer p-1.5 rounded-full flex items-center justify-center transition-colors duration-150 hover:text-white hover:bg-white/15"
        id="chatbot-close"
        type="button"
        (click)="closePanel()"
        aria-label="إغلاق"
      >
        <svg
          class="w-5 h-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M18 6L6 18M6 6L18 18"></path>
        </svg>
      </button>
    </div>

    <!-- Messages Container -->
    <div
      #messagesContainer
      class="flex-1 overflow-y-auto p-5 flex flex-col gap-3.5 max-h-65 min-h-35 scroll-smooth dataset-scrollbar"
      id="chatbot-messages"
      role="log"
      aria-live="polite"
    >
      <!-- Welcome Message -->
      <div class="flex flex-row justify-start animate-[fadeIn_250ms_ease-out_both]">
        <div
          class="max-w-[85%] px-4 py-2.5 text-xs leading-relaxed rounded-[18px] rounded-tr-sm"
          style="background: var(--color-surface-subtle); color: var(--color-ink)"
        >
          أهلاً! أنا مساعد بريزما أكاديمي. كيف أقدر أساعدك؟
        </div>
      </div>

      <!-- Message History Loops -->
      @for (msg of messages(); track msg.messageId) {
        @if (msg.messageText) {
          <div
            class="flex animate-[fadeIn_250ms_ease-out_both]"
            [class.flex-row]="msg.ChatRole === 'assistant'"
            [class.flex-row-reverse]="msg.ChatRole === 'user'"
          >
            <div
              class="max-w-[85%] px-4 py-2.5 text-xs leading-relaxed rounded-[18px]"
              [style.background]="
                msg.ChatRole === 'assistant' ? 'var(--color-surface-subtle)' : 'var(--color-primary)'
              "
              [style.color]="msg.ChatRole === 'assistant' ? 'var(--color-ink)' : '#fff'"
              [class.rounded-tr-sm]="msg.ChatRole === 'assistant'"
              [class.rounded-tl-sm]="msg.ChatRole === 'user'"
              [innerHTML]="msg.messageText | markdown"
            ></div>
          </div>
        }
      }

      <!-- Typing Indicator -->
      @if (isStreaming()) {
        <div class="flex flex-row justify-start animate-[fadeIn_250ms_ease-out_both]">
          <div
            class="flex items-center gap-1.5 px-4 py-3 rounded-[18px] rounded-tr-sm w-fit"
            style="background: var(--color-surface-subtle)"
          >
            <span
              class="w-1.5 h-1.5 rounded-full block animate-[bounce_1.2s_infinite_ease-in-out]"
              style="background: var(--color-muted)"
            ></span>
            <span
              class="w-1.5 h-1.5 rounded-full block animate-[bounce_1.2s_infinite_ease-in-out_0.2s]"
              style="background: var(--color-muted)"
            ></span>
            <span
              class="w-1.5 h-1.5 rounded-full block animate-[bounce_1.2s_infinite_ease-in-out_0.4s]"
              style="background: var(--color-muted)"
            ></span>
          </div>
        </div>
      }

      <!-- Error State -->
      @if (error()) {
        <div class="flex flex-row justify-start animate-[fadeIn_250ms_ease-out_both]">
          <div
            class="max-w-[85%] px-4 py-2.5 text-xs leading-relaxed rounded-[18px] rounded-tr-sm"
            style="color: var(--coral, #ef4444); background-color: rgba(239, 68, 68, 0.06)"
          >
            {{ error() }}
          </div>
        </div>
      }
    </div>

    <!-- Quick Chips Grid -->
    <div
      class="p-3 pb-4 grid grid-cols-2 gap-2.5 border-t flex-shrink-0"
      style="border-color: var(--color-border)"
      id="chatbot-quick"
      [class.hidden]="messages().length > 0"
    >
      @for (q of quickQuestions; track q) {
        <button
          class="bg-transparent border rounded-full py-2 px-2.5 text-xs font-semibold cursor-pointer text-center whitespace-nowrap text-ellipsis overflow-hidden transition-all duration-150 active:scale-95 hover:bg-black/5 hover:text-opacity-80"
          style="border-color: var(--color-border); color: var(--color-primary-light); font-family: var(--font)"
          type="button"
          [disabled]="isStreaming()"
          (click)="handleQuickQuestion(q)"
        >
          {{ q }}
        </button>
      }
    </div>

    <!-- Input Row -->
    <div
      class="flex items-center gap-2.5 p-3.5 border-t flex-shrink-0"
      style="border-color: var(--color-border); background: var(--color-surface)"
    >
      <!-- Send Button -->
      <button
        class="w-10 h-10 rounded-full bg-white/5 border cursor-pointer flex items-center justify-center flex-shrink-0 transition-all duration-200 active:scale-95 hover:bg-primary hover:text-white hover:border-primary disabled:bg-transparent disabled:border-border disabled:opacity-40 disabled:cursor-not-allowed disabled:transform-none"
        style="border-color: var(--color-border); color: var(--color-primary-light)"
        id="chatbot-send"
        type="button"
        (click)="handleSend()"
        [disabled]="!userInput().trim() || isStreaming()"
        aria-label="إرسال"
      >
        <svg
          class="w-4.5 h-4.5 -scale-x-100"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 3L12 12M21 3L14.5 21L12 12M21 3L3 9.5L12 12"></path>
        </svg>
      </button>

      <!-- Text Input -->
      <input
        class="flex-1 border rounded-[22px] py-2.5 px-4 text-xs outline-none text-right dir-rtl transition-all duration-200 disabled:opacity-60"
        style="
          background: var(--color-surface-subtle);
          border-color: var(--color-border);
          color: var(--color-ink);
          font-family: var(--font);
        "
        id="chatbot-input"
        type="text"
        [(ngModel)]="userInput"
        (keydown.enter)="userInput().trim() && !isStreaming() && handleSend()"
        placeholder="اكتب سؤالك هنا…"
        autocomplete="off"
        [disabled]="isStreaming()"
        aria-label="رسالة"
      />
    </div>
  </div>

  <!-- Launcher Floating Bubble -->
  <button
    class="w-14 h-14 rounded-full border-none cursor-pointer flex items-center justify-center text-white relative transition-all duration-200 ease-out hover:scale-108"
    style="
      background: var(--color-primary);
      box-shadow:
        0 4px 20px var(--color-primary-glow),
        0 2px 8px rgba(0, 0, 0, 0.2);
    "
    [class.before:absolute]="!isOpen()"
    [class.before:-inset-1]="!isOpen()"
    [class.before:rounded-full]="!isOpen()"
    [class.before:border-2]="!isOpen()"
    [class.before:border-primary]="!isOpen()"
    [class.before:animate-ping]="!isOpen()"
    id="chatbot-bubble"
    type="button"
    (click)="togglePanel()"
    aria-label="افتح مساعد الدعم"
    [attr.aria-expanded]="isOpen()"
  >
    <svg
      class="w-6 h-6"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M8 12H8.01M12 12H12.01M16 12H16.01"></path>
      <path
        d="M20 12C20 16.418 16.418 20 12 20C10.535 20 9.157 19.601 7.975 18.903L4 20L5.097 16.025C4.399 14.843 4 13.465 4 12C4 7.582 7.582 4 12 4C16.418 4 20 7.582 20 12Z"
      ></path>
    </svg>
  </button>
</div>
