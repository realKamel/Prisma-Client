<section>
  <div
    class="border-border rounded-card relative flex items-center justify-between gap-8 overflow-hidden border p-12 max-[880px]:flex-col max-[880px]:items-start max-[880px]:p-8"
    style="
      background:
        radial-gradient(ellipse at 15% 50%, rgba(78, 203, 141, 0.18) 0%, transparent 55%),
        radial-gradient(
          ellipse at 85% 50%,
          rgba(var(--color-primary-rgb), 0.32) 0%,
          transparent 55%
        ),
        var(--color-surface);
    "
  >
    <!-- top accent line: mint → purple-lt -->
    <!--<span
      class="absolute top-0 start-0 end-0 h-0.5 bg-gradient-to-r from-transparent via-mint to-primary-light opacity-60 pointer-events-none"
    ></span>-->

    <!-- Text -->
    <div class="flex flex-1 flex-col gap-2">
      <span class="text-mint text-xs tracking-[0.08em] uppercase">// شوف المزيد</span>
      <h2 class="text-[clamp(20px,2.6vw,28px)] font-black tracking-tight">
        دروس <span class="text-primary-light">جديدة</span> متاحة الآن
      </h2>
      <p class="text-muted) max-w-130 text-base leading-relaxed">
        اتصفح مكتبة الدروس الكاملة، اختار اللي يناسب مستواك، وابدأ التعلم في أي وقت. كل درس بكود
        لمرة واحدة فقط.
      </p>
    </div>

    <!-- CTA with shine sweep -->
    <div>
      <a
        routerLink="/lessons"
        class="group bg-primary relative inline-flex items-center justify-center gap-2 overflow-hidden rounded-full px-7 py-3 text-base font-bold text-white shadow-[0_4px_24px_var(--color-primary-glow)] transition-[transform,box-shadow] duration-[150ms] [transition-timing-function:var(--ease-spring)] hover:scale-[1.04] hover:shadow-[0_10px_36px_rgba(var(--color-primary-rgb),0.51)] active:scale-[0.97]"
      >
        <span
          class="transition-end pointer-events-none absolute end-[-110%] top-0 bottom-0 w-1/2 bg-linear-to-r from-transparent via-white/20 to-transparent duration-500 ease-out group-hover:end-[120%]"
        ></span>
        <ng-icon name="bootstrapGrid3x3GapFill"></ng-icon>
        اتصفح المكتبة
      </a>
    </div>
  </div>
</section>
