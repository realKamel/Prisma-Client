<section class="flex items-center justify-between gap-6 mb-10 flex-wrap">
  <!-- Greeting -->
  <div class="flex flex-col gap-2">
    <h1 class="text-[clamp(28px,4vw,40px)] font-black tracking-[-1px] leading-tight">
      أهلاً يا
      <span class="text-primary-light">{{ student().firstName }}!</span>
      <!-- wave emoji with keyframe animation defined in global CSS -->
      <span
        class="inline-flex items-center gap-2 text-xs font-bold text-primary-light bg-[rgba(var(--color-primary-rgb),0.12)] border border-border px-3 py-1 rounded-full mx-2 align-middle"
      >
        {{ student().gradeLabel }}
      </span>
    </h1>
  </div>

  <!-- Streak meter -->
  @if (this.streak().count > 0) {
    <div
      class="flex items-center gap-4 bg-surface border border-border rounded-3xl px-6 py-4 shadow-sm relative overflow-hidden shrink-0"
      aria-label="سلسلة المذاكرة"
    >
      <!-- top accent line: star → coral gradient matching original -->
      <span
        class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-transparent via-star to-coral opacity-70 pointer-events-none"
      ></span>
      <!-- 7-day dots -->
      <div class="flex gap-1 border-r border-border pr-4 mr-2">
        @for (day of weekDays; track day) {
          <span
            class="w-3 h-3 rounded-sm transition-all"
            [class]="{
              'bg-star shadow-[0_0_8px_rgba(247,201,72,0.38)]': day.done && !day.isToday,
              'bg-primary-light outline outline-2 outline-offset-2 outline-primary': day.isToday,
              'bg-[rgba(var(--color-primary-rgb),0.18)]': !day.done && !day.isToday,
            }"
            [title]="day.label"
          >
          </span>
        }
      </div>
      <!-- flame icon — keyframe defined in global CSS -->
      <span
        class="text-[32px] [animation:flame_2.2s_ease-in-out_infinite] drop-shadow-[0_0_12px_rgba(247,201,72,0.55)] text-star"
      >
        <ng-icon name="lucideFlame"></ng-icon>
      </span>
      <!-- count -->
      <div>
        <div class="text-[28px] font-black leading-none text-ink">{{ streak().count }} أيام</div>
        <div class="text-xs text-muted mt-1">سلسلة متواصلة</div>
      </div>
    </div>
  }
</section>
