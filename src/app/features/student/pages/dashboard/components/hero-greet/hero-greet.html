<section class="mb-10 flex flex-wrap items-center justify-between gap-6">
  <!-- Greeting -->
  <div class="flex flex-col gap-2">
    <h1 class="text-[clamp(28px,4vw,40px)] leading-tight font-black tracking-[-1px]">
      أهلاً يا
      <span class="text-primary-light">{{ student().firstName }}!</span>
      <!-- wave emoji with keyframe animation defined in global CSS -->
      <span
        class="text-primary-light border-border mx-2 inline-flex items-center gap-2 rounded-full border bg-[rgba(var(--color-primary-rgb),0.12)] px-3 py-1 align-middle text-xs font-bold"
      >
        {{ student().gradeLabel }}
      </span>
    </h1>
  </div>

  <!-- Streak meter -->
  @if (this.streak().count > 0) {
    <div
      class="bg-surface border-border relative flex shrink-0 items-center gap-4 overflow-hidden rounded-3xl border px-6 py-4 shadow-sm"
      aria-label="سلسلة المذاكرة"
    >
      <!-- top accent line: star → coral gradient matching original -->
      <span
        class="via-star to-coral pointer-events-none absolute top-0 right-0 left-0 h-0.5 bg-gradient-to-r from-transparent opacity-70"
      ></span>
      <!-- 7-day dots -->
      <div class="border-border me-2 flex gap-1 border-r pr-4">
        @for (day of weekDays; track day) {
          <span
            class="h-3 w-3 rounded-sm transition-all"
            [class]="{
              'bg-star shadow-[0_0_8px_rgba(247,201,72,0.38)]': day.done && !day.isToday,
              'bg-primary-light outline-primary outline outline-2 outline-offset-2': day.isToday,
              'bg-[rgba(var(--color-primary-rgb),0.18)]': !day.done && !day.isToday,
            }"
            [title]="day.label"
          >
          </span>
        }
      </div>
      <!-- flame icon — keyframe defined in global CSS -->
      <span
        class="text-star [animation:flame_2.2s_ease-in-out_infinite] text-[32px] drop-shadow-[0_0_12px_rgba(247,201,72,0.55)]"
      >
        <ng-icon name="lucideFlame"></ng-icon>
      </span>
      <!-- count -->
      <div>
        <div class="text-ink text-[28px] leading-none font-black">{{ streak().count }} أيام</div>
        <div class="text-muted mt-1 text-xs">سلسلة متواصلة</div>
      </div>
    </div>
  }
</section>
