<section class="mb-14">
  <!-- Section heading -->
  <div class="flex items-end justify-between gap-4 mb-5">
    <h2 class="text-2xl font-black tracking-tight">دروسك المشتراة</h2>
    <a
      routerLink="/lessons"
      class="group text-xs font-bold text-primary-light inline-flex items-center gap-2 hover:text-lavender transition-colors duration-180"
    >
      المزيد
      <ng-icon
        name="bootstrapArrowLeft"
        class="transition-transform duration-220 ease-spring group-hover:-translate-x-1"
      >
      </ng-icon>
    </a>
  </div>

  <!-- Filter chips — smooth tabs animation with active pill -->
  <div class="flex items-center gap-2 flex-wrap mb-5">
    @for (f of filters; track f.key) {
      <button
        (click)="activeFilter.set(f.key)"
        class="group relative inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold border transition-colors duration-200"
        [class]="
          activeFilter() === f.key
            ? 'text-white border-primary'
            : 'bg-surface text-muted border-border hover:text-ink hover:border-border-focus'
        "
      >
        @if (activeFilter() === f.key) {
          <div
            ngmMotion
            [layoutId]="'activeFilterPill'"
            [layoutDependency]="activeFilter()"
            [initial]="false"
            [transition]="{ type: 'spring', stiffness: 380, damping: 30 }"
            class="absolute inset-0 bg-primary rounded-full shadow-[0_4px_16px_var(--color-primary-glow)] z-0"
          ></div>
        }
        <span class="relative z-10">{{ f.label }}</span>
        <span
          class="relative z-10 inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-black transition-colors duration-200"
          [class]="
            activeFilter() === f.key
              ? 'bg-white/20 text-white'
              : 'bg-[rgba(var(--color-primary-rgb),0.14)] text-primary-light'
          "
        >
          {{ getCount(f.key) }}
        </span>
      </button>
    }
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-3 gap-5 max-[1080px]:grid-cols-2 max-[640px]:grid-cols-1">
    @for (lesson of filteredLessons(); track lesson.id) {
      <div
        ngmMotion
        [layout]="'position'"
        [initial]="{ opacity: 0, scale: 0.95 }"
        [animate]="{ opacity: 1, scale: 1 }"
        [exit]="{ opacity: 0, scale: 0.95 }"
        [transition]="{ type: 'spring', stiffness: 350, damping: 28 }"
      >
        <app-lesson-card
          class="block transition-transform duration-320 ease-spring hover:-translate-y-1"
          [lesson]="lesson"
          (ctaClick)="lessonCta.emit($event)"
        >
        </app-lesson-card>
      </div>
    }
  </div>

  <!-- Empty state -->
  @if (filteredLessons().length === 0) {
    <div
      ngmMotion
      [initial]="{ opacity: 0, scale: 0.95 }"
      [animate]="{ opacity: 1, scale: 1 }"
      [exit]="{ opacity: 0, scale: 0.95 }"
      [transition]="{ type: 'spring', stiffness: 300, damping: 25 }"
      class="flex flex-col items-center justify-center py-16 text-muted"
    >
      <ng-icon name="bootstrapInbox" class="text-4xl mb-3"></ng-icon>
      <p class="text-sm">لا توجد دروس في هذا التصنيف</p>
    </div>
  }
</section>
