<section class="mb-14">
  <!-- Section heading -->
  <div class="flex items-end justify-between gap-4 mb-5">
    <h2 class="text-2xl font-black tracking-tight">دروسك المشتراة</h2>
    <a
      routerLink="/lessons"
      class="group text-xs font-bold text-primary-light inline-flex items-center gap-2 hover:text-lavender transition-colors duration-180"
    >
      المزيد
      <ng-icon
        name="bootstrapArrowLeft"
        class="transition-transform duration-[220ms] [transition-timing-function:var(--ease-spring)] group-hover:-translate-x-1"
      >
      </ng-icon>
    </a>
  </div>

  <!-- Filter chips — stagger reveal at 60ms -->
  <div class="flex items-center gap-2 flex-wrap mb-5" style="--d: 60ms">
    @for (f of filters; track f) {
      <button
        (click)="activeFilter = f.key"
        class="group relative overflow-hidden inline-flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold border transition-all duration-200"
        [class]="
          activeFilter === f.key
            ? 'bg-primary text-white border-primary shadow-[0_4px_16px_var(--color-primary-glow)]'
            : 'bg-surface text-muted border-border hover:text-ink hover:border-border-focus'
        "
      >
        <!-- ripple layer (JS adds .ripple elements; keep overflow-hidden on parent) -->
        {{ f.label }}
        <span
          class="inline-flex items-center justify-center w-5 h-5 rounded-full text-[10px] font-black"
          [class]="
            activeFilter === f.key
              ? 'bg-white/20 text-white'
              : 'bg-[rgba(var(--color-primary-rgb),0.14)] text-primary-light'
          "
        >
          {{ getCount(f.key) }}
        </span>
      </button>
    }
  </div>

  <!-- Grid — cards carry their own .reveal + staggered --d -->
  <div class="grid grid-cols-3 gap-5 max-[1080px]:grid-cols-2 max-[640px]:grid-cols-1">
    @for (lesson of filteredLessons; track lesson; let i = $index) {
      <app-lesson-card
        class="transition-transform duration-320 ease-spring hover:-translate-y-1"
        [lesson]="lesson"
        [style.--d]="(i % 3) * 60 + 'ms'"
        (ctaClick)="lessonCta.emit($event)"
      >
      </app-lesson-card>
    }
  </div>

  <!-- Empty state -->
  @if (filteredLessons.length === 0) {
    <div class="flex flex-col items-center justify-center py-16 text-muted">
      <ng-icon name="bootstrapInbox" class="text-4xl mb-3"></ng-icon>
      <p class="text-sm">لا توجد دروس في هذا التصنيف</p>
    </div>
  }
</section>
