<section class="mb-14">
  <!-- Section heading -->
  <div class="mb-5 flex items-end justify-between gap-4">
    <h2 class="text-2xl font-black tracking-tight">دروسك المشتراة</h2>
    <a
      routerLink="/lessons"
      class="group text-primary-light hover:text-lavender inline-flex items-center gap-2 text-xs font-bold transition-colors duration-180"
    >
      المزيد
      <ng-icon
        name="bootstrapArrowLeft"
        class="ease-spring transition-transform duration-220 group-hover:-translate-x-1"
      >
      </ng-icon>
    </a>
  </div>

  <!-- Filter chips — smooth tabs animation with active pill -->
  <div class="mb-5 flex flex-wrap items-center gap-2">
    @for (f of filters; track f.key) {
      <button
        (click)="activeFilter.set(f.key)"
        class="group relative inline-flex items-center gap-2 rounded-full border px-4 py-2 text-xs font-bold transition-colors duration-200"
        [class]="
          activeFilter() === f.key
            ? 'border-primary text-white'
            : 'bg-surface text-muted border-border hover:text-ink hover:border-border-focus'
        "
      >
        @if (activeFilter() === f.key) {
          <div
            ngmMotion
            [layoutId]="'activeFilterPill'"
            [layoutDependency]="activeFilter()"
            [initial]="false"
            [transition]="{ type: 'spring', stiffness: 380, damping: 30 }"
            class="bg-primary absolute inset-0 z-0 rounded-full shadow-[0_4px_16px_var(--color-primary-glow)]"
          ></div>
        }
        <span class="relative z-10">{{ f.label }}</span>
        <span
          class="relative z-10 inline-flex h-5 w-5 items-center justify-center rounded-full text-[10px] font-black transition-colors duration-200"
          [class]="
            activeFilter() === f.key
              ? 'bg-white/20 text-white'
              : 'text-primary-light bg-[rgba(var(--color-primary-rgb),0.14)]'
          "
        >
          {{ getCount(f.key) }}
        </span>
      </button>
    }
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-3 gap-5 max-[1080px]:grid-cols-2 max-[640px]:grid-cols-1">
    @for (lesson of filteredLessons(); track lesson.id) {
      <div
        ngmMotion
        [layout]="'position'"
        [initial]="{ opacity: 0, scale: 0.95 }"
        [animate]="{ opacity: 1, scale: 1 }"
        [exit]="{ opacity: 0, scale: 0.95 }"
        [transition]="{ type: 'spring', stiffness: 350, damping: 28 }"
      >
        <app-lesson-card
          class="ease-spring block transition-transform duration-320 hover:-translate-y-1"
          [lesson]="lesson"
          (ctaClick)="lessonCta.emit($event)"
        >
        </app-lesson-card>
      </div>
    }
  </div>

  <!-- Empty state -->
  @if (filteredLessons().length === 0) {
    <div
      ngmMotion
      [initial]="{ opacity: 0, scale: 0.95 }"
      [animate]="{ opacity: 1, scale: 1 }"
      [exit]="{ opacity: 0, scale: 0.95 }"
      [transition]="{ type: 'spring', stiffness: 300, damping: 25 }"
      class="text-muted flex flex-col items-center justify-center py-16"
    >
      <ng-icon
        name="bootstrapInbox"
        class="mb-3 text-4xl"
      ></ng-icon>
      <p class="text-sm">لا توجد دروس في هذا التصنيف</p>
    </div>
  }
</section>
