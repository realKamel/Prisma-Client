<!-- dashboard/components/stats-strip/stats-strip.component.html -->
<!--
  Input interface:
    stats: StatsDto  { purchasedLessons, completedLessons, studyHours, topQuizScore }

  Count-up is handled by CountUpDirective (see stats-strip.component.ts).
  Each tile has a staggered reveal delay matching the original (0 / 80 / 160 / 240ms).
-->

<section class="mb-14">
  <div class="mb-5 flex items-end justify-between gap-4">
    <h2 class="text-2xl font-black tracking-tight">
      كل رقم في <span class="text-primary-light">سطر</span>
    </h2>
  </div>

  <div class="grid grid-cols-4 gap-4 max-[880px]:grid-cols-2 max-[640px]:grid-cols-2">
    <!-- Purchased lessons — t-purple -->
    <div
      class="stat-tile bg-surface border-border rounded-20 ease-spring relative flex flex-col gap-2 overflow-hidden border p-6 transition-transform duration-320 hover:-translate-y-1"
      style="--d: 0ms"
    >
      <!-- glow blob top-right -->
      <span
        class="bg-primary-light pointer-events-none absolute end-0 top-0 h-15 w-15 rounded-full opacity-40 blur-2xl"
      ></span>
      <div
        class="text-primary-light mb-1 flex h-11 w-11 items-center justify-center rounded-xl bg-[rgba(var(--color-primary-rgb),0.16)]"
      >
        <ng-icon
          name="bootstrapJournalBookmarkFill"
          class="flex items-center text-xl"
        ></ng-icon>
      </div>
      <div
        class="text-ink text-3xl leading-none font-black tracking-tight"
        appCountUp
        [target]="stats().purchasedLessons"
      >
        0
      </div>
      <div class="text-ink font-bold tracking-[0.04em]">دروس مشتراة</div>
    </div>

    <!-- Completed lessons — t-mint -->
    <div
      class="stat-tile bg-surface border-border rounded-20 relative flex flex-col gap-2 overflow-hidden border p-6 transition-transform duration-[320ms] [transition-timing-function:var(--ease-spring)] hover:-translate-y-1"
      style="--d: 80ms"
    >
      <span
        class="bg--mint pointer-events-none absolute end-0 top-0 h-15 w-15 rounded-full opacity-40 blur-2xl"
      ></span>
      <div
        class="text-mint mb-1 flex h-11 w-11 items-center justify-center rounded-xl bg-[rgba(78,203,141,0.16)]"
      >
        <ng-icon
          name="bootstrapCheckCircleFill"
          class="flex items-center text-xl"
        ></ng-icon>
      </div>
      <div
        class="text-ink text-3xl leading-none font-black tracking-tight"
        appCountUp
        [target]="stats().completedLessons"
      >
        0
      </div>
      <div class="font-bold tracking-[0.04em]">دروس مكتملة</div>
    </div>

    <!-- Study hours — t-star -->
    <div
      class="stat-tile bg-surface border-border rounded-20 relative flex flex-col gap-2 overflow-hidden border p-6 transition-transform duration-[320ms] [transition-timing-function:var(--ease-spring)] hover:-translate-y-1"
      style="--d: 160ms"
    >
      <span
        class="bg-star pointer-events-none absolute end-0 top-0 h-15 w-15 rounded-full opacity-40 blur-2xl"
      ></span>
      <div
        class="text-star mb-1 flex h-11 w-11 items-center justify-center rounded-xl bg-[rgba(247,201,72,0.16)]"
      >
        <ng-icon
          name="bootstrapClockFill"
          class="flex items-center text-xl"
        ></ng-icon>
      </div>
      <div class="text-ink text-3xl leading-none font-black tracking-tight">
        <!-- <span class="text-base font-bold ms-1">ساعة</span> -->
        <span
          appCountUp
          [target]="stats().studyHours"
          >0</span
        >
      </div>
      <div class="font-bold tracking-[0.04em]">ساعات مذاكرة</div>
    </div>

    <!-- Top quiz score — t-coral -->
    <div
      class="stat-tile bg-surface border-border rounded-20 ease-spring relative flex flex-col gap-2 overflow-hidden border p-6 transition-transform duration-320 hover:-translate-y-1"
      style="--d: 240ms"
    >
      <span
        class="bg-coral pointer-events-none absolute end-0 top-0 h-15 w-15 rounded-full opacity-40 blur-2xl"
      ></span>
      <div
        class="text-coral mb-1 flex h-11 w-11 items-center justify-center rounded-xl bg-[rgba(240,106,106,0.16)]"
      >
        <ng-icon
          name="bootstrapTrophyFill"
          class="flex items-center text-xl"
        ></ng-icon>
      </div>
      <div class="text-ink text-3xl leading-none font-black tracking-tight">
        <span class="ms-1 text-base font-bold">٪</span>
        <span
          appCountUp
          [target]="stats().topQuizScore"
          >0</span
        >
      </div>
      <div class="font-bold tracking-[0.04em]">أعلى نتيجة كويز</div>
    </div>
  </div>
</section>
