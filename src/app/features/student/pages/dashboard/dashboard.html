<main class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8 text-right">
  <!-- Loading skeleton -->
  @if (loading()) {
    <div class="animate-pulse flex flex-col gap-10">
      <div class="h-16 bg-[var(--surface)] rounded-2xl w-1/2"></div>
      <div class="h-[240px] bg-[var(--surface)] rounded-[var(--radius-card)]"></div>
      <div class="grid grid-cols-3 gap-5">
        @for (i of [1, 2, 3]; track i) {
          <div class="h-[260px] bg-[var(--surface)] rounded-[var(--radius-card)]"></div>
        }
      </div>
    </div>
  }

  <!-- Error state -->
  @if (error() && !loading()) {
    <div class="flex flex-col items-center justify-center py-24 gap-4 text-muted">
      <ng-icon name="bootstrapWifiOff" class="text-5xl text-coral"></ng-icon>
      <p class="font-mono text-sm">حصل خطأ أثناء تحميل البيانات</p>
      <button
        (click)="loadDashboard()"
        class="bg-primary text-white rounded-full px-6 py-2 text-sm font-bold hover:opacity-90 transition-opacity"
      >
        حاول تاني
      </button>
    </div>
  }

  <!-- Loaded -->
  @if (data() && !loading()) {
    <!-- 1. Hero greeting + streak -->
    <app-hero-greet [student]="data().student" [streak]="data()?.streak"> </app-hero-greet>

    <!-- 2. Next lesson hero card -->
    <app-next-lesson-card [lesson]="data().nextLesson"> </app-next-lesson-card>

    <!-- 3. Purchased lessons grid -->
    <app-lessons-grid [lessons]="data().lessons" (lessonCta)="onLessonCta($event)">
    </app-lessons-grid>

    <!-- 4. Stats strip -->
    <app-stats-strip [stats]="data().stats"> </app-stats-strip>

    <!-- 5. Discover banner -->
    <app-discover-banner></app-discover-banner>
  }
  <!-- <ng-container *ngIf="data() && !loading">
</ng-container> -->
</main>
