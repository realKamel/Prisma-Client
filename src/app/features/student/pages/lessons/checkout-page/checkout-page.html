<main class="bg-main min-h-screen p-6 md:p-10">
  <div class="mx-auto max-w-175">
    <nav class="text-muted mb-6 flex items-center gap-2 text-xs font-semibold">
      <a
        routerLink="/home"
        class="hover:text-primary-light transition-colors"
        >الرئيسية</a
      >
      <span>›</span>
      <a
        routerLink="/lessons"
        class="hover:text-primary-light transition-colors"
        >مكتبة الدروس</a
      >
      <span>›</span>
      @if (lesson) {
        <span
          [routerLink]="['/lessons', lesson.id, 'details']"
          class="hover:text-primary-light max-w-40 truncate transition-colors"
          >{{ lesson.title }}</span
        >
      }
      <span>›</span>
      <a class="hover:text-primary-light transition-colors">طريقة الدفع</a>
    </nav>

    <div class="mb-8 text-center md:text-end">
      <p class="text-muted mb-1 text-sm font-bold">// اختار طريقة الدفع</p>
      <h1 class="text-ink mb-3 text-4xl font-black">
        افتح درس
        @if (lesson) {
          <span class="text-primary-light">{{ lesson.title }}</span>
        }
      </h1>
      <p class="text-muted text-sm">اختار الطريقة اللي تناسبك عشان تفتح الدرس وتبدأ على طول</p>
    </div>

    <app-lesson-context [id]="id()"></app-lesson-context>

    <div class="mb-6 flex flex-col gap-4 md:flex-row">
      @for (m of methods; track m) {
        <app-payment-method
          [data]="m"
          [selected]="selectedMethod === m.id"
          (select)="handleMethodSelection($event)"
        >
        </app-payment-method>
      }
    </div>

    <button
      (click)="continue()"
      class="fp-btn group flex items-center justify-center gap-3"
    >
      <span>متابعة</span>
      <ng-icon
        name="bootstrapArrowLeft"
        class="transition-transform duration-150 group-hover:translate-x-1"
      ></ng-icon>
    </button>

    <div class="mt-4 text-center">
      <a
        [routerLink]="['/lessons', this.id(), 'details']"
        class="text-muted hover:text-primary-light text-sm font-semibold transition-colors"
      >
        <ng-icon
          name="bootstrapChevronRight"
          class="ms-1"
        ></ng-icon>
        رجّع لتفاصيل الدرس
      </a>
    </div>
  </div>
</main>
