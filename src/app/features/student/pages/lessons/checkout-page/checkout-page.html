<main class="min-h-screen bg-main p-6 md:p-10">
  <div class="max-w-175 mx-auto">
    <nav class="flex items-center gap-2 text-xs text-muted mb-6 font-semibold">
      <a routerLink="/home" class="hover:text-primary-light transition-colors">الرئيسية</a>
      <span>›</span>
      <a routerLink="/lessons" class="hover:text-primary-light transition-colors"
        >مكتبة الدروس</a
      >
      <span>›</span>
      @if (lesson) {
        <span
          [routerLink]="['/lessons', lesson.id, 'details']"
          class="hover:text-primary-light transition-colors truncate max-w-40"
          >{{ lesson.title }}</span
        >
      }
      <span>›</span>
      <a class="hover:text-primary-light transition-colors">طريقة الدفع</a>
    </nav>

    <div class="mb-8 text-center md:text-right">
      <p class="text-sm font-bold text-muted mb-1">// اختار طريقة الدفع</p>
      <h1 class="text-4xl font-black text-ink mb-3">
        افتح درس
        @if (lesson) {
          <span class="text-primary-light">{{ lesson.title }}</span>
        }
      </h1>
      <p class="text-muted text-sm">
        اختار الطريقة اللي تناسبك عشان تفتح الدرس وتبدأ على طول
      </p>
    </div>

    <app-lesson-context [id]="id()"></app-lesson-context>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
      @for (m of methods; track m) {
        <app-payment-method
          [data]="m"
          [selected]="selectedMethod === m.id"
          (select)="handleMethodSelection($event)"
        >
        </app-payment-method>
      }
    </div>

    <button (click)="continue()" class="fp-btn flex items-center justify-center gap-3 group">
      <span>متابعة</span>
      <ng-icon
        name="bootstrapArrowLeft"
        class="transition-transform duration-150 group-hover:translate-x-1"
      ></ng-icon>
    </button>

    <div class="text-center mt-4">
      <a
        [routerLink]="['/lessons', this.id(), 'details']"
        class="text-sm text-muted hover:text-primary-light transition-colors font-semibold"
      >
        <ng-icon name="bootstrapChevronRight" class="ml-1"></ng-icon>
        رجّع لتفاصيل الدرس
      </a>
    </div>
  </div>
</main>
