@if (lessonService.currentLesson(); as lesson) {
  <div
    class="bg-surface-subtle border-border rounded-card relative mb-8 flex items-center gap-4 border p-5"
  >
    <div
      class="to-mint flex h-13 w-13 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-[#1f4a3a] text-2xl"
    >
      <ng-icon
        name="bootstrapLightningCharge"
        class="text-white"
      ></ng-icon>
    </div>
    <div class="min-w-0 flex-1">
      <div class="text-ink mb-1 truncate font-black">{{ lesson.title }}</div>
      <div class="text-muted flex items-center gap-2 text-xs font-semibold">
        <span
          class="bg-primary flex h-5 w-5 shrink-0 items-center justify-center rounded-full text-white"
          >{{ lesson.teacher[0] }}</span
        >
        {{ lesson.teacher }} · {{ lesson.duration }} · {{ lesson.chaptersCount }} فصول
      </div>
    </div>
    <div class="flex flex-row items-baseline">
      <span class="text-star ms-1 text-2xl font-black">{{ lesson.price }}</span>
      <span class="text-muted text-xs font-bold">جنيه</span>
    </div>
  </div>
} @else {
  <div
    class="bg-surface border-border rounded-card mb-8 flex animate-pulse items-center gap-4 border p-5"
  >
    <div class="bg-border h-13 w-13 shrink-0 rounded-2xl"></div>
    <div class="flex-1 space-y-2">
      <div class="bg-border h-4 w-3/4 rounded"></div>
      <div class="bg-border h-3 w-1/2 rounded"></div>
    </div>
    <div class="bg-border h-6 w-12 rounded"></div>
  </div>
}
