@if (lessonService.currentLesson(); as lesson) {
  <div
    class="flex items-center gap-4 bg-surface-subtle border border-border rounded-card p-5 mb-8 relative"
  >
    <div
      class="w-13 h-13 rounded-2xl bg-gradient-to-br from-[#1f4a3a] to-mint flex items-center justify-center text-2xl shrink-0"
    >
      <ng-icon name="bootstrapLightningCharge" class="text-white"></ng-icon>
    </div>
    <div class="flex-1 min-w-0">
      <div class="font-black text-ink mb-1 truncate">{{ lesson.title }}</div>
      <div class="flex items-center gap-2 text-xs font-semibold text-muted">
        <span
          class="w-5 h-5 rounded-full bg-primary flex items-center justify-center text-white shrink-0"
          >{{ lesson.teacher[0] }}</span
        >
        {{ lesson.teacher }} · {{ lesson.duration }} · {{ lesson.chaptersCount }} فصول
      </div>
    </div>
    <div class="flex flex-row items-baseline">
      <span class="text-2xl font-black text-star ml-1">{{ lesson.price }}</span>
      <span class="text-xs font-bold text-muted">جنيه</span>
    </div>
  </div>
} @else {
  <div
    class="flex items-center gap-4 bg-surface border border-border rounded-card p-5 mb-8 animate-pulse"
  >
    <div class="w-13 h-13 rounded-2xl bg-border shrink-0"></div>
    <div class="flex-1 space-y-2">
      <div class="h-4 bg-border rounded w-3/4"></div>
      <div class="h-3 bg-border rounded w-1/2"></div>
    </div>
    <div class="h-6 bg-border rounded w-12"></div>
  </div>
}
