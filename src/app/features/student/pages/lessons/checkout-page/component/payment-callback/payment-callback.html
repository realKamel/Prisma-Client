<main class="min-h-screen p-6">
  <div class="mx-auto max-w-130 py-10 text-center">
    <!-- Success -->
    @if (state() === 'success') {
      <div>
        <div
          class="mx-auto mb-7 flex h-24 w-24 animate-bounce items-center justify-center rounded-full border-[12px] border-[rgba(78,203,141,0.06)] bg-[rgba(78,203,141,0.12)]"
        >
          <ng-icon
            name="bootstrapCheckLg"
            class="text-mint flex items-center text-4xl"
          ></ng-icon>
        </div>
        <h1 class="text-ink mb-2.5 text-3xl font-black">تم الدفع بنجاح!</h1>
        <p class="text-muted mx-auto mb-8 max-w-95 text-base">
          الدرس اتفتحلك — ابدأ على طول وذاكر بقى
        </p>
        <div
          class="bg-surface rounded-20 border-border mb-7 space-y-3 border p-6 text-end shadow-sm"
        >
          <div class="flex items-center justify-between text-sm">
            <span class="text-muted font-semibold">رقم العملية</span>
            <span class="text-ink font-mono font-bold">{{ transactionId() }}</span>
          </div>
        </div>
        <button
          (click)="goToLesson()"
          class="from-mint mb-4 flex w-full items-center justify-center gap-2 rounded-full bg-gradient-to-r to-[#3ab878] p-4 text-base font-bold text-[#0b2a20] shadow-md transition-all hover:scale-[1.03]"
        >
          <span>ابدأ الدرس</span>
          <ng-icon
            name="bootstrapPlayFill"
            class="flex items-center text-lg"
          ></ng-icon>
        </button>
        <a
          routerLink="/home"
          class="text-muted hover:text-primary-light mt-4 block text-sm font-semibold"
        >
          رجّع للرئيسية
        </a>
      </div>
    }

    <!-- Failed -->
    @if (state() === 'failed') {
      <div>
        <div
          class="mx-auto mb-7 flex h-24 w-24 items-center justify-center rounded-full border-[12px] border-[rgba(240,106,106,0.05)] bg-[rgba(240,106,106,0.10)]"
        >
          <ng-icon
            name="bootstrapXLg"
            class="text-coral flex items-center text-3xl"
          ></ng-icon>
        </div>
        <h1 class="text-ink mb-2.5 text-3xl font-black">فشلت عملية الدفع</h1>
        <p class="text-muted mx-auto mb-8 max-w-95 text-base">
          حصل مشكلة في الدفع. تأكد من بياناتك وجرب تاني
        </p>
        <a
          routerLink="/lessons"
          class="bg-coral mb-4 flex w-full items-center justify-center gap-2 rounded-full p-4 text-base font-bold text-white shadow-md transition-all hover:scale-[1.03]"
        >
          <ng-icon
            name="bootstrapArrowClockwise"
            class="flex items-center text-lg"
          ></ng-icon>
          <span>جرب تاني</span>
        </a>
        <a
          routerLink="/home"
          class="text-muted hover:text-primary-light mt-4 block text-sm font-semibold"
        >
          رجّع للرئيسية
        </a>
      </div>
    }
  </div>
</main>
