<button
  class="bg-surface border border-border rounded-card relative transition-all duration-300"
  (click)="select.emit(data().id)"
  [class]="
    'flex-1 border-2 rounded-3xl p-7 text-right flex flex-col cursor-pointer ' +
    (selected()
      ? 'border-primary shadow-[0_0_8px_4px_var(--color-primary-glow)]'
      : 'border-border hover:-translate-y-1')
  "
>
  <div class="flex items-start justify-between mb-5">
    <div
      class="w-12 h-12 rounded-2xl flex items-center justify-center text-xl"
      [class]="
        data().isFawry
          ? 'bg-primary/15 text-primary-light'
          : 'bg-star/15 text-star'
      "
    >
      <ng-icon [name]="data().icon"></ng-icon>
    </div>
  </div>

  <div class="flex font-black text-ink mb-2 text-lg justify-between">
    {{ data().name }}
    <span
      class="text-xs font-black px-3 py-1 rounded-full"
      [class]="
        data().isFawry
          ? 'bg-mint/15 text-mint'
          : 'bg-star/15 text-star'
      "
    >
      {{ data().badge }}
    </span>
  </div>
  <p class="text-muted text-sm mb-5 leading-relaxed">{{ data().desc }}</p>

  <div class="h-px bg-border w-full mb-5"></div>

  <div class="text-xs font-bold text-ink-subtle space-y-2">
    @for (feat of data().features; track feat) {
      <div class="flex items-center gap-2">
        <ng-icon
          name="bootstrapCheckCircleFill"
          [class]="data().isFawry ? 'text-mint' : 'text-star'"
        >
        </ng-icon>
        {{ feat }}
      </div>
    }
  </div>
</button>
