<section
  class="bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] p-6 md:p-8 shadow-sm relative"
>
  <div class="flex items-center justify-between gap-4 mb-5">
    <h2 class="text-lg font-black text-ink">
      محتوى <span class="text-primary-light">الدرس</span>
    </h2>
    <span class="text-xs text-muted font-semibold">{{ chapters().length }} فصول </span>
    <!-- · {{duration}}  -->
  </div>

  <div class="flex flex-col gap-3">
    @for (chapter of chapters(); track $index) {
    <div
      class="flex items-center gap-4 p-4 rounded-2xl transition-all duration-200 border border-transparent
                {{
          chapter.isPreview
            ? 'cursor-pointer hover:shadow-sm hover:border-mint/30 hover:bg-mint/15 bg-mint/10 border-mint/20'
            : 'bg-[var(--surface2)]'
        }}"
      [class.border-mint/20]="chapter.isPreview"
      [class.bg-[var(--surface2)]]="!chapter.isPreview"
    >
      <span
        class="w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-xs font-black"
        [class.bg-mint/20]="chapter.isPreview"
        [class.text-mint]="chapter.isPreview"
        [class.bg-primary/20]="!chapter.isPreview"
        [class.text-primary-light]="!chapter.isPreview"
      >
        {{ $index + 1 }}
      </span>

      <span class="flex-1 text-sm font-bold text-ink">{{ chapter.title }}</span>
      <!-- <span class="text-xs text-muted shrink-0">{{ chapter.duration }}</span> -->

      @if (chapter.isPreview) {
      <span
        class="text-xs font-bold text-mint bg-mint/10 border border-mint/20 px-2 py-1 rounded-[var(--radius-pill)] whitespace-nowrap"
      >
        معاينة مجانية
      </span>
      } @else {
      <ng-icon name="bootstrapLockFill" class="text-muted/50 text-sm shrink-0"></ng-icon>
      }
    </div>
    }
  </div>
</section>
