<section class="bg-surface border-border rounded-card relative border p-6 shadow-sm md:p-8">
  <div class="mb-5 flex items-center justify-between gap-4">
    <h2 class="text-ink text-lg font-black">محتوى <span class="text-primary-light">الدرس</span></h2>
    <div>
      <span class="text-muted text-xs font-semibold">{{ chapters().length }} فصول </span>
      · <span class="text-muted text-xs font-semibold">{{ duration() | duration }}</span>
    </div>
  </div>

  <div class="flex flex-col gap-3">
    @for (chapter of chapters(); track $index) {
      <div
        class="flex items-center gap-4 p-4 rounded-2xl transition-all duration-200 border border-transparent
                {{
          chapter.isPreview
            ? 'cursor-pointer hover:shadow-sm hover:border-mint/30 hover:bg-mint/15 bg-mint/10 border-mint/20'
            : 'bg-surface-subtle'
        }}"
        [class.border-mint/20]="chapter.isPreview"
        [class.bg-surface-subtle]="!chapter.isPreview"
      >
        <span
          class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-xs font-black"
          [class.bg-mint/20]="chapter.isPreview"
          [class.text-mint]="chapter.isPreview"
          [class.bg-primary/20]="!chapter.isPreview"
          [class.text-primary-light]="!chapter.isPreview"
        >
          {{ $index + 1 }}
        </span>

        <span class="text-ink flex-1 text-sm font-bold">{{ chapter.title }}</span>
        <span class="text-muted shrink-0 text-xs">{{
          chapter.duration.seconds | duration: 'human'
        }}</span>

        @if (chapter.isPreview) {
          <span
            class="text-mint bg-mint/10 border-mint/20 rounded-pill border px-2 py-1 text-xs font-bold whitespace-nowrap"
          >
            معاينة مجانية
          </span>
        } @else {
          <ng-icon
            name="bootstrapLockFill"
            class="text-muted/50 shrink-0 text-sm"
          ></ng-icon>
        }
      </div>
    }
  </div>
</section>
