<section
  class="bg-surface border border-border rounded-card p-6 md:p-8 shadow-sm relative"
>
  <h2 class="text-lg font-black text-ink mb-5">ماذا ستتعلم</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (outcome of outcomes(); track outcome) {
      <div class="flex items-start gap-3 text-sm text-ink-subtle">
        <ng-icon name="bootstrapCheckCircleFill" class="text-mint text-base shrink-0 mt-0.5"></ng-icon>
        <span class="leading-relaxed">{{ outcome }}</span>
      </div>
    }
  </div>
</section>
