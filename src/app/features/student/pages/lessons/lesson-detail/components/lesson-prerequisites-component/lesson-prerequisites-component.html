<section
  class="bg-[var(--surface)] border border-[var(--border)] rounded-[var(--radius-card)] p-6 md:p-8 shadow-sm relative"
>
  <h2 class="text-lg font-black text-ink mb-4">
    متطلبات <span class="text-primary-light">الدرس</span>
  </h2>

  <div class="flex flex-col gap-4 max-w-full">
    @for (req of prerequisites(); track req.title) {
      <div
        class="flex items-center justify-between gap-4 p-4 bg-[var(--surface2)] border border-primary/10 rounded-2xl transition-all duration-200 hover:border-primary/40 hover:-translate-x-1"
      >
        <div class="flex items-center gap-3 min-w-0">
          @if (req.isDone) {
            <div
              class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center text-sm bg-mint/10 text-mint"
            >
              <ng-icon name="bootstrapJournalBookmark" class="flex items-center"></ng-icon>
            </div>
          } @else {
            <div
              class="w-9 h-9 rounded-xl shrink-0 flex items-center justify-center text-sm bg-[var(--coral)]/10 text-coral"
            >
              <ng-icon name="bootstrapJournalBookmark" class="flex items-center"></ng-icon>
            </div>
          }
          <div class="min-w-0">
            <div class="text-sm font-bold text-ink truncate">{{ req.title }}</div>
            @if (req.isDone) {
              <div class="text-xs text-mint flex items-center gap-1 mt-1">
                <span>مكتمل</span>
                <ng-icon name="bootstrapCheck2" class="flex items-center"></ng-icon>
              </div>
            } @else {
              <div class="text-xs text-coral flex items-center gap-1 mt-1">
                <span>غير مكتمل</span>
                <ng-icon name="bootstrapX" class="flex items-center"></ng-icon>
              </div>
            }
          </div>
        </div>
        @if (req.isDone) {
          <ng-icon
            name="bootstrapCheckAll"
            class="text-mint text-xl shrink-0 flex items-center"
          ></ng-icon>
        } @else {
          <ng-icon
            name="bootstrapXCircle"
            class="text-coral text-xl shrink-0 flex items-center"
          ></ng-icon>
        }
      </div>
    }
  </div>
</section>
