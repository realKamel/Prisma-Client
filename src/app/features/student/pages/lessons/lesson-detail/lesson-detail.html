<main class="min-h-screen bg-main font-[var(--font)] text-ink p-4 md:p-8">
  <div class="max-w-320 mx-auto">
    @if (isLoading()) {
      <div class="animate-pulse">
        <div class="flex items-center gap-2 mb-7">
          <div
            class="h-4 bg-surface border border-[rgba(255,255,255,0.05)] rounded w-16"
          ></div>
          <span class="text-xs text-muted">/</span>
          <div
            class="h-4 bg-surface border border-[rgba(255,255,255,0.05)] rounded w-24"
          ></div>
          <span class="text-xs text-muted">/</span>
          <div
            class="h-4 bg-surface border border-[rgba(255,255,255,0.05)] rounded w-32"
          ></div>
        </div>

        <div
          class="w-full bg-surface border border-[rgba(255,255,255,0.05)] rounded-card p-6 md:p-10 min-h-55 md:min-h-65 flex flex-col justify-end relative overflow-hidden mb-8"
        >
          <div class="h-5 bg-main rounded-full w-20 mb-4 self-start opacity-40"></div>

          <div class="h-8 bg-main rounded-lg w-2/3 sm:w-1/2 mb-4 opacity-40"></div>

          <div class="flex items-center gap-4 opacity-30">
            <div class="h-4 bg-main rounded w-24"></div>
            <div class="h-4 bg-main rounded w-16"></div>
            <div class="h-4 bg-main rounded w-28"></div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-8 items-start mt-8">
          <div class="flex flex-col gap-8 order-2 lg:order-1">
            <div
              class="bg-surface border border-[rgba(255,255,255,0.05)] rounded-card p-6 space-y-4"
            >
              <div class="h-5 bg-main rounded w-24 mb-2"></div>
              <div class="h-4 bg-main rounded w-full opacity-70"></div>
              <div class="h-4 bg-main rounded w-11/12 opacity-70"></div>
              <div class="h-4 bg-main rounded w-3/4 opacity-70"></div>
            </div>

            <div
              class="bg-surface border border-[rgba(255,255,255,0.05)] rounded-card p-6 space-y-4"
            >
              <div class="h-5 bg-main rounded w-32 mb-2"></div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="h-4 bg-main rounded w-full opacity-60"></div>
                <div class="h-4 bg-main rounded w-full opacity-60"></div>
                <div class="h-4 bg-main rounded w-full opacity-60"></div>
                <div class="h-4 bg-main rounded w-full opacity-60"></div>
              </div>
            </div>

            <div
              class="bg-surface border border-[rgba(255,255,255,0.05)] rounded-card p-6 space-y-3"
            >
              <div class="h-5 bg-main rounded w-28 mb-4"></div>
              <div
                class="h-14 bg-main border border-[rgba(255,255,255,0.03)] rounded-xl w-full opacity-50"
              ></div>
              <div
                class="h-14 bg-main border border-[rgba(255,255,255,0.03)] rounded-xl w-full opacity-50"
              ></div>
              <div
                class="h-14 bg-main border border-[rgba(255,255,255,0.03)] rounded-xl w-full opacity-50"
              ></div>
            </div>
          </div>

          <aside
            class="order-1 lg:order-2 w-full max-w-md mx-auto lg:max-w-none lg:sticky lg:top-24"
          >
            <div
              class="bg-surface border border-[rgba(255,255,255,0.05)] rounded-card p-6 flex flex-col items-center"
            >
              <div class="h-3 bg-main rounded w-16 mb-2 opacity-50"></div>
              <div class="h-8 bg-main rounded w-32 mb-3"></div>
              <div class="h-6 bg-main rounded-full w-28 mb-6 opacity-40"></div>

              <div class="h-12 bg-main rounded-xl w-full mb-4 opacity-80"></div>
              <div class="h-4 bg-main rounded w-24 opacity-40"></div>
            </div>
          </aside>
        </div>
      </div>
    }

    @if (hasError()) {
      <div
        class="bg-surface border border-coral/20 rounded-card p-8 text-center max-w-md mx-auto mt-12"
      >
        <ng-icon
          name="bootstrapExclamationTriangle"
          class="text-coral text-4xl mb-3 block"
        ></ng-icon>
        <h3 class="text-lg font-bold text-ink mb-2">عذراً، حدث خطأ ما</h3>
        <p class="text-sm text-muted mb-4">
          لم نتمكن من جلب بيانات الدرس حالياً، يرجى المحاولة مرة أخرى.
        </p>
        <button (click)="ngOnInit()" class="fp-btn !w-auto px-6 py-2">إعادة المحاولة</button>
      </div>
    }

    @if (!isLoading() && !hasError() && lessonData(); as data) {
      <nav
        class="flex items-center gap-2 text-sm text-muted mb-7 animate-[fadeSlideUp_700ms_ease-out]"
      >
        <a routerLink="/home" class="hover:text-primary-light transition-colors">الرئيسية</a>
        <span class="text-xs">/</span>
        <a routerLink="/lessons" class="hover:text-primary-light transition-colors"
          >مكتبة الدروس</a
        >
        <span class="text-xs">/</span>
        <span class="text-ink-subtle truncate max-w-50">{{ data.title }}</span>
      </nav>

      <app-lesson-hero [lesson]="data"></app-lesson-hero>

      <div class="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-8 items-start mt-8">
        <div class="flex flex-col gap-8 order-2 lg:order-1">
          <app-lesson-about [text]="data.aboutText"></app-lesson-about>
          <app-lesson-outcomes [outcomes]="data.outcomes"></app-lesson-outcomes>
          @if (data.prerequisites && data.prerequisites.length > 0) {
            <app-lesson-prerequisites
              [prerequisites]="data.prerequisites"
            ></app-lesson-prerequisites>
          }
          <app-lesson-chapters [chapters]="data.chapters"></app-lesson-chapters>
        </div>

        <aside class="lg:sticky lg:top-24 order-1 lg:order-2 w-full max-w-md mx-auto lg:max-w-none">
          <app-lesson-price-card
            [lesson]="data"
            (buyClick)="buyNow()"
            (RedeemCode)="RedeemWithCode()"
          >
          </app-lesson-price-card>
        </aside>
      </div>
    }
  </div>
</main>
