<nav aria-label="مسار التنقل" class="flex items-center gap-2 text-[13px] text-muted mb-8">
  @for (item of items(); track item; let last = $last) {
    @if (item.link) {
      <a
        [routerLink]="item.link"
        class="text-muted no-underline transition-colors duration-200 hover:text-ink"
      >
        {{ item.label }}
      </a>
    } @else {
      <span [class]="item.colorClass ?? ''">{{ item.label }}</span>
    }
    @if (!last) {
      <ng-icon name="bootstrapChevronLeft" class="opacity-50 text-[12px]"></ng-icon>
    }
  }
</nav>
