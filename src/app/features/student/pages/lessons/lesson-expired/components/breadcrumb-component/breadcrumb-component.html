<nav
  aria-label="مسار التنقل"
  class="text-muted mb-8 flex items-center gap-2 text-sm"
>
  @for (item of items(); track item; let last = $last) {
    @if (item.link) {
      <a
        [routerLink]="item.link"
        class="text-muted hover:text-ink no-underline transition-colors duration-200"
      >
        {{ item.label }}
      </a>
    } @else {
      <span [class]="item.colorClass ?? ''">{{ item.label }}</span>
    }
    @if (!last) {
      <ng-icon
        name="bootstrapChevronLeft"
        class="text-xs opacity-50"
      ></ng-icon>
    }
  }
</nav>
