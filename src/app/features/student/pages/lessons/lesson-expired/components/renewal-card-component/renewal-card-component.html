<div
  class="bg-surface rounded-20 p-7"
  style="
    border: 1px solid rgba(var(--color-primary-rgb), 0.36);
    box-shadow:
      0 0 0 1px rgba(var(--color-primary-rgb), 0.1),
      0 8px 40px rgba(0, 0, 0, 0.28);
  "
>
  <!-- Header -->
  <div class="mb-5">
    <p class="text-coral mt-0 mb-1.5 text-[11px] font-bold tracking-wider uppercase">
      تجديد الاشتراك
    </p>
    <h2 class="text-ink mt-0 mb-1 text-xl leading-snug font-black">عوّد الوصول لهذا الدرس</h2>
    <p class="text-muted m-0 text-[13px] leading-relaxed">
      اشترك مجددًا واستمر من حيث توقفت بكل محتواك السابق.
    </p>
  </div>

  <!-- Price -->
  <div class="mb-5">
    <div class="text-ink text-4xl leading-none font-black tracking-tight">
      <sup class="align-super text-lg font-bold">{{ plan().currency }}</sup
      >{{ plan().amount }}
      <span class="text-muted text-sm font-semibold">{{ plan().periodLabel }}</span>
    </div>
  </div>

  <!-- Features -->
  <ul class="m-0 mb-6 flex list-none flex-col gap-2.5 p-0">
    @for (feat of plan().features; track feat) {
      <li class="text-ink-subtle flex items-center gap-2.5 text-[13px]">
        <ng-icon
          name="bootstrapCheck2"
          class="text-mint shrink-0 text-base"
        ></ng-icon>
        {{ feat }}
      </li>
    }
  </ul>

  <!-- Renew button -->
  <button
    (click)="onRenew()"
    [disabled]="renewing()"
    class="rounded-14 flex h-12.5 w-full cursor-pointer items-center justify-center gap-2 border-none text-base font-bold text-white transition-all duration-150 hover:-translate-y-px hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
    style="
      background: var(--color-primary);
      box-shadow: 0 4px 20px var(--color-primary-glow);
      font-family: var(--font);
    "
  >
    <ng-icon
      name="bootstrapArrowRepeat"
      class="text-lg"
      [class.hidden]="renewing()"
    ></ng-icon>
    <ng-icon
      name="bootstrapArrowClockwise"
      class="animate-spin text-lg"
      [class.hidden]="!renewing()"
    ></ng-icon>
    {{ renewing() ? 'جارٍ التحويل للدفع…' : 'جدّد الاشتراك — ' + currentPrice() }}
  </button>

  <!-- Promo code -->
  <div class="border-border mt-5 border-t pt-5">
    <p class="text-muted mt-0 mb-2 text-[12px] font-bold">لديك كود خصم؟</p>
    <div class="flex gap-2">
      <input
        [(ngModel)]="promoCode"
        type="text"
        placeholder="أدخل الكود…"
        class="rounded-10 text-ink bg-surface-subtle focus:border-primary-light h-10 flex-1 px-3 text-[13px] transition-colors duration-200 outline-none"
        style="border: 1.5px solid var(--color-border); font-family: var(--font)"
        (keyup.enter)="applyPromo()"
      />
      <button
        (click)="applyPromo()"
        class="rounded-10 text-primary-light h-10 cursor-pointer border-none px-4 text-[13px] font-bold whitespace-nowrap transition-all duration-200 hover:bg-[rgba(var(--color-primary-rgb),.34)]"
        style="background: rgba(var(--color-primary-rgb), 0.22); font-family: var(--font)"
      >
        تطبيق
      </button>
    </div>
    @if (promoMsg()) {
      <p
        class="mt-1.5 mb-0 text-[12px]"
        [style.color]="promoMsgColor()"
      >
        {{ promoMsg() }}
      </p>
    }
  </div>
</div>
