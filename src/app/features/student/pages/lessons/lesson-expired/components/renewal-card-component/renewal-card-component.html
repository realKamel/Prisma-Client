<div
  class="bg-surface rounded-20 p-7"
  style="
    border: 1px solid rgba(var(--color-primary-rgb), 0.36);
    box-shadow:
      0 0 0 1px rgba(var(--color-primary-rgb), 0.1),
      0 8px 40px rgba(0, 0, 0, 0.28);
  "
>
  <!-- Header -->
  <div class="mb-5">
    <p class="text-[11px] font-bold tracking-wider uppercase text-coral mb-1.5 mt-0">
      تجديد الاشتراك
    </p>
    <h2 class="text-xl font-black text-ink leading-snug mb-1 mt-0">
      عوّد الوصول لهذا الدرس
    </h2>
    <p class="text-[13px] text-muted leading-relaxed m-0">
      اشترك مجددًا واستمر من حيث توقفت بكل محتواك السابق.
    </p>
  </div>

  <!-- Price -->
  <div class="mb-5">
    <div class="text-4xl font-black text-ink leading-none tracking-tight">
      <sup class="text-lg font-bold align-super">{{ plan().currency }}</sup
      >{{ plan().amount }}
      <span class="text-sm font-semibold text-muted">{{ plan().periodLabel }}</span>
    </div>
  </div>

  <!-- Features -->
  <ul class="flex flex-col gap-2.5 mb-6 p-0 m-0 list-none">
    @for (feat of plan().features; track feat) {
      <li class="flex items-center gap-2.5 text-[13px] text-ink-subtle">
        <ng-icon
          name="bootstrapCheck2"
          class="text-base flex-shrink-0 text-mint"
        ></ng-icon>
        {{ feat }}
      </li>
    }
  </ul>

  <!-- Renew button -->
  <button
    (click)="onRenew()"
    [disabled]="renewing()"
    class="w-full h-12.5 rounded-14 border-none cursor-pointer text-white text-base font-bold flex items-center justify-center gap-2 transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed hover:opacity-90 hover:-translate-y-px"
    style="
      background: var(--color-primary);
      box-shadow: 0 4px 20px var(--color-primary-glow);
      font-family: var(--font);
    "
  >
    <ng-icon name="bootstrapArrowRepeat" class="text-lg" [class.hidden]="renewing()"></ng-icon>
    <ng-icon
      name="bootstrapArrowClockwise"
      class="animate-spin text-lg"
      [class.hidden]="!renewing()"
    ></ng-icon>
    {{ renewing() ? 'جارٍ التحويل للدفع…' : 'جدّد الاشتراك — ' + currentPrice() }}
  </button>

  <!-- Promo code -->
  <div class="mt-5 pt-5 border-t border-border">
    <p class="text-[12px] font-bold text-muted mb-2 mt-0">لديك كود خصم؟</p>
    <div class="flex gap-2">
      <input
        [(ngModel)]="promoCode"
        type="text"
        placeholder="أدخل الكود…"
        class="flex-1 h-10 px-3 rounded-10 text-[13px] text-ink bg-surface-subtle outline-none transition-colors duration-200 focus:border-primary-light"
        style="border: 1.5px solid var(--color-border); font-family: var(--font)"
        (keyup.enter)="applyPromo()"
      />
      <button
        (click)="applyPromo()"
        class="h-10 px-4 rounded-10 border-none cursor-pointer text-[13px] font-bold text-primary-light whitespace-nowrap transition-all duration-200 hover:bg-[rgba(var(--color-primary-rgb),.34)]"
        style="background: rgba(var(--color-primary-rgb), 0.22); font-family: var(--font)"
      >
        تطبيق
      </button>
    </div>
    @if (promoMsg()) {
      <p class="text-[12px] mt-1.5 mb-0" [style.color]="promoMsgColor()">
        {{ promoMsg() }}
      </p>
    }
  </div>
</div>
