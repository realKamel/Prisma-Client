<div class="max-w-275 mx-auto px-14 pt-25 pb-20 max-sm:px-5 max-sm:pt-22 relative">
  <!-- Breadcrumb -->
  <app-breadcrumb [items]="breadcrumbs" />

  <!-- Loading skeleton -->
  @if (loading()) {
    <div class="grid gap-8 items-start grid-cols-[1fr_360px] max-[900px]:grid-cols-1">
      <!-- Left: lesson card skeleton -->
      <div
        class="bg-surface border border-border rounded-3xl overflow-hidden animate-pulse"
      >
        <!-- Thumbnail placeholder -->
        <div class="h-70 bg-surface-subtle"></div>
        <!-- Meta placeholder -->
        <div class="px-7 py-6 flex flex-col gap-3">
          <div class="h-4 w-24 rounded-full bg-surface-subtle"></div>
          <div class="h-6 w-3/4 rounded-full bg-surface-subtle"></div>
          <div class="h-4 w-full rounded-full bg-surface-subtle"></div>
          <div class="h-4 w-2/3 rounded-full bg-surface-subtle"></div>
          <div class="flex gap-4 pt-4 border-t border-border">
            <div class="h-4 w-20 rounded-full bg-surface-subtle"></div>
            <div class="h-4 w-20 rounded-full bg-surface-subtle"></div>
            <div class="h-4 w-20 rounded-full bg-surface-subtle"></div>
          </div>
          <div class="h-2 w-full rounded-full bg-surface-subtle mt-2"></div>
        </div>
      </div>
      <!-- Right: sidebar skeleton -->
      <div class="flex flex-col gap-4 animate-pulse">
        <!-- Renewal card -->
        <div
          class="bg-surface border border-border rounded-20 p-7 flex flex-col gap-3"
        >
          <div class="h-3 w-24 rounded-full bg-surface-subtle"></div>
          <div class="h-6 w-48 rounded-full bg-surface-subtle"></div>
          <div class="h-4 w-full rounded-full bg-surface-subtle"></div>
          <div class="h-10 w-36 rounded-full bg-surface-subtle mt-2"></div>
          <div class="flex flex-col gap-2 mt-3">
            <div class="h-3 w-full rounded-full bg-surface-subtle"></div>
            <div class="h-3 w-full rounded-full bg-surface-subtle"></div>
            <div class="h-3 w-3/4 rounded-full bg-surface-subtle"></div>
            <div class="h-3 w-full rounded-full bg-surface-subtle"></div>
          </div>
          <div class="h-12 w-full rounded-14 bg-surface-subtle mt-4"></div>
        </div>
        <!-- Alt options card -->
        <div
          class="bg-surface-subtle border border-border rounded-2xl p-5 flex flex-col gap-3"
        >
          <div class="h-4 w-20 rounded-full bg-surface"></div>
          <div class="h-12 w-full rounded-xl bg-surface"></div>
          <div class="h-12 w-full rounded-xl bg-surface"></div>
          <div class="h-12 w-full rounded-xl bg-surface"></div>
        </div>
      </div>
    </div>
  }

  <!-- Error state -->
  @if (error() && !loading()) {
    <div class="text-center py-24 text-muted">
      <ng-icon
        name="bootstrapExclamationCircle"
        class="text-5xl block mb-4 text-coral"
      ></ng-icon>
      <p class="text-base">{{ error() }}</p>
    </div>
  }

  <!-- Main grid -->
  @if (!loading() && !error()) {
    <div class="grid gap-8 items-start grid-cols-[1fr_360px] max-[900px]:grid-cols-1">
      <!-- Left: expired lesson card -->
      <app-expired-lesson-card [lesson]="lessonData()" />
      <!-- Right: sidebar -->
      <div class="flex flex-col gap-4">
        <app-renewal-card [plan]="renewalPlan()" (renewClicked)="handleRenew($event)" />
        <app-alt-options-card [options]="altOptions" />
      </div>
    </div>
  }
</div>
