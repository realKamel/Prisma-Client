<div class="block animate-[panelIn_350ms_cubic-bezier(0.16,1,0.3,1)_both]">
  <p class="text-base text-[var(--ink2)] leading-relaxed mb-6">
    {{ description() }}
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
    @for (objective of objectives(); track objective; let i = $index) {
      <div
        class="flex items-start gap-3 bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4 shadow-sm hover:shadow-md transition-shadow"
      >
        <span
          class="w-7 h-7 rounded-lg bg-[rgba(78,203,141,0.12)] flex items-center justify-center text-mint flex-shrink-0"
        >
          <ng-icon [name]="i === 0 ? 'bootstrapBullseye' : 'bootstrapCalculator'"></ng-icon>
        </span>
        <span class="text-base font-semibold text-[var(--ink2)] leading-normal">
          {{ objective }}
        </span>
      </div>
    }
  </div>
</div>
