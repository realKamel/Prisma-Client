<div class="flex animate-[panelIn_350ms_cubic-bezier(0.16,1,0.3,1)_both] flex-col gap-3">
  @for (mat of materialsList(); track mat.title) {
    <div
      class="bg-surface border-border hover:border-border-focus flex items-center gap-4 rounded-2xl border p-4 shadow-sm transition-all md:px-5"
    >
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl text-lg">
        @if (mat.type === 'pdf') {
          <div
            class="text-coral bg-coral/10 flex h-full w-full items-center justify-center rounded-xl"
          >
            <ng-icon
              name="bootstrapFileEarmarkPdfFill"
              class="flex items-center"
              aria-hidden="true"
            ></ng-icon>
          </div>
        } @else if (mat.type === 'ppt') {
          <div
            class="text-star bg-star/10 flex h-full w-full items-center justify-center rounded-xl"
          >
            <ng-icon
              name="bootstrapFileEarmarkPptFill"
              class="flex items-center"
              aria-hidden="true"
            ></ng-icon>
          </div>
        } @else if (mat.type === 'exrc') {
          <div
            class="flex h-full w-full items-center justify-center rounded-xl bg-[rgba(78,203,141,0.12)] text-[#4ecbad]"
          >
            <ng-icon
              name="bootstrapFileEarmarkCheckFill"
              class="flex items-center"
              aria-hidden="true"
            ></ng-icon>
          </div>
        }
      </div>

      <div class="min-w-0 flex-1">
        <div class="text-ink mb-0.5 truncate text-base font-bold">{{ mat.title }}</div>
      </div>

      <a
        [href]="mat.downloadUrl || '#'"
        target="_blank"
        class="border-border text-primary-light hover:border-border-focus decoration-none inline-flex transform items-center gap-2 rounded-full border bg-[rgba(var(--color-primary-rgb),0.12)] px-4 py-2 text-xs font-bold whitespace-nowrap transition-all duration-200 hover:scale-105 hover:bg-[rgba(var(--color-primary-rgb),0.2)]"
      >
        <ng-icon
          name="bootstrapDownload"
          class="flex items-center"
          aria-hidden="true"
        ></ng-icon>
        تحميل
      </a>
    </div>
  } @empty {
    <div
      class="text-muted border-border bg-surface flex items-center justify-center gap-3 rounded-2xl border border-dashed py-8 text-center text-2xl"
    >
      <ng-icon
        name="bootstrapFolderX"
        aria-hidden="true"
      ></ng-icon>
      <p class="text-muted text-sm">لا توجد مواد تعليمية مرفقة بهذا الدرس حاليًا.</p>
    </div>
  }
</div>
