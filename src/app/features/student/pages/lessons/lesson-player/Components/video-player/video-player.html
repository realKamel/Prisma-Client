<div
  class="group relative mb-5 aspect-video overflow-hidden rounded-3xl border border-[rgba(var(--color-primary-rgb),0.12)] bg-[#0c0e17] shadow-2xl select-none"
>
  <video
    #videoElement
    [poster]="poster()"
    (click)="togglePlay()"
    (play)="onVideoPlayStateChange(true)"
    (pause)="onVideoPlayStateChange(false)"
    (loadedmetadata)="onMetadataLoaded()"
    (timeupdate)="onTimeUpdate()"
    (ended)="onVideoEnded()"
    class="h-full w-full object-cover"
  ></video>

  @if (!isPlaying) {
    <div
      class="pointer-events-none absolute inset-0 z-10 flex items-center justify-center bg-gradient-to-br from-[#0b2a20] via-[#1f4a3a] to-[#0b2a20]"
    >
      <span class="pointer-events-none absolute text-[120px] text-white opacity-[0.04]">
        <ng-icon name="bootstrapLightningCharge"></ng-icon>
      </span>
      <div class="px-10 text-center text-white">
        <div class="text-mint mb-3 text-xs font-bold tracking-widest">// المحاضرة الحالية</div>
        <div class="mb-2 text-xl font-black sm:text-2xl lg:text-3xl">{{ title() }}</div>
        <div class="text-xs text-[rgba(255,255,255,0.48)]">{{ category() }}</div>
      </div>
    </div>
  }

  <!-- top badges -->
  <div
    class="pointer-events-none absolute start-4 end-4 top-4 z-20 flex items-center justify-between"
  >
    <span
      class="text-mint inline-flex items-center gap-2 rounded-full border border-[rgba(78,203,141,0.28)] bg-[rgba(0,0,0,0.48)] px-3 py-1.5 text-xs font-bold backdrop-blur-md"
    >
      <ng-icon name="bootstrapClockHistory"></ng-icon> {{ durationLabel }}
    </span>
    <span
      class="inline-flex items-center gap-2 rounded-full border border-[rgba(255,255,255,0.12)] bg-[rgba(0,0,0,0.48)] px-3 py-1.5 text-xs font-bold text-[rgba(255,255,255,0.64)] backdrop-blur-md"
    >
      <ng-icon name="bootstrapCalendarRange"></ng-icon> صلاحية الوصول مفعّلة
    </span>
  </div>

  <!-- center play button -->
  <div class="absolute inset-0 z-20 flex items-center justify-center">
    <button
      (click)="togglePlay()"
      class="flex h-18 w-18 transform items-center justify-center rounded-full border-2 border-[rgba(255,255,255,0.22)] bg-[rgba(255,255,255,0.14)] text-2xl text-white shadow-lg backdrop-blur-xl transition-all duration-300 group-hover:scale-110 hover:!border-[rgba(var(--color-primary-rgb),0.6)] hover:!bg-[rgba(var(--color-primary-rgb),0.52)]"
    >
      <ng-icon
        [name]="isPlaying ? 'bootstrapPauseFill' : 'bootstrapPlayFill'"
        [class.-me-1]="!isPlaying"
      ></ng-icon>
    </button>
  </div>

  <!-- bottom controls -->
  <div
    class="absolute start-0 end-0 bottom-0 z-30 bg-gradient-to-t from-[rgba(0,0,0,0.85)] to-transparent p-5 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
    [class.opacity-100]="!isPlaying"
  >
    <!-- seek bar -->
    <div
      class="group/seek relative mb-4 h-1 cursor-pointer rounded-full bg-[rgba(255,255,255,0.18)]"
      (click)="onSeek($event)"
    >
      <div
        class="bg-primary-light absolute end-0 top-0 bottom-0 rounded-full transition-all duration-100"
        [style.width.%]="progressPercent"
      ></div>
      <div
        class="absolute top-1/2 h-3 w-3 -translate-y-1/2 rounded-full bg-white opacity-0 shadow-md transition-opacity duration-150 group-hover/seek:opacity-100"
        [style.right.%]="progressPercent"
      ></div>
    </div>

    <div class="flex items-center gap-4 text-white">
      <button
        (click)="togglePlay()"
        class="flex transform items-center text-xl text-[rgba(255,255,255,0.84)] transition-all hover:scale-110 hover:text-white"
      >
        <ng-icon [name]="isPlaying ? 'bootstrapPauseFill' : 'bootstrapPlayFill'"></ng-icon>
      </button>

      <button
        (click)="skipBackward()"
        class="flex transform items-center text-base text-[rgba(255,255,255,0.84)] transition-all hover:scale-110 hover:text-white"
      >
        <ng-icon name="bootstrapArrowCounterclockwise"></ng-icon>
      </button>

      <span class="text-xs font-bold text-[rgba(255,255,255,0.68)]"
        >{{ currentTimeLabel }} / {{ durationLabel }}</span
      >

      <div class="flex-1"></div>

      <div class="flex items-center gap-3">
        <select
          (change)="changeSpeed($event)"
          class="cursor-pointer rounded-lg border-none bg-[rgba(255,255,255,0.12)] px-2 py-1 text-xs font-bold text-[rgba(255,255,255,0.84)] outline-none hover:bg-[rgba(255,255,255,0.2)]"
        >
          <option
            value="0.75"
            class="text-black"
          >
            0.75x
          </option>
          <option
            value="1"
            selected
            class="text-black"
          >
            1.0x
          </option>
          <option
            value="1.25"
            class="text-black"
          >
            1.25x
          </option>
          <option
            value="1.5"
            class="text-black"
          >
            1.5x
          </option>
          <option
            value="2"
            class="text-black"
          >
            2.0x
          </option>
        </select>

        <div class="flex items-center gap-2">
          <button
            (click)="toggleMute()"
            class="flex items-center text-lg text-[rgba(255,255,255,0.84)] transition-colors hover:text-white"
          >
            <ng-icon
              [name]="isMuted ? 'bootstrapVolumeMuteFill' : 'bootstrapVolumeUpFill'"
            ></ng-icon>
          </button>
          <input
            type="range"
            min="0"
            max="100"
            [value]="volume"
            (input)="onVolumeChange($event)"
            class="h-1 w-16 cursor-pointer rounded-full bg-[rgba(255,255,255,0.2)] accent-white outline-none"
          />
        </div>

        <button
          (click)="toggleFullscreen()"
          class="flex items-center text-lg text-[rgba(255,255,255,0.84)] transition-transform hover:scale-110 hover:text-white"
        >
          <ng-icon name="bootstrapFullscreen"></ng-icon>
        </button>
      </div>
    </div>
  </div>
</div>
