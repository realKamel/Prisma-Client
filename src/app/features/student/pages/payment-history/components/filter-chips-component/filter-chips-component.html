<div
  class="mb-6 flex flex-wrap items-center gap-2 border-b border-border pb-6"
  role="group"
  aria-label="تصفية المدفوعات"
>
  @for (chip of chips; track chip.key) {
  <button
    type="button"
    class="inline-flex items-center gap-1.5 rounded-full border px-4 py-2 text-sm font-bold transition-colors duration-150"
    [class.bg-primary]="activeFilter() === chip.key"
    [class.text-white]="activeFilter() === chip.key"
    [class.border-primary]="activeFilter() === chip.key"
    [class.bg-surface]="activeFilter() !== chip.key"
    [class.text-muted]="activeFilter() !== chip.key"
    [class.border-border]="activeFilter() !== chip.key"
    (click)="filterChange.emit(chip.key)"
  >
    {{ chip.label }}
    <span class="text-xs opacity-80">{{ counts()[chip.key] | number }}</span>
  </button>
  }
</div>
