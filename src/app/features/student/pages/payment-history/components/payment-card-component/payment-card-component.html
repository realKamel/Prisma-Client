<div
  class="rounded-20 border-border bg-surface hover:border-border-focus relative flex flex-wrap items-center gap-4 border p-5 shadow-[0_4px_16px_rgba(0,0,0,0.08)] transition-[border-color,transform] duration-200 hover:-translate-y-0.5"
  [class.opacity-[0.72]]="payment().status === 'expired'"
  ngmMotion
  [initial]="{ opacity: 0, x: 18, scale: 0.98 }"
  [animate]="{ opacity: 1, x: 0, scale: 1 }"
  [exit]="{ opacity: 0, x: -18, scale: 0.98 }"
  [whileHover]="{ y: -3 }"
  [transition]="{ type: 'spring', stiffness: 300, damping: 25, delay: animationDelay() }"
>
  <!-- Poster -->
  <div
    class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br"
    [class]="[poster().gradientClass, payment().status === 'expired' ? 'grayscale-[0.6]' : '']"
  >
    <ng-icon
      [name]="poster().icon"
      class="text-2xl text-white/75"
      aria-hidden="true"
    ></ng-icon>
  </div>

  <!-- Body -->
  <div class="min-w-0 flex-1">
    <div class="text-ink mb-1 truncate text-base font-black">
      {{ payment().lessonTitle }}
    </div>
    <div class="text-muted flex flex-wrap items-center gap-2 text-xs">
      <ng-icon
        name="bootstrapCalendar3"
        aria-hidden="true"
      ></ng-icon>
      {{ payment().paymentDate | date }}
      <span
        class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-bold"
        [class]="statusPill().classes"
      >
        {{ statusPill().label }}
      </span>
    </div>
  </div>

  <!-- Amount + method -->
  <div class="flex shrink-0 flex-col items-end gap-2">
    @if (payment().amount) {
      <div class="text-star text-xl font-black">
        {{ payment().amount | number }}
        <span class="ms-0.5 text-xs font-bold opacity-70">جنيه</span>
      </div>
    }
    <span
      class="rounded-full px-3 py-1 text-xs font-bold"
      [class]="methodPill().classes"
    >
      {{ methodPill().label }}
    </span>
  </div>

  <!-- CTA -->
  <div class="flex shrink-0 flex-col items-end gap-2">
    @if (payment().status === 'expired') {
      <a
        [routerLink]="['/lessons', payment().lessonId, 'expired']"
        class="text-star inline-flex items-center gap-1.5 rounded-full border border-[rgba(247,201,72,0.3)] bg-[rgba(247,201,72,0.15)] px-4 py-2 text-xs font-bold transition-[opacity,transform] duration-150 hover:scale-[1.03] hover:opacity-85"
      >
        <ng-icon
          name="bootstrapArrowRepeat"
          aria-hidden="true"
        ></ng-icon>
        جدد الدرس
      </a>
    } @else {
      <a
        [routerLink]="['/lessons', payment().lessonId, 'watch']"
        class="bg-primary inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-xs font-bold text-white transition-[opacity,transform] duration-150 hover:scale-[1.03] hover:opacity-85"
      >
        <ng-icon
          name="bootstrapBoxArrowInLeft"
          aria-hidden="true"
        ></ng-icon>
        ادخل الدرس
      </a>
    }
  </div>
</div>
