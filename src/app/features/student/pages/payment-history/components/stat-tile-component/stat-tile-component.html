<div
  class="rounded-20 border-border bg-surface relative flex flex-col gap-2 overflow-hidden border p-6 shadow-[0_4px_16px_rgba(0,0,0,0.08)]"
>
  <!--<span class="absolute inset-x-0 top-0 h-0.5 opacity-60" [class]="topLineClass()"></span>-->

  <div
    class="mb-1 flex h-10 w-10 items-center justify-center rounded-xl"
    [class]="iconBgClass()"
  >
    <ng-icon
      class="text-lg"
      [name]="icon()"
      [class]="[iconColorClass()]"
      aria-hidden="true"
    ></ng-icon>
  </div>

  <div
    class="text-ink leading-none font-black tracking-[-1px]"
    [class.text-4xl]="!compact()"
    [class.text-[28px]]="compact()"
  >
    <span [appCountUp]="value()"></span>
  </div>
  <div class="text-muted text-xs font-bold">{{ label() }}</div>
</div>
