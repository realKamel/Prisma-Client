<main
  class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8"
  ngmMotion
  [initial]="pageInitial"
  [animate]="pageAnimate"
  [transition]="pageTransition"
>
  <app-breadcrumb
    ngmMotion
    [initial]="{ opacity: 0, x: 12 }"
    [animate]="{ opacity: 1, x: 0 }"
    [transition]="{ ...pageTransition, delay: 0.04 }"
    [items]="[{ label: 'الرئيسية', url: '/my-dashboard' }, { label: 'سجل المدفوعات' }]"
  />
  <app-page-header
    ngmMotion
    [initial]="{ opacity: 0, y: 12 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ ...pageTransition, delay: 0.08 }"
    eyebrow="// حسابي"
    titleMain="سجل "
    titleAccent="المدفوعات"
    subtitle="كل عمليات الشراء اللي عملتها "
  />

  <app-stats-strip
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ ...pageTransition, delay: 0.14 }"
    [stats]="stats()"
  />

  <app-filter-chips
    ngmMotion
    [initial]="{ opacity: 0, y: 14 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ ...pageTransition, delay: 0.2 }"
    [counts]="filterCounts()"
    [activeFilter]="activeFilter()"
    (filterChange)="activeFilter.set($event)"
  />

  <app-payment-list
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ ...pageTransition, delay: 0.26 }"
    [payments]="filteredPayments()"
  />
</main>
