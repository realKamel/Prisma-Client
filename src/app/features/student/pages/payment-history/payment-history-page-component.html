<main class="mx-auto max-w-[900px] px-6 pb-20 pt-[100px]">
  <app-breadcrumb
    [items]="[{ label: 'الرئيسية', url: '/my-dashboard' }, { label: 'سجل المدفوعات' }]"
  />

  <app-page-header
    eyebrow="// حسابي"
    titleMain="سجل "
    titleAccent="المدفوعات"
    subtitle="كل عمليات الشراء اللي عملتها "
  />

  <app-stats-strip [stats]="stats()" />

  <app-filter-chips
    [counts]="filterCounts()"
    [activeFilter]="activeFilter()"
    (filterChange)="activeFilter.set($event)"
  />

  <app-payment-list [payments]="filteredPayments()" />
</main>
