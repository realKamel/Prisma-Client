@if (items().length > 0) {
    @for (item of items(); track item.kind) {
        <div class="bg-surface border-border rounded-3xl border p-2 mb-3 shadow-xl">
              <div class="flex flex-col gap-2">
        <div
          (click)="onItemClick(item)"
          (keydown.enter)="onItemClick(item)"
          [class.bg-[rgba(var(--color-primary-glow),0.12)]]="item.isActive"
          [class.shadow-[inset_0_0_0_1px_rgba(var(--color-primary-glow),0.24)]]="item.isActive"
          [class.hover:bg-[rgba(var(--color-primary-glow),0.08)]]="!item.isActive"
          [class.opacity-50]="item.status === 'locked'"
          [attr.aria-disabled]="item.status === 'locked'"
          tabindex="0"
          role="button"
          class="group relative flex cursor-pointer items-start gap-3 rounded-2xl p-3 transition-colors duration-200"
        >
          <div
            [class.bg-mint/10]="item.status === 'done'"
            [class.text-mint]="item.status === 'done'"
            [class.bg-[rgba(var(--color-primary-glow),0.2)]]="
              item.isActive || item.status === 'current'
            "
            [class.text-primary-light]="item.isActive || item.status === 'current'"
            [class.ring-2]="item.isActive || item.status === 'current'"
            [class.ring-primary-light]="item.isActive || item.status === 'current'"
            [class.shadow-md]="item.isActive || item.status === 'current'"
            [class.bg-[rgba(var(--color-primary-rgb),0.08)]]="
              !item.isActive && item.status !== 'done'
            "
            [class.text-muted]="!item.isActive && item.status !== 'done'"
            class="relative flex h-8 w-8 shrink-0 items-center justify-center rounded-xl text-xs font-black"
          >
            @if (item.status === 'done') {
              <ng-icon name="bootstrapCheckLg"></ng-icon>
            } @else if (item.status === 'locked') {
              <ng-icon name="bootstrapLockFill"></ng-icon>
            } @else {
              <ng-icon [name]="item.icon"></ng-icon>
            }
          </div>

          <div class="min-w-0 flex-1">
            <span 
              [class.text-primary-light]="item.isActive"
              [class.text-ink]="!item.isActive"
              class="mb-1 truncate  leading-snug font-bold transition-colors"
            >
              {{ item.title }}
          </span>
            <div class="text-muted flex items-center gap-1 text-xs">
              <ng-icon [name]="item.icon"></ng-icon>
              <span>{{ item.label }}</span>
            </div>
          </div>
        </div>
    </div>
</div>
      }
}
