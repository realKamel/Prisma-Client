@if (toastService.message(); as message) {
  <div
    class="border-border bg-surface text-ink fixed start-1/2 bottom-8 z-100 flex -translate-x-1/2 items-center gap-2 rounded-full border px-6 py-3 text-sm font-bold whitespace-nowrap shadow-[0_8px_32px_rgba(0,0,0,0.28)]"
    role="status"
    aria-live="polite"
  >
    <ng-icon
      name="bootstrapCheckCircleFill"
      class="text-mint text-base"
    ></ng-icon>
    <span>{{ message }}</span>
  </div>
}
