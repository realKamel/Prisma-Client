<div class="relative min-h-screen overflow-hidden px-6 pb-20 pt-24">
  <div
    class="relative mx-auto max-w-180"
    ngmMotion
    [initial]="pageInitial"
    [animate]="pageAnimate"
    [transition]="pageTransition"
  >
    <nav
      class="mb-7 flex items-center gap-2 text-xs text-muted"
      aria-label="مسار التنقل"
      ngmMotion
      [initial]="{ opacity: 0, x: 12 }"
      [animate]="{ opacity: 1, x: 0 }"
      [transition]="{ ...pageTransition, delay: 0.04 }"
    >
      <a routerLink="/home" class="transition-colors hover:text-ink">الرئيسية</a>
      <span class="opacity-40" aria-hidden="true">/</span>
      <span aria-current="page">الملف الشخصي</span>
    </nav>

    <h1
      class="mb-8 text-[clamp(28px,4vw,40px)] font-black leading-tight tracking-tight text-ink"
      ngmMotion
      [initial]="{ opacity: 0, y: 12 }"
      [animate]="{ opacity: 1, y: 0 }"
      [transition]="{ ...pageTransition, delay: 0.08 }"
    >
      الملف الشخصي
    </h1>

    @if (isLoading()) {
      <div
        class="flex items-center justify-center rounded-card border border-border bg-surface p-16 text-muted"
        ngmMotion
        [initial]="{ opacity: 0, scale: 0.96 }"
        [animate]="{ opacity: 1, scale: 1 }"
        [transition]="stateTransition"
      >
        <ng-icon name="bootstrapArrowRepeat" class="animate-spin text-2xl"></ng-icon>
      </div>
    } @else if (profile()) {
      <app-personal-info-card
        ngmMotion
        [initial]="{ opacity: 0, y: 18 }"
        [animate]="{ opacity: 1, y: 0 }"
        [transition]="cardTransition"
        [profile]="profile()!"
        [gradeOptions]="gradeOptions()"
        (profileUpdated)="onProfileUpdated($event)"
      />
      <app-change-password-card
        ngmMotion
        [initial]="{ opacity: 0, y: 18 }"
        [animate]="{ opacity: 1, y: 0 }"
        [transition]="{ ...cardTransition, delay: 0.1 }"
      />
    }
  </div>
</div>
