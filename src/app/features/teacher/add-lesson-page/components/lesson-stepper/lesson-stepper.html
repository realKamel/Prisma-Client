<nav
  aria-label="خطوات إنشاء الدرس"
  class="rounded-card border-border bg-surface border p-3 sm:p-4"
>
  <ol class="flex flex-col gap-2 sm:flex-row sm:items-center sm:gap-3">
    @for (step of stepViews(); track step.index) {
      <li class="flex min-w-0 flex-1 items-center gap-3">
        <button
          type="button"
          [id]="step.labelId"
          [attr.aria-controls]="step.state === 'current' ? step.contentId : null"
          [attr.aria-current]="step.state === 'current' ? 'step' : null"
          [attr.aria-disabled]="!step.navigable"
          (click)="select(step.index)"
          class="hover:bg-surface-subtle focus-visible:ring-primary/60 flex min-w-0 flex-1 cursor-pointer items-center gap-3 rounded-2xl px-3 py-2 text-start transition-colors focus-visible:ring-2 focus-visible:outline-none aria-disabled:cursor-not-allowed aria-disabled:hover:bg-transparent"
        >
          <span
            [class]="step.indicatorClass"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border text-sm font-bold transition-colors"
            aria-hidden="true"
          >
            @if (step.state === 'done') {
              <ng-icon
                name="bootstrapCheckLg"
                class="text-base"
              />
            } @else {
              {{ step.index + 1 }}
            }
          </span>

          <span class="min-w-0 flex-1">
            <span class="text-muted block text-[11px] font-bold">الخطوة {{ step.index + 1 }}</span>
            <span
              [class]="step.labelClass"
              class="block truncate text-sm font-extrabold"
            >
              @if (step.labelTemplate) {
                <ng-container [ngTemplateOutlet]="step.labelTemplate" />
              } @else {
                {{ step.label }}
              }
            </span>
          </span>
        </button>

        @if (!step.isLast) {
          <span
            class="bg-border hidden h-px flex-1 sm:block"
            aria-hidden="true"
          ></span>
        }
      </li>
    }
  </ol>
</nav>

<div class="mt-6">
  @for (step of stepViews(); track step.index) {
    <div
      [id]="step.contentId"
      role="region"
      [attr.aria-labelledby]="step.labelId"
      [hidden]="step.state !== 'current'"
    >
      <ng-container [ngTemplateOutlet]="step.contentTemplate" />
    </div>
  }
</div>
