<div class="bg-surface border border-border rounded-20 p-6 flex flex-col min-h-95">
  <div class="mb-5">
    <div class="text-base font-bold text-ink">الإيرادات الشهرية</div>
    <div class="text-xs text-muted mt-1">إجمالي إيراداتك بعد خصم رسوم المنصة</div>
  </div>

  @if (loading()) {
    <div class="flex-1 flex items-center justify-center">
      <span class="text-xs text-muted animate-pulse">جارٍ تحميل البيانات...</span>
    </div>
  } @else {
    @defer (on viewport) {
      <apx-chart
        [series]="chartOptions().series"
        [chart]="chartOptions().chart"
        [xaxis]="chartOptions().xaxis"
        [yaxis]="chartOptions().yaxis"
        [dataLabels]="chartOptions().dataLabels"
        [grid]="chartOptions().grid"
        [fill]="chartOptions().fill"
        [stroke]="chartOptions().stroke"
        [tooltip]="chartOptions().tooltip"
        [plotOptions]="chartOptions().plotOptions"
        [states]="chartOptions().states"
        [colors]="chartOptions().colors"
      />
    } @placeholder {
      <div
        class="h-87.5 w-full bg-slate-100 animate-pulse rounded-xl flex flex-col justify-between p-6"
      >
        <!-- Simulated Chart Header Bars -->
        <div class="flex justify-between items-center w-full">
          <div class="h-4 w-32 bg-slate-200 rounded-md"></div>
          <div class="h-4 w-20 bg-slate-200 rounded-md"></div>
        </div>
        <!-- Simulated Chart Bars Grid -->
        <div class="flex items-end justify-between h-55 pt-4 gap-4">
          <div class="h-[40%] w-full bg-slate-200 rounded-t-md"></div>
          <div class="h-[75%] w-full bg-slate-200 rounded-t-md"></div>
          <div class="h-[55%] w-full bg-slate-200 rounded-t-md"></div>
          <div class="h-[90%] w-full bg-slate-200 rounded-t-md"></div>
          <div class="h-[30%] w-full bg-slate-200 rounded-t-md"></div>
        </div>
      </div>
    }
  }
</div>
