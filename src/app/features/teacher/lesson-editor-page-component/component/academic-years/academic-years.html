<section
  class="rounded-card border border-border bg-surface p-6 sm:p-8"
>
  <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-ink">
    <ng-icon name="lucideGraduationCap" class="text-xl text-primary-light"></ng-icon>
    السنوات الدراسية
  </h3>

  <div class="flex flex-wrap gap-3">
    @for (year of academicYears(); track year) {
      <button
        type="button"
        (click)="toggle(year.id)"
        [class]="
          isSelected(year.id)
            ? 'border-primary bg-[color-mix(in_srgb,var(--color-primary)_15%,transparent)] text-primary-light'
            : 'border-border bg-surface-subtle text-ink-subtle hover:border-border-focus'
        "
        class="rounded-full border px-5 py-2 text-sm font-bold transition-colors"
      >
        <ng-icon
          [name]="isSelected(year.id) ? 'bootstrapCheck2Circle' : 'bootstrapCircle'"
          class="me-1"
        >
        </ng-icon>
        {{ year.name }}
      </button>
    }
  </div>
</section>
