<section
  class="rounded-card border border-border bg-surface p-6 sm:p-8"
>
  <h3 class="mb-5 flex items-center gap-2 text-lg font-bold text-ink">
    <ng-icon name="bootstrapListUl" class="text-xl text-primary-light"></ng-icon>
    الفصول
  </h3>

  <div class="flex flex-col gap-3">
    @for (chapter of chapters().controls; track chapter; let i = $index) {
      <div
        [formGroup]="asGroup(chapter)"
        class="flex flex-col gap-3 rounded-2xl border border-border bg-surface-subtle p-4"
      >
        <div class="flex items-center gap-3">
          <div
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[color-mix(in_srgb,var(--color-primary)_20%,transparent)] text-sm font-bold text-primary-light"
          >
            {{ i + 1 | number }}
          </div>
          <input
            type="text"
            formControlName="name"
            placeholder="عنوان الفصل"
            class="h-10 flex-1 rounded-lg border border-border bg-surface px-3 text-sm text-ink placeholder:text-muted focus:border-border-focus focus:outline-none"
          />
          @if (i + 1 > 1) {
            <button
              type="button"
              (click)="remove.emit(i)"
              aria-label="حذف الفصل"
              class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-muted transition-colors hover:bg-[color-mix(in_srgb,var(--color-coral)_14%,transparent)] hover:text-coral"
            >
              <ng-icon name="bootstrapXLg"></ng-icon>
            </button>
          }
        </div>
        <label
          [class]="
            asGroup(chapter).get('videoFileName')?.value
              ? 'border-mint text-mint'
              : 'border-border text-muted'
          "
          class="flex cursor-pointer items-center gap-2 rounded-xl border border-dashed px-4 py-3 text-sm font-semibold transition-colors hover:border-border-focus"
        >
          <ng-icon name="bootstrapCameraVideo"></ng-icon>
          <span class="flex-1 truncate">
            {{ asGroup(chapter).get('videoFileName')?.value || 'رفع فيديو الفصل (اختياري)' }}
          </span>
          @if (asGroup(chapter).get('videoFileName')?.value) {
            <button
              type="button"
              (click)="
                $event.preventDefault();
                $event.stopPropagation();
                clearChapterVideo(asGroup(chapter), fileInput, i)
              "
              class="text-muted hover:text-coral"
            >
              <ng-icon name="bootstrapX"></ng-icon>
            </button>
          }
          <input
            #fileInput
            type="file"
            accept="video/*"
            class="hidden"
            (change)="onChapterVideoChange($event, asGroup(chapter), i)"
          />
        </label>
      </div>
    }
  </div>

  <button
    type="button"
    (click)="add.emit()"
    class="mt-3 flex w-full items-center justify-center gap-2 rounded-full border border-border py-3 text-sm font-bold text-ink-subtle transition-colors hover:border-border-focus hover:text-ink"
  >
    <ng-icon name="bootstrapPlusLg"></ng-icon>
    إضافة فصل
  </button>
</section>
