<div class="rounded-card border-border bg-surface border p-6 sm:p-8">
  <h3 class="text-ink mb-5 flex items-center gap-2 text-lg font-bold">
    <ng-icon
      name="bootstrapImage"
      class="text-primary-light flex items-center text-xl"
      aria-hidden="true"
    ></ng-icon>
    صورة الغلاف
  </h3>

  <div class="mx-auto w-full max-w-2xl">
    @if (source(); as s) {
      <!-- ── Crop editor (cropper.js) ── -->
      <div class="flex flex-col gap-4">
        <div
          class="relative aspect-video w-full overflow-hidden rounded-2xl bg-black"
          role="group"
          aria-label="قص صورة الغلاف"
        >
          <!-- cropper.js positions its elements in an LTR space; the page itself stays RTL -->
          <cropper-canvas
            class="h-full w-full"
            dir="ltr"
          >
            <cropper-image
              #cropperImage
              [attr.src]="s.url"
              alt="صورة الغلاف"
              initial-fit="contain"
              scalable
            ></cropper-image>
            <cropper-shade hidden></cropper-shade>
            <cropper-selection
              #cropperSelection
              initial-coverage="0"
              aspect-ratio="1.7777777778"
              theme-color="rgba(255, 255, 255, 0.9)"
              movable
              resizable
              outlined
              precise
            >
              <cropper-grid
                role="grid"
                covered
              ></cropper-grid>
              <cropper-crosshair centered></cropper-crosshair>
              <cropper-handle
                action="move"
                plain
              ></cropper-handle>
              <cropper-handle
                action="n-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="e-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="s-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="w-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="ne-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="nw-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="se-resize"
                theme-color="#fff"
              ></cropper-handle>
              <cropper-handle
                action="sw-resize"
                theme-color="#fff"
              ></cropper-handle>
            </cropper-selection>
          </cropper-canvas>
        </div>

        <!-- zoom: zoom-out comes first in the DOM so it sits on the min side in RTL and LTR -->
        <div class="flex items-center gap-3">
          <ng-icon
            name="bootstrapZoomOut"
            class="text-muted flex items-center text-lg"
            aria-hidden="true"
          ></ng-icon>
          <input
            #zoomRange
            type="range"
            min="1"
            [max]="maxZoom"
            step="0.01"
            [value]="zoom()"
            (input)="setZoom(+zoomRange.value)"
            aria-label="تكبير الصورة"
            class="accent-primary h-1.5 w-full cursor-pointer"
          />
          <ng-icon
            name="bootstrapZoomIn"
            class="text-muted flex items-center text-lg"
            aria-hidden="true"
          ></ng-icon>
        </div>

        <p class="text-muted text-center text-xs">
          اسحب الإطار لتحريكه داخل الصورة، واسحب الزوايا لتغيير حجمه — الناتج دائمًا 16:9
        </p>

        <div class="flex gap-3">
          <button
            type="button"
            [disabled]="busy()"
            (click)="confirm()"
            class="bg-primary rounded-pill inline-flex items-center gap-2 px-6 py-2.5 text-sm font-bold text-white transition-transform hover:scale-[1.03] active:scale-[0.97] disabled:cursor-not-allowed disabled:opacity-60"
          >
            <ng-icon
              name="bootstrapCheckLg"
              class="flex items-center"
              aria-hidden="true"
            ></ng-icon>
            تأكيد القص
          </button>
          <button
            type="button"
            (click)="cancel()"
            class="border-border text-ink-subtle hover:text-ink rounded-pill border px-6 py-2.5 text-sm font-bold transition-colors"
          >
            إلغاء
          </button>
        </div>
      </div>
    } @else {
      <!-- ── Dropzone / result: always 16:9, so nothing jumps between states ── -->
      <label
        [class]="preview() ? 'border-mint' : 'border-border'"
        class="group bg-surface-subtle hover:border-border-focus relative flex aspect-video w-full cursor-pointer flex-col items-center justify-center gap-3 overflow-hidden rounded-2xl border-2 border-dashed transition-colors"
      >
        @if (preview(); as url) {
          <img
            [src]="url"
            alt="صورة الغلاف"
            class="absolute inset-0 h-full w-full object-cover object-center"
          />

          <span
            class="absolute inset-0 flex items-center justify-center bg-black/40 text-sm font-bold text-white opacity-0 transition-opacity group-hover:opacity-100"
          >
            تغيير الصورة
          </span>

          <button
            type="button"
            aria-label="حذف الصورة"
            (click)="$event.preventDefault(); $event.stopPropagation(); clear()"
            class="text-coral absolute inset-s-3 top-3 z-10 flex h-8 w-8 items-center justify-center rounded-full bg-[color-mix(in_srgb,var(--color-coral)_14%,transparent)] backdrop-blur-sm transition-colors hover:bg-[color-mix(in_srgb,var(--color-coral)_25%,transparent)]"
          >
            <ng-icon
              name="bootstrapXLg"
              class="flex items-center text-sm"
              aria-hidden="true"
            ></ng-icon>
          </button>
        } @else {
          <ng-icon
            name="bootstrapCloudArrowUp"
            class="text-muted flex items-center text-4xl"
            aria-hidden="true"
          ></ng-icon>
          <p class="text-ink-subtle text-sm font-semibold">اضغط لرفع صورة الغلاف</p>
          <p class="text-muted text-xs">PNG, JPG — سيتم قصها بنسبة 16:9 قبل الرفع</p>
        }

        <input
          type="file"
          accept="image/*"
          class="hidden"
          (change)="onFileChange($event)"
        />
      </label>
    }

    @if (error(); as msg) {
      <p
        class="text-coral mt-3 text-xs"
        role="alert"
      >
        {{ msg }}
      </p>
    }
  </div>
</div>
