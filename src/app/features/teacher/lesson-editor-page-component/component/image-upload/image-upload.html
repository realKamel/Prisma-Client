<div class="rounded-card border-border bg-surface border p-6 sm:p-8">
  <h3 class="text-ink mb-5 flex items-center gap-2 text-lg font-bold">
    <ng-icon
      name="bootstrapImage"
      class="text-primary-light flex items-center text-xl"
      aria-hidden="true"
    ></ng-icon>
    صورة الغلاف
  </h3>

  <label
    [class]="preview() ? 'border-mint' : 'border-border'"
    class="bg-surface-subtle hover:border-border-focus relative flex cursor-pointer flex-col items-center justify-center gap-3 rounded-2xl border-2 border-dashed transition-colors"
    [class.p-6]="!preview()"
  >
    @if (!preview()) {
      <ng-icon
        name="bootstrapCloudArrowUp"
        class="text-muted flex items-center text-4xl"
        aria-hidden="true"
      ></ng-icon>
      <p class="text-ink-subtle text-sm font-semibold">اضغط لرفع صورة الغلاف</p>
      <p class="text-muted text-xs">PNG, JPG — يفضل 1280×720</p>
    }

    @if (preview()) {
      <img
        [src]="preview()"
        class="h-56 w-full rounded-2xl object-cover"
      />
    }

    @if (preview()) {
      <button
        type="button"
        (click)="$event.preventDefault(); $event.stopPropagation(); clear(fileInput)"
        class="text-coral absolute start-3 top-3 flex h-8 w-8 items-center justify-center rounded-full bg-[color-mix(in_srgb,var(--color-coral)_14%,transparent)] transition-colors hover:bg-[color-mix(in_srgb,var(--color-coral)_25%,transparent)]"
      >
        <ng-icon
          name="bootstrapXLg"
          class="flex items-center text-sm"
          aria-hidden="true"
        ></ng-icon>
      </button>
    }

    <input
      #fileInput
      type="file"
      accept="image/*"
      class="hidden"
      (change)="onFileChange($event)"
    />
  </label>
</div>
