<main
  class="mx-auto flex max-w-7xl flex-col gap-6 p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <app-finances-header
    ngmMotion
    [initial]="{ opacity: 0, y: -8 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.05 }"
  />
  <app-finances-summary
    [summary]="summary()"
    [loading]="loading()"
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.1 }"
  />
  <app-finances-chart
    [data]="monthlyRevenue()"
    [loading]="loading()"
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.18 }"
  />
  <app-finances-transactions
    [transactions]="transactions()"
    [loading]="loading()"
    ngmMotion
    [initial]="{ opacity: 0, y: 16 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.26 }"
  />
</main>
