<div
  class="border-ink/10 flex flex-col gap-4 border-b pb-5 sm:flex-row sm:items-center sm:justify-between"
>
  <div class="flex items-center gap-4">
    <div
      class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full text-base font-black shadow-inner"
      [class]="theme() ? [theme()!.bg, theme()!.text] : ['bg-primary', 'text-white']"
    >
      {{ initials() }}
    </div>

    <div>
      <h3 class="text-ink text-lg leading-tight font-bold">{{ fullName() }}</h3>
      <p class="text-muted mt-0.5 text-xs">
        {{ assistantInfo().email }} | {{ assistantInfo().phoneNumber }}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-3 self-end sm:self-center">
    <button
      (click)="onEdit()"
      class="text-ink border-primary/30 hover:bg-primary/10 rounded-card inline-flex cursor-pointer items-center gap-1.5 border px-4 py-2 text-xs font-bold transition"
    >
      <svg
        class="h-3.5 w-3.5 fill-none stroke-current stroke-2"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
        <path d="m15 5 4 4"></path>
      </svg>
      تعديل
    </button>
    <button
      (click)="onDelete()"
      class="text-coral border-coral/30 hover:bg-coral/10 cursor-pointer rounded-3xl border px-4 py-2 text-xs font-bold transition"
    >
      حذف
    </button>
  </div>
</div>

<div class="divide-ink/5 divide-y">
  @for (item of permissionList; track item.key) {
    <div class="flex items-center justify-between py-4">
      <h4 class="text-ink text-sm font-bold">{{ item.title }}</h4>

      <button
        (click)="onToggle(item.key)"
        [disabled]="isUpdating()"
        class="relative h-6 w-11 cursor-pointer rounded-full transition-all duration-200 outline-none disabled:cursor-not-allowed disabled:opacity-60"
        [class]="
          hasPermission(item.key) ? 'bg-primary' : 'border-ink/10 border bg-[rgb(225,223,236)]'
        "
        [attr.aria-label]="item.title"
        [attr.aria-checked]="hasPermission(item.key)"
        [attr.aria-busy]="isPolicyUpdating(item.key)"
        role="switch"
      >
        @if (isPolicyUpdating(item.key)) {
          <span
            class="absolute inset-0 flex items-center justify-center"
            aria-hidden="true"
          >
            <span
              class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/40 border-t-white"
            ></span>
          </span>
        } @else {
          <span
            class="absolute top-1 h-4 w-4 rounded-full bg-white shadow transition-all duration-200"
            [class]="hasPermission(item.key) ? 'inset-s-6' : 'inset-s-1'"
          ></span>
        }
      </button>
    </div>
  }
</div>
