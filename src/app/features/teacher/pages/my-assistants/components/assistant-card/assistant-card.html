<div
  class="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-[var(--ink)]/10 pb-5 gap-4"
>
  <div class="flex items-center gap-4">
    <div
      class="w-12 h-12 rounded-full flex items-center justify-center font-black text-base shadow-inner shrink-0"
      [class]="theme() ? [theme()!.bg, theme()!.text] : ['bg-(--purple)', 'text-white']"
    >
      {{ initials() }}
    </div>

    <div>
      <h3 class="font-bold text-lg text-(--ink) leading-tight">{{ fullName() }}</h3>
      <p class="text-xs text-(--ink-muted) mt-0.5">
        {{ assistantInfo().email }} | {{ assistantInfo().phoneNumber }}
      </p>
    </div>
  </div>

  <div class="flex items-center gap-3 sm:self-center self-end">
    <button
      (click)="onDelete()"
      class="px-4 py-2 text-(--coral) border border-(--coral)/30 hover:bg-(--coral)/10 rounded-3xl text-xs font-bold transition cursor-pointer"
    >
      حذف
    </button>
  </div>
</div>

<div class="divide-y divide-(--ink)/5">
  @for (item of permissionList; track item.key) {
    <div class="flex items-center justify-between py-4">
      <h4 class="text-sm font-bold text-(--ink)">{{ item.title }}</h4>

      <button
        (click)="onToggle(item.key)"
        class="w-11 h-6 rounded-full transition-all duration-200 relative cursor-pointer outline-none"
        [class]="
          hasPermission(item.key)
            ? 'bg-(--purple)'
            : 'bg-[rgb(225,223,236)] border border-(--ink)/10'
        "
        [attr.aria-label]="item.title"
        [attr.aria-checked]="hasPermission(item.key)"
        role="switch"
      >
        <span
          class="absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-all duration-200"
          [class]="hasPermission(item.key) ? 'left-6' : 'left-1'"
        ></span>
      </button>
    </div>
  }
</div>
