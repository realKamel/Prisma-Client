<p>permission-button works!</p>
<div class="flex items-center justify-between py-4">
  <div>
    <h4 class="text-ink text-sm font-bold">إدارة الطلاب</h4>
    <p class="text-muted mt-0.5 text-xs">عرض سجلات الطلاب والتواصل معهم</p>
  </div>
  <button
    (click)="toggle()"
    class="relative h-6 w-11 cursor-pointer rounded-full text-white transition-colors outline-none"
    [class]="!isChecked() ? 'bg-primary text-white' : 'border-ink/10 border bg-[rgb(225,223,236)]'"
  >
    <span
      class="transition-allduration-200 absolute top-1 h-4 w-4 rounded-full bg-white"
      [class]="isChecked() ? 'inset-s-1' : 'inset-s-6'"
    ></span>
  </button>
</div>
