<p>permission-button works!</p>
<div class="flex items-center justify-between py-4">
  <div>
    <h4 class="text-sm font-bold text-(--ink)">إدارة الطلاب</h4>
    <p class="text-xs text-muted mt-0.5">عرض سجلات الطلاب والتواصل معهم</p>
  </div>
  <button
    (click)="toggle()"
    class="w-11 h-6 text-white rounded-full transition-colors relative cursor-pointer outline-none"
    [class]="
      !isChecked()
        ? 'bg-(--purple) text-white'
        : 'bg-[rgb(225,223,236)] border border-[var(--ink)]/10'
    "
  >
    <span
      class="absolute top-1 w-4 h-4 bg-white rounded-full transition-allduration-200"
      [class]="isChecked() ? 'left-1' : 'left-6'"
    ></span>
  </button>
</div>
