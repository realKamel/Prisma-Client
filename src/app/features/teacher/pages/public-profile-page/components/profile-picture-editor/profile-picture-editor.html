<div class="w-full">
  @if (source(); as s) {
    <!-- ── Crop editor (cropper.js) ── -->
    <div class="mx-auto flex max-w-md flex-col gap-4">
      <div
        class="relative aspect-square w-full overflow-hidden rounded-2xl bg-main-subtle"
        [style]="checkerStyle"
        role="group"
        [attr.aria-label]="'TEACHER_PROFILE_PAGE.PICTURE.CROP_ARIA' | translate"
      >
        <!-- cropper.js positions its elements in an LTR space; the page itself stays RTL -->
        <cropper-canvas
          class="h-full w-full"
          dir="ltr"
        >
          <cropper-image
            #cropperImage
            [attr.src]="s.url"
            alt=""
            initial-fit="contain"
            scalable
          ></cropper-image>
          <cropper-shade hidden></cropper-shade>
          <cropper-selection
            #cropperSelection
            initial-coverage="0"
            aspect-ratio="1"
            theme-color="rgba(255, 255, 255, 0.9)"
            movable
            resizable
            outlined
            precise
          >
            <cropper-grid
              role="grid"
              covered
            ></cropper-grid>
            <cropper-crosshair centered></cropper-crosshair>
            <cropper-handle
              action="move"
              plain
            ></cropper-handle>
            <cropper-handle
              action="ne-resize"
              theme-color="#fff"
            ></cropper-handle>
            <cropper-handle
              action="nw-resize"
              theme-color="#fff"
            ></cropper-handle>
            <cropper-handle
              action="se-resize"
              theme-color="#fff"
            ></cropper-handle>
            <cropper-handle
              action="sw-resize"
              theme-color="#fff"
            ></cropper-handle>
          </cropper-selection>
        </cropper-canvas>
      </div>

      <!-- zoom-out first in the DOM so it sits on the min side in RTL and LTR -->
      <div class="flex items-center gap-3">
        <ng-icon
          name="bootstrapZoomOut"
          class="text-muted flex items-center text-lg"
          aria-hidden="true"
        ></ng-icon>
        <input
          #zoomRange
          type="range"
          min="1"
          [max]="maxZoom"
          step="0.01"
          [value]="zoom()"
          (input)="setZoom(+zoomRange.value)"
          [attr.aria-label]="'TEACHER_PROFILE_PAGE.PICTURE.ZOOM' | translate"
          class="accent-primary h-1.5 w-full cursor-pointer"
        />
        <ng-icon
          name="bootstrapZoomIn"
          class="text-muted flex items-center text-lg"
          aria-hidden="true"
        ></ng-icon>
      </div>

      <p class="text-muted text-center text-xs">
        {{ 'TEACHER_PROFILE_PAGE.PICTURE.CROP_HINT' | translate }}
      </p>

      <div class="flex gap-3">
        <button
          type="button"
          [disabled]="busy()"
          (click)="confirm()"
          class="pf-btn-primary"
        >
          <ng-icon
            name="bootstrapCheckLg"
            class="flex items-center"
            aria-hidden="true"
          ></ng-icon>
          {{ 'TEACHER_PROFILE_PAGE.PICTURE.CONFIRM' | translate }}
        </button>
        <button
          type="button"
          (click)="cancel()"
          class="pf-btn-ghost"
        >
          {{ 'TEACHER_PROFILE_PAGE.PICTURE.CANCEL' | translate }}
        </button>
      </div>
    </div>
  } @else {
    <!-- ── Current picture + actions ── -->
    <div class="flex flex-col items-center gap-5 sm:flex-row sm:items-center">
      <div
        class="border-border relative aspect-square w-40 shrink-0 overflow-hidden rounded-2xl border"
        [style]="checkerStyle"
      >
        @if (url(); as picture) {
          <img appImagePlaceholder 
            [src]="picture"
            alt=""
            class="absolute inset-0 h-full w-full object-cover"
          />
        } @else {
          <div class="text-muted absolute inset-0 flex items-center justify-center">
            <ng-icon
              name="bootstrapPersonFill"
              class="text-6xl opacity-50"
              aria-hidden="true"
            ></ng-icon>
          </div>
        }
      </div>

      <div class="flex min-w-0 flex-col items-center gap-3 sm:items-start">
        <div class="flex flex-wrap justify-center gap-2 sm:justify-start">
          <button
            type="button"
            [disabled]="disabled()"
            (click)="fileInput.click()"
            class="pf-btn-primary"
          >
            <ng-icon
              name="bootstrapCloudArrowUp"
              class="flex items-center"
              aria-hidden="true"
            ></ng-icon>
            {{
              (url() ? 'TEACHER_PROFILE_PAGE.PICTURE.CHANGE' : 'TEACHER_PROFILE_PAGE.PICTURE.CHOOSE')
                | translate
            }}
          </button>
          @if (url()) {
            <button
              type="button"
              [disabled]="disabled()"
              (click)="remove()"
              class="pf-btn-ghost text-coral"
            >
              <ng-icon
                name="bootstrapTrash"
                class="flex items-center"
                aria-hidden="true"
              ></ng-icon>
              {{ 'TEACHER_PROFILE_PAGE.PICTURE.REMOVE' | translate }}
            </button>
          }
        </div>
        <p class="pf-hint mt-0 text-center sm:text-start">
          {{ 'TEACHER_PROFILE_PAGE.PICTURE.FORMATS' | translate: { max: maxFileMb } }}
        </p>
      </div>
    </div>
  }

  @if (error(); as e) {
    <p
      class="text-coral mt-3 text-xs"
      role="alert"
    >
      {{ e.key | translate: e.params }}
    </p>
  }

  <input
    #fileInput
    type="file"
    class="hidden"
    [accept]="accept"
    (change)="onFileChange($event)"
  />
</div>
