<app-upload-toast [message]="toastMessage()"></app-upload-toast>

<div
  class="mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <a
    (click)="navigateToMyLessons()"
    class="text-muted hover:text-ink cursor-pointer text-sm font-bold transition-colors"
  >
    <ng-icon
      name="bootstrapArrowRight"
      class="text-base"
    ></ng-icon>
    قائمة الدروس
  </a>

  <div class="mt-6 mb-8">
    <!-- <div class="mb-2 text-xs font-bold tracking-wide text-primary-light">// الدروس</div> -->
    <h1 class="text-ink text-2xl font-extrabold sm:text-3xl">رفع المواد</h1>
    <p class="text-muted mt-2 text-sm sm:text-base">
      ارفع ملفات PDF أو فيديوهات أو عروض إضافية على دروسك
    </p>
  </div>

  <div class="flex flex-col gap-6">
    <app-lesson-upload-card
      [lessons]="lessons()"
      [selectedLessonId]="selectedLessonId()"
      [queueFiles]="queueFiles()"
      [isUploading]="isUploading()"
      [canUpload]="canUpload()"
      (lessonChange)="onLessonChange($event)"
      (filesAdded)="onFilesAdded($event)"
      (queueItemRemoved)="onQueueItemRemoved($event)"
      (upload)="upload()"
    ></app-lesson-upload-card>

    @if (isLoadingFiles()) {
      <div
        class="rounded-card border-border bg-surface flex items-center justify-center border p-12"
      >
        <span class="text-muted text-sm">جاري تحميل الملفات…</span>
      </div>
    }

    <!-- FIXME i think there is an error here -->
    @if (!isLoadingFiles() && selectedLessonId() !== null) {
      <app-existing-files-card
        [allFiles]="currentFiles()"
        [activeFilter]="activeFilter()"
        (filterChange)="activeFilter() == $event"
        (delete)="deleteFile($event)"
      />
    }
  </div>
</div>
