@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center"
    style="background: rgba(8, 6, 18, 0.72); backdrop-filter: blur(6px)"
    (click)="cancelled.emit()"
  >
    <div
      class="relative bg-surface rounded-20 p-8 w-full max-w-105 mx-4 flex flex-col gap-5"
      style="
        border: 1px solid rgba(var(--color-primary-rgb), 0.28);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      "
      (click)="$event.stopPropagation()"
    >
      <!-- Icon -->
      <div
        class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto"
        style="background: rgba(240, 106, 106, 0.18); border: 1px solid rgba(240, 106, 106, 0.32)"
      >
        <ng-icon name="bootstrapTrash3Fill" class="text-[28px] text-coral"></ng-icon>
      </div>
      <!-- Title & body -->
      <div class="text-center">
        <h2 class="text-xl font-black text-ink mb-2 mt-0">تأكيد الحذف</h2>
        <p class="text-sm text-muted leading-relaxed m-0">
          هل أنت متأكد إنك عايز تحذف درس
          <strong class="text-ink">"{{ lessonName() }}"</strong>؟ العملية دي مش هترجع.
        </p>
      </div>
      <!-- Actions -->
      <div class="flex gap-3 mt-1">
        <button
          (click)="cancelled.emit()"
          class="flex-1 h-11.5 rounded-3xl text-sm font-bold text-ink-subtle bg-surface transition-all duration-150 hover:bg-surface-subtle cursor-pointer"
        >
          إلغاء
        </button>
        <button
          (click)="confirmed.emit()"
          class="flex-1 h-11.5 rounded-3xl text-sm font-bold text-white transition-all duration-150 hover:opacity-90 cursor-pointer border-none flex items-center justify-center"
          style="
            background: var(--color-coral);
            box-shadow: 0 4px 16px rgba(240, 106, 106, 0.28);
            font-family: var(--font);
          "
        >
          <ng-icon name="bootstrapTrash3" class="me-1"></ng-icon>
          حذف الدرس
        </button>
      </div>
    </div>
  </div>
}
