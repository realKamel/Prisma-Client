<div class="flex flex-wrap items-center gap-3 mb-6">
  <!-- Search -->
  <div
    class="flex items-center gap-2 flex-1 min-w-full sm:min-w-55 h-10.5 px-3 rounded-xl transition-colors duration-200 focus-within:border-primary-light"
    style="background: var(--color-surface-subtle); border: 1.5px solid var(--color-border)"
  >
    <ng-icon name="bootstrapSearch" class="text-sm text-muted flex-shrink-0"></ng-icon>
    <input
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
      type="text"
      placeholder="ابحث عن درس..."
      autocomplete="off"
      class="flex-1 bg-transparent border-none outline-none text-[13px] text-ink placeholder:text-muted"
      style="font-family: var(--font)"
    />
  </div>

  <!-- Status filter -->
  <div class="relative">
    <select
      [(ngModel)]="statusFilter"
      (change)="onStatusChange()"
      class="h-10.5 px-3 pl-8 rounded-xl text-[13px] text-ink cursor-pointer outline-none transition-colors duration-200 appearance-none w-full bg-surface-subtle border-[1.5px] border-border focus:border-primary-light"
      style="font-family: var(--font)"
    >
      <option value="all">كل الحالات</option>
      <option value="active">نشط</option>
      <option value="hidden">مخفي</option>
      <option value="drafted">مسودة</option>
    </select>

    <ng-icon
      name="bootstrapChevronDown"
      class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-subtle text-xs pointer-events-none"
    ></ng-icon>
  </div>

  <!-- Upload button -->
  <a
    routerLink="upload-materials"
    class="flex items-center gap-2 h-10.5 px-4 rounded-3xl text-[13px] font-bold text-ink-subtle no-underline whitespace-nowrap transition-all duration-150 hover:text-ink"
    style="
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid var(--color-border);
      font-family: var(--font);
    "
  >
    <ng-icon name="bootstrapCloudUpload" class="text-[15px]"></ng-icon>
    رفع مواد
  </a>

  <!-- Add lesson button -->
  <a
    routerLink="add"
    class="flex items-center gap-2 h-10.5 px-4 rounded-3xl text-[13px] font-bold text-white no-underline whitespace-nowrap transition-all duration-150 hover:opacity-90 hover:-translate-y-px"
    style="
      background: var(--color-primary);
      box-shadow: 0 4px 16px var(--color-primary-glow);
      font-family: var(--font);
    "
  >
    <ng-icon name="bootstrapPlusLg" class="text-[15px]"></ng-icon>
    إضافة درس جديد
  </a>
</div>
