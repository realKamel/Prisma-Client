<div
  class="mb-6 flex flex-wrap items-center gap-3"
  ngmMotion
  [initial]="{ opacity: 0, y: 10 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26, delay: 0.1 }"
>
  <!-- Search -->
  <!-- <div
    class="focus-within:border-primary-light flex h-10.5 min-w-full flex-1 items-center gap-2 rounded-xl px-3 transition-colors duration-200 sm:min-w-55"
    style="background: var(--color-surface-subtle); border: 1.5px solid var(--color-border)"
  >
    <ng-icon
      name="bootstrapSearch"
      class="text-muted flex-shrink-0 text-sm"
    ></ng-icon>
    <input
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
      type="text"
      placeholder="ابحث عن درس..."
      autocomplete="off"
      class="font-font flex-1 bg-transparent text-[13px] outline-none"
    />
  </div> -->

  <app-search-input
    [(content)]="searchQuery"
    class="flex-1"
    placeholder="ابحث عن درس..."
  ></app-search-input>

  <!-- Status filter -->
  <div class="relative">
    <select
      [(ngModel)]="statusFilter"
      (change)="onStatusChange()"
      class="text-ink bg-surface-subtle border-border focus:border-primary-light h-10.5 w-full cursor-pointer appearance-none rounded-xl border-[1.5px] px-3 ps-8 text-[13px] transition-colors duration-200 outline-none"
      style="font-family: var(--font)"
    >
      <option value="all">كل الحالات</option>
      <option value="active">نشط</option>
      <option value="hidden">مخفي</option>
      <option value="drafted">مسودة</option>
    </select>

    <ng-icon
      name="bootstrapChevronDown"
      class="text-ink-subtle pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-xs"
    ></ng-icon>
  </div>

  <!-- Upload button -->
  <a
    routerLink="upload-materials"
    class="text-ink-subtle hover:text-ink flex h-10.5 items-center gap-2 rounded-3xl px-4 text-[13px] font-bold whitespace-nowrap no-underline transition-all duration-150"
    style="
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid var(--color-border);
      font-family: var(--font);
    "
  >
    <ng-icon
      name="bootstrapCloudUpload"
      class="text-[15px]"
    ></ng-icon>
    رفع مواد
  </a>

  <!-- Add lesson button -->
  <a
    routerLink="add"
    class="flex h-10.5 items-center gap-2 rounded-3xl px-4 text-[13px] font-bold whitespace-nowrap text-white no-underline transition-all duration-150 hover:-translate-y-px hover:opacity-90"
    style="
      background: var(--color-primary);
      box-shadow: 0 4px 16px var(--color-primary-glow);
      font-family: var(--font);
    "
  >
    <ng-icon
      name="bootstrapPlusLg"
      class="text-[15px]"
    ></ng-icon>
    إضافة درس جديد
  </a>
</div>
