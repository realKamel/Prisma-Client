<app-delete-modal
  [open]="modal().open"
  [lessonName]="modal().lessonName"
  (confirmed)="onDeleteConfirm()"
  (cancelled)="closeModal()"
/>

<div
  class="mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <div
    class="mb-8"
    ngmMotion
    [initial]="{ opacity: 0, y: -8 }"
    [animate]="{ opacity: 1, y: 0 }"
    [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
  >
    <h1 class="text-2xl sm:text-3xl font-black text-ink leading-none mb-2 mt-0">دروسي</h1>
    <p class="text-sm text-muted m-0">إدارة جميع الدروس · {{ totalCount() | number }} دروس</p>
  </div>

  <app-lessons-toolbar (searchChange)="onSearch($event)" (statusChange)="onStatusChange($event)" />

  <app-lessons-table
    [lessons]="filteredLessons()"
    (toggleStatus)="onToggle($event)"
    (deleteLesson)="onDeleteRequest($event)"
  />
</div>
