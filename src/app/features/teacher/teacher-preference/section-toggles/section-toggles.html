<div class="bg-[var(--surface2)] border border-[var(--border)] rounded-2xl p-6">
  <p class="text-xs font-bold tracking-widest text-[var(--muted)] uppercase mb-1">
    أقسام صفحة الهبوط
  </p>
  <p class="text-sm text-[var(--muted)] mb-6 leading-relaxed">
    اختار الأقسام اللي هتظهر للطلاب على الصفحة الرئيسية
  </p>

  <div class="flex flex-col">
    @for (s of sections(); track s.key) {
      <div
        class="flex items-center justify-between gap-4 py-4 border-b border-[var(--border)] last:border-b-0"
      >
        <div class="flex-1 min-w-0">
          <p class="text-sm font-bold text-[var(--ink)] leading-snug">{{ s.nameAr }}</p>
          <p class="text-xs text-[var(--muted)] mt-1 leading-relaxed">{{ s.descAr }}</p>
        </div>

        @if (s.alwaysOn) {
          <span
            class="text-xs font-bold px-3 py-1 rounded-full bg-[var(--surface2)] text-[var(--muted)] border border-[var(--border)] whitespace-nowrap flex-shrink-0"
          >
            دايمًا ظاهر
          </span>
        } @else {
          <!-- Toggle switch -->
          <button
            (click)="toggle(s)"
            [attr.aria-checked]="s.enabled"
            [attr.aria-label]="'إظهار قسم ' + s.nameAr"
            role="switch"
            class="relative w-11 h-6 rounded-full border-none cursor-pointer flex-shrink-0 transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--purple)]"
            [style.background]="s.enabled ? 'var(--purple)' : 'var(--border)'"
          >
            <span
              class="absolute top-[3px] left-[3px] w-[18px] h-[18px] rounded-full bg-white shadow-sm transition-transform duration-200"
              [style.transform]="s.enabled ? 'translateX(20px)' : 'translateX(0)'"
            >
            </span>
          </button>
        }
      </div>
    }
  </div>

  <!-- Save row -->
  <div class="flex items-center gap-3 pt-5 border-t border-[var(--border)] flex-wrap mt-2">
    <button
      (click)="save()"
      [disabled]="saving()"
      class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[var(--purple)] hover:opacity-90 text-white text-sm font-bold transition-all duration-150 disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-[var(--purple)]"
    >
      @if (saving()) {
        <svg
          class="w-4 h-4 animate-spin"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 2a10 10 0 0 1 10 10" />
        </svg>
      }
      <span>حفظ الإعدادات</span>
    </button>

    @if (saved()) {
      <span class="inline-flex items-center gap-1.5 text-sm font-bold text-[var(--mint)]">
        <svg
          class="w-4 h-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
        تم الحفظ
      </span>
    }
  </div>
</div>
