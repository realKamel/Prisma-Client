<div class="bg-surface-subtle border-border rounded-2xl border p-6">
  <p class="text-muted mb-1 text-xs font-bold tracking-widest uppercase">أقسام صفحة الهبوط</p>
  <p class="text-muted mb-6 text-sm leading-relaxed">
    اختار الأقسام اللي هتظهر للطلاب على الصفحة الرئيسية
  </p>

  <div class="flex flex-col">
    @for (s of sections(); track s.key) {
      <div
        class="border-border flex items-center justify-between gap-4 border-b py-4 last:border-b-0"
      >
        <div class="min-w-0 flex-1">
          <p class="text-ink text-sm leading-snug font-bold">{{ s.nameAr }}</p>
          <p class="text-muted mt-1 text-xs leading-relaxed">{{ s.descAr }}</p>
        </div>

        @if (s.alwaysOn) {
          <span
            class="bg-surface-subtle text-muted border-border flex-shrink-0 rounded-full border px-3 py-1 text-xs font-bold whitespace-nowrap"
          >
            دايمًا ظاهر
          </span>
        } @else {
          <!-- Toggle switch -->
          <button
            (click)="toggle(s)"
            [attr.aria-checked]="s.enabled"
            [attr.aria-label]="'إظهار قسم ' + s.nameAr"
            role="switch"
            class="focus-visible:ring-primary relative h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-none transition-colors duration-200 focus:outline-none focus-visible:ring-2"
            [style.background]="s.enabled ? 'var(--color-primary)' : 'var(--color-border)'"
          >
            <span
              class="absolute inset-s-0.75 top-0.75 h-4.5 w-4.5 rounded-full bg-white shadow-sm transition-transform duration-200"
              [style.transform]="s.enabled ? 'translateX(20px)' : 'translateX(0)'"
            >
            </span>
          </button>
        }
      </div>
    }
  </div>

  <!-- Save row -->
  <div class="border-border mt-2 flex flex-wrap items-center gap-3 border-t pt-5">
    <button
      (click)="save()"
      [disabled]="saving()"
      class="bg-primary focus-visible:ring-primary inline-flex items-center gap-2 rounded-xl px-5 py-2.5 text-sm font-bold text-white transition-all duration-150 hover:opacity-90 focus:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (saving()) {
        <svg
          class="h-4 w-4 animate-spin"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M12 2a10 10 0 0 1 10 10" />
        </svg>
      }
      <span>حفظ الإعدادات</span>
    </button>

    @if (saved()) {
      <span class="text-mint inline-flex items-center gap-1.5 text-sm font-bold">
        <svg
          class="h-4 w-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
        تم الحفظ
      </span>
    }
  </div>
</div>
