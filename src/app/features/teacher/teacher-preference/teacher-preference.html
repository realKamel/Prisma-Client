<div
  class="text-ink font-font mx-auto max-w-7xl p-4 pt-20 md:p-6 lg:p-8"
  ngmMotion
  [initial]="{ opacity: 0, y: 16 }"
  [animate]="{ opacity: 1, y: 0 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
>
  <!-- Page header -->
  <div class="mb-8 flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-ink mb-1 text-2xl font-black sm:text-3xl">التخصيص</h1>
      <p class="text-muted text-sm">اضبط مظهر المنصة وإعداداتها حسب أسلوبك</p>
    </div>
  </div>

  <!-- Tab bar -->
  <div
    class="border-border mb-6 flex gap-1 border-b"
    role="tablist"
  >
    @for (tab of tabs; track tab.key) {
      <button
        (click)="setTab(tab.key)"
        [attr.aria-selected]="activeTab() === tab.key"
        role="tab"
        class="focus-visible:ring-primary -mb-px cursor-pointer border-b-2 px-5 py-3 text-sm font-bold whitespace-nowrap transition-all duration-150 focus:outline-none focus-visible:ring-2"
        [style.color]="
          activeTab() === tab.key ? 'var(--color-primary-light)' : 'var(--color-muted)'
        "
        [style.borderBottomColor]="activeTab() === tab.key ? 'var(--color-primary)' : 'transparent'"
      >
        {{ tab.label }}
      </button>
    }
  </div>

  <!-- TAB: THEME -->
  @if (activeTab() === 'theme') {
    <div role="tabpanel">
      <app-color-picker />
    </div>
  }

  <!-- TAB: SETTINGS -->
  @if (activeTab() === 'settings') {
    <div
      role="tabpanel"
      class="flex flex-col gap-6"
    >
      <app-announcement />
      <app-section-toggles />
    </div>
  }
</div>
