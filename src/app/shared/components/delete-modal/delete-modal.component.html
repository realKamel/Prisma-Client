<div
  ngmMotion
  [initial]="{ opacity: 0, scale: 0.7 }"
  [animate]="{ opacity: 1, scale: 1 }"
  [exit]="{ opacity: 0, scale: 0.7 }"
  [transition]="{ type: 'spring', stiffness: 280, damping: 26 }"
  tabindex="0"
  class="bg-surface rounded-20 border-primary-glow relative mx-4 flex w-full max-w-105 flex-col gap-5 border p-8 shadow"
  (click)="$event.stopPropagation()"
  (keydown)="$event.stopPropagation()"
>
  <!-- Icon -->
  <div
    class="border-coral/70 bg-coral/10 mx-auto flex h-14 w-14 items-center justify-center rounded-2xl border"
  >
    <ng-icon
      name="bootstrapTrash3Fill"
      class="text-coral text-3xl"
    ></ng-icon>
  </div>

  <!-- Title & body -->
  <div class="text-center">
    <h2 class="text-ink mt-0 mb-2 text-xl font-black">
      {{ 'COMMON.DELETE_MODAL.TITLE' | translate }}
    </h2>
    <p class="text-muted m-0 text-sm leading-relaxed">
      @if (data().message) {
        {{ data().message }}
      } @else {
        {{ 'COMMON.DELETE_MODAL.MESSAGE' | translate: { title: data().title } }}
      }
    </p>
  </div>

  <!-- Actions -->
  <div class="mt-1 flex gap-3">
    <button
      type="button"
      (click)="dialogRef.close(false)"
      class="text-ink-subtle bg-surface hover:bg-surface-subtle h-11.5 flex-1 cursor-pointer rounded-3xl border text-sm font-bold transition-all duration-150"
    >
      {{ 'COMMON.DELETE_MODAL.CANCEL' | translate }}
    </button>
    <button
      type="button"
      (click)="dialogRef.close(true)"
      class="font-font bg-coral rounded-card border-coral flex h-11.5 flex-1 cursor-pointer items-center justify-center border text-sm font-bold text-white transition-all duration-150 hover:opacity-90"
    >
      <ng-icon
        name="bootstrapTrash3"
        class="me-1"
      ></ng-icon>
      {{ 'COMMON.DELETE_MODAL.CONFIRM' | translate }}
    </button>
  </div>
</div>
