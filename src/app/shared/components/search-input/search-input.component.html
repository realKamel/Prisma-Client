<div class="relative w-full">
  <!-- Search Icon with subtle reactive animation -->
  <ng-icon
    name="bootstrapSearch"
    ngmMotion
    [initial]="{ y: '-50%', scale: 1 }"
    [animate]="{ y: '-50%', scale: query() ? 1.15 : 1 }"
    [transition]="{ type: 'spring', stiffness: 400, damping: 25 }"
    class="text-muted pointer-events-none absolute inset-s-3 top-1/2 z-10 text-lg transition-colors duration-200"
  />

  <!-- Input Field -->
  <input
    type="text"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [class]="mergedClasses()"
    [value]="query()"
    (input)="processInput($any($event.target).value)"
  />

  <!-- Clear Button with satisfying tactile feedback -->
  @if (query()) {
    <button
      type="button"
      (click)="clearSearch()"
      ngmMotion
      [initial]="{ opacity: 0, scale: 0.5, y: '-50%' }"
      [animate]="{ opacity: 1, scale: 1, y: '-50%' }"
      [exit]="{ opacity: 0, scale: 0.5, y: '-50%' }"
      [whileHover]="{ scale: 1.1 }"
      [whileTap]="{ scale: 0.8, rotate: 90 }"
      [transition]="{ type: 'spring', stiffness: 400, damping: 20 }"
      aria-label="Clear search"
      class="absolute inset-e-3 top-1/2 z-10 flex cursor-pointer items-center justify-center text-2xl text-gray-400 transition-colors duration-200 hover:text-gray-600 focus:outline-none"
    >
      <ng-icon name="bootstrapX" />
    </button>
  }
</div>
