<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title id="page-title">PRISMA</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('lang') || 'ar';
          var theme = localStorage.getItem('prisma-theme') || 'dark';
          if (lang === 'en') {
            document.documentElement.setAttribute('lang', 'en');
            document.documentElement.setAttribute('dir', 'ltr');
          }
          if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/assets/styles/init.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root>
      <!-- Color-Agnostic Initial Loader -->
      <div class="initial-loader" id="splash-loader">
        <div class="loader-badge">P</div>
        <h1 class="loader-title" id="splash-title">بريزما</h1>
        <p class="loader-sub" id="splash-sub">جاري تحميل المنصة...</p>

        <div class="loader-track">
          <div class="loader-bar"></div>
        </div>
      </div>
    </app-root>
    <script src="assets/scripts/init.js" defer=""></script>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
